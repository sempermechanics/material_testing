<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- Hosting serves this page, with status 404, for any address that has no
       file. It needs no script: the refresh below goes to /login (the
       dashboards' front door; this host has no page at /) after 5 s, and the
       bar is CSS timed to match. A script would be refused on /console/**
       paths anyway, whose policy has no 'unsafe-inline'. Paths are absolute
       because the page is served at whatever address was asked for. -->
  <meta http-equiv="refresh" content="5; url=/login" />
  <title>Page not found · Semper DIC</title>
  <link rel="icon" type="image/webp" href="/console/semper-icon.webp" />
  <style>
    /* The console's tokens (console/console.css). */
    :root {
      color-scheme: dark;
      --bg: #0c0f14; --card: #1a2230; --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.2); --ink: #eef1f6; --muted: #a8b2c1;
      --accent: #d4a054; --accent-hover: #e4b46a;
      --font: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: "Plus Jakarta Sans", var(--font);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: 1.5rem 1rem; background: var(--bg); color: var(--ink);
      font-family: var(--font); font-size: 1rem; line-height: 1.6;
    }
    main {
      width: min(100%, 28rem); padding: 2rem 1.75rem; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .brand {
      display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; text-decoration: none;
      font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: -.03em;
    }
    .brand img { width: 1.7rem; height: 1.7rem; border-radius: 6px; display: block; }
    h1 {
      font-family: var(--font-display); font-size: 1.6rem; line-height: 1.2;
      letter-spacing: -.02em; margin: 1.5rem 0 .5rem;
    }
    p { margin: 0 0 1rem; color: var(--muted); }
    .going { margin: 1.5rem 0 1rem; }
    .going p { margin: 0 0 .5rem; color: var(--ink); font-size: .95rem; }
    .bar { height: 4px; border-radius: 999px; background: var(--line-strong); overflow: hidden; }
    .bar span {
      display: block; height: 100%; width: 100%; background: var(--accent);
      transform-origin: left; animation: fill 5s linear forwards;
    }
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    /* Asked for less motion: the bar stands still, and the words say the rest. */
    @media (prefers-reduced-motion: reduce) { .bar span { animation: none; } }
    .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: .55rem 1.1rem; border-radius: 8px; background: var(--accent); color: var(--bg);
      font-weight: 600; text-decoration: none;
    }
    .button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/login"><img src="/console/semper-mark.webp" alt="" width="28" height="28" />semper</a>
    <h1>This page doesn't exist</h1>
    <p>The address may be mistyped, or the page may have moved.</p>
    <div class="going" role="status">
      <p>Taking you to the dashboard sign-in…</p>
      <div class="bar" aria-hidden="true"><span></span></div>
    </div>
    <a class="button" href="/login">Go there now</a>
  </main>
</body>
</html>
