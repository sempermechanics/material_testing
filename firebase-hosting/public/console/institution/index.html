<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seats · Semper DIC</title>
  <link rel="stylesheet" href="../console.css" />
</head>
<body>
  <header>
    <span class="brand">Semper&nbsp;DIC</span>
    <h1>Institution seats</h1>
    <span class="spacer"></span>
    <span id="who" class="muted"></span>
    <button id="signIn">Sign in with Google</button>
    <button id="signOut" class="secondary" hidden>Sign out</button>
  </header>

  <main>
    <div id="app" hidden>
      <section class="card">
        <h2>Licence</h2>
        <p class="muted">
          Paste the licence id your Semper contact gave you. You can only open
          licences that name your address as an administrator.
        </p>
        <div class="row">
          <input id="licenseId" size="44" placeholder="licence id"
                 autocomplete="off" spellcheck="false" />
          <button id="load">Open</button>
        </div>
        <p id="status" class="muted"></p>
        <div id="summary"></div>
      </section>

      <section class="card" id="rosterCard" hidden>
        <h2>Roster</h2>
        <p class="muted" id="rosterHelp"></p>
        <div class="row" style="margin-bottom:1rem">
          <input id="addEmail" size="32" type="email" placeholder="name@institution.edu"
                 autocomplete="off" />
          <button id="add">Add member</button>
        </div>
        <div class="wrap">
          <table>
            <thead>
              <tr>
                <th>Member</th><th>Status</th><th>Seat</th><th>Device</th>
                <th class="actions">Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>

    <p id="signedOut" class="muted">Sign in to manage your institution's seats.</p>
  </main>

  <script type="module" src="institution.js"></script>
</body>
</html>
