title = "IndicVision secret scanning"

[extend]
useDefault = true

# gitleaks-action pins CLI 8.24.3, which honors the singular [allowlist]
# block (not [[allowlists]]). Keep this shape so full-history workflow_dispatch
# scans match local 8.28+ behavior for these known historical client keys.

[allowlist]
description = "Public/client identifiers and deleted historical noise (not Admin secrets)"
# Paths stay exempt only while something legitimately lives there. Firebase
# client config is public by design. SupabaseManager.kt was added in the
# allowlisted b9e9065 and changed in three more commits (9a72b92, f2ffb67,
# ffbe54e) before its deletion in 747d371, so its rule stays until a
# full-history scan shows those three add nothing (TD-47). local.properties is NOT exempt: its one
# historical add (46e50fd) is allowlisted by commit below, so a future
# accidental commit of it — the file that holds signing and API settings —
# gets scanned. The website-sync patch rule matched no file in any ref.
paths = [
  '''(^|/)google-services\.json$''',
  '''(^|/)SupabaseManager\.kt$''',
]
commits = [
  '''9a3623ad444512d0f8033a3aa067e44bdf0e7347''',
  '''46dbc6056cab69da9a0d73560babe57afb139fd9''',
  '''46e50fd23512e481f4d1a4c3697eb3d6aec6d68f''',
  '''b9e90658bda6fcb1f1a6a5daed5e109dc8c520c5''',
]
