title = "Semper secret scanning"

[extend]
useDefault = true

# gitleaks-action pins CLI 8.24.3, which honors the singular [allowlist]
# block (not [[allowlists]]). Keep this shape so full-history workflow_dispatch
# scans match local 8.28+ behavior for these known historical client keys.

[allowlist]
description = "Public/client identifiers and deleted historical noise (not Admin secrets)"
# Paths stay exempt only while something legitimately lives there. Firebase
# client config is public by design. The two commits are the only historical
# adds that still need a pass, checked with a full-history scan on 2026-09-23
# under CLI 8.24.3 (the action's) and 8.28.0 (TD-47): b9e9065 added the deleted
# SupabaseManager.kt with a client key; 46e50fd is the one historical add of
# local.properties. local.properties itself is NOT exempt, so a future
# accidental commit of it (signing and API settings) gets scanned. Removed as
# redundant: the SupabaseManager.kt path (its later commits add nothing), and
# commits 9a3623a (its only hit is google-services.json) and 46dbc60 (no hit).
# The entitlement test vectors hold signed test tokens (the default `jwt`
# rule matches any compact JWS), made with keys derived from seeds printed in
# the backend file or generated per run for the Android one: TEST ONLY by
# construction, and never accepted by a real build (its pins hold only
# production kids).
paths = [
  '''(^|/)google-services\.json$''',
  '''(^|/)entitlement_vector[A-Za-z_]*\.json$''',
]
commits = [
  '''46e50fd23512e481f4d1a4c3697eb3d6aec6d68f''',
  '''b9e90658bda6fcb1f1a6a5daed5e109dc8c520c5''',
]
# Matched secrets that are not secrets. A PR scan reads every commit's patch,
# so a placeholder later replaced still fails it; these stay pinned to the
# exact text rather than a path or a commit (a rebase changes commit ids).
# - A compact JWS whose header names a `test-` kid: the entitlement test
#   tokens (`{"alg":"ES256","kid":"test-…` base64url). Production kids are
#   `ent-N`, so a real signed token still trips the jwt rule.
# - `REGION=asia-south1`: generic-api-key reads the empty `API_SA=""` line
#   above it in scripts/check_gcp_posture.sh as a key assignment.
regexes = [
  '''^eyJhbGciOiJFUzI1NiIsImtpZCI6InRlc3Qt''',
  '''^REGION=asia-south1$''',
]
