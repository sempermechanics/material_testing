# The step-up revocation check could not answer (backend/app/deps.py,
# `revocation_check_failed`): verify_id_token(check_revoked=True) raised
# something other than revoked / disabled, so the caller was refused 401
# invalid_token (fail closed) and audited AUTH_DENIED stage
# `revocation_check`. Usually the runtime account lost
# roles/firebaseauth.admin on the Auth project, or the Auth API is down.
# Only reachable with CHECK_REVOKED_ON_STEP_UP on.
description: Step-up revocation checks that failed to answer, by exception class.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="__SERVICE__"
  AND jsonPayload.event="revocation_check_failed"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  displayName: semper-api revocation check failures
  labels:
    - key: errorCode
      valueType: STRING
      description: The exception class the check raised.
    - key: appId
      valueType: STRING
      description: The calling app (X-App-Id, listed ids only; empty from a browser).
labelExtractors:
  errorCode: EXTRACT(jsonPayload.errorCode)
  appId: EXTRACT(jsonPayload.appId)
