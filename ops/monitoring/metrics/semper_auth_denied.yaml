# Authentication refusals: the AUTH_DENIED audit action (backend/app/deps.py),
# once audit.record() also writes it to Cloud Logging. Firestore audit_logs
# stays the compliance record; this is the operational counter.
description: AUTH_DENIED refusals (bad or missing token, App Check, device), by stage.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="__SERVICE__"
  AND jsonPayload.action="AUTH_DENIED"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  displayName: semper-api AUTH_DENIED
  labels:
    - key: stage
      valueType: STRING
      description: Where the refusal happened (id_token, app_check, device, ...).
labelExtractors:
  stage: EXTRACT(jsonPayload.stage)
