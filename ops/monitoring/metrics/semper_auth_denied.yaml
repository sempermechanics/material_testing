# Authentication refusals: the AUTH_DENIED audit action (backend/app/deps.py),
# counted from any log line that carries `action`, once audit.record() writes
# one per row (today it writes only Firestore audit_logs, so this stays at
# zero). An audit_write_failed line also carries `action`; it is a lost row,
# not a refusal, so it is excluded here and counted by its own metric.
description: AUTH_DENIED refusals (bad or missing token, App Check, device), by stage.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="__SERVICE__"
  AND jsonPayload.action="AUTH_DENIED"
  AND jsonPayload.event!="audit_write_failed"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  displayName: semper-api AUTH_DENIED
  labels:
    - key: stage
      valueType: STRING
      description: Where the refusal happened (id_token, app_check, device, ...).
labelExtractors:
  stage: EXTRACT(jsonPayload.stage)
