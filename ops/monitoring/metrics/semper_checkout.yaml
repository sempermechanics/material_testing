# Floating-seat checkouts (a lease taken). Dashboard signal for seat use and
# for a licence that suddenly checks out far more than usual.
description: Floating-seat checkouts, by licence id.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="__SERVICE__"
  AND jsonPayload.event="checkout"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  displayName: semper-api seat checkouts
  labels:
    - key: licenseId
      valueType: STRING
      description: The account's licence.
    - key: outcome
      valueType: STRING
      description: ok or refused.
    - key: errorCode
      valueType: STRING
      description: The refusal code (empty when ok).
    - key: appId
      valueType: STRING
      description: The calling app (X-App-Id, listed ids only).
labelExtractors:
  licenseId: EXTRACT(jsonPayload.licenseId)
  outcome: EXTRACT(jsonPayload.outcome)
  errorCode: EXTRACT(jsonPayload.errorCode)
  appId: EXTRACT(jsonPayload.appId)
