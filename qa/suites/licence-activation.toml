# Licence per app, explicit activation, device count, upgrade by issue
# (ADR-033). One [[scenario]] per check; ids are L<group>.<n>, stable and
# never reused. Retire a scenario with status = "retired" and a `note`; never
# delete it. Add one by taking the next number in its group and raising that
# group in [issued]. Field reference: qa/SCHEMA.md.

schema = 1
id = "licence-activation"
title = "Licence per app, explicit activation, device count, upgrade by issue"
prefix = "L"
since = "ADR-033"

# The highest number ever issued in each group. Every id up to it must still
# be in this file (retired or not); a new id raises it by one.
[issued]
L1 = 6
L2 = 12
L3 = 6
L4 = 8
L5 = 7
L6 = 7
L7 = 7
L8 = 5
L9 = 7
L10 = 8
L11 = 2
L12 = 4
L13 = 5
L14 = 7
L15 = 7

# ===========================================================================
# L1 Sign-in and registration
# ===========================================================================

[[scenario]]
id = "L1.1"
title = "Second and third phones sign in and run as Demo"
area = "registration"
tags = ["holder", "semper", "demo"]
accounts = ["qc-ind1"]
needs = ["emulator"]
human_gate = []
steps = [
  "Phone 1: sign in as qc-ind1 and tap Activate",
  "Phone 2: sign in as qc-ind1",
  "Phone 3: sign in as qc-ind1 (a clean reinstall registers a new phone; confirm it in Your phones)",
]
expected = "Phones 2 and 3 sign in without a device_conflict; Home shows Demo and 'Licensed on 1 of 1 phones'"
automation = "planned:androidTest:StagingActivationDeviceTest#secondPhoneIsDemo"
status = "active"
since = "ADR-033"

[[scenario]]
id = "L1.2"
title = "The MAX_PHONES_PER_APP cap retires the oldest phone that is not activated"
area = "registration"
tags = ["holder", "semper", "cap"]
accounts = ["qc-ind1"]
needs = ["emulator", "backend"]
human_gate = []
steps = [
  "Register phones until the account holds MAX_PHONES_PER_APP (5) for Semper, one of them activated",
  "Register one more",
]
expected = "The new phone signs in; the oldest phone that is not activated is retired and must sign in again; the activated phone is untouched"
automation = "manual"
status = "active"
since = "ADR-033"

[[scenario]]
id = "L1.3"
title = "With every phone activated, the next sign-in says to deactivate a phone"
area = "registration"
tags = ["holder", "semper", "cap"]
accounts = ["qc-ind2"]
needs = ["emulator", "backend"]
human_gate = ["staff-step-up"]
steps = [
  "Staff raise qc-ind2's Semper maxDevices to 5",
  "Register and activate five phones",
  "Sign in on a sixth",
]
expected = "The sixth phone is refused with the 'deactivate a phone' message, not auth_phone_linked_elsewhere"
automation = "manual"
status = "active"
since = "ADR-033"

[[scenario]]
id = "L1.4"
title = "device_in_use across accounts"
area = "registration"
tags = ["holder", "semper", "negative"]
accounts = ["qc-ind1", "qc-ind2"]
needs = ["emulator"]
human_gate = []
steps = [
  "Sign in as qc-ind1 on a phone",
  "Sign out and sign in as qc-ind2 on the same phone, same app",
]
expected = "device_in_use, with its own sentence; qc-ind1's activation is unchanged"
automation = "manual"
status = "active"
since = "ADR-033"

[[scenario]]
id = "L1.5"
title = "A phone released by staff or IT is held off for 24 h"
area = "registration"
tags = ["staff", "it", "semper", "hold"]
accounts = ["qc-ind1"]
needs = ["emulator", "web"]
human_gate = ["staff-step-up"]
steps = [
  "Staff: Sign a lost phone out for qc-ind1's activated phone",
  "On that phone, sign in again within 24 h",
]
expected = "The sign-in is refused with the hold message and the time it ends; a holder's own deactivate (L3.1) sets no hold"
automation = "manual"
status = "active"
since = "ADR-033"

[[scenario]]
id = "L1.6"
title = "A full QC account refuses a new phone"
area = "registration"
tags = ["staff", "semper", "test-account"]
accounts = ["qc-ind1"]
needs = ["emulator"]
human_gate = []
steps = [
  "Sign in on as many phones as qc-ind1's 'Phones that may sign in' allows",
  "Sign in on one more",
]
expected = "The extra phone is refused by the test account's registration cap, which is separate from the licence's maxDevices"
automation = "manual"
status = "active"
since = "ADR-033"

