name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_ci:
        description: 'Run every tier (ignore path filters)'
        type: boolean
        default: false
      run_benchmark:
        description: 'Run Macrobenchmark startup suite on an emulator'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; jobs that prune caches or read PRs widen it themselves.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pull-requests:read needed by gitleaks-action on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Dependabot branches: no Actions secrets (fork-like) and the org
      # gitleaks-action also 403s the PR commits API under Dependabot's
      # token. Key off head_ref (not actor) so rebases by humans/bots still
      # take the CLI path. Prefer also setting Dependabot secret
      # GITLEAKS_LICENSE if you later want the action on those PRs.
      - name: Scan repository and Git history
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Scan with gitleaks CLI (Dependabot branches)
        if: ${{ startsWith(github.head_ref, 'dependabot/') }}
        env:
          # Match gitleaks-action PR mode: only commits on the PR, not full history
          # (full history still surfaces pre-allowlist noise like old client keys).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VER=8.28.0
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          TARBALL="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSfLO "${BASE}/${TARBALL}"
          # Verify against the release's published checksums before running it.
          curl -sSfL "${BASE}/gitleaks_${VER}_checksums.txt" \
            | grep " ${TARBALL}$" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact \
            --log-opts="${BASE_SHA}..HEAD"

  legal-pages:
    name: Legal pages match their source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The published /privacy/ and /terms/ pages are generated from
    # docs/legal/*.md. They were previously placeholders whose own body said
    # "keep this in sync before launch" while the app linked to them as the real
    # policy. This makes drift a build failure instead of a promise.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/render_legal_pages.py --check

      # The docs map hundreds of source paths (docs/WORKFLOWS.md maps every
      # workflow to its files). A rename silently rots those references, and a
      # map that points at a file which no longer exists is worse than no map.
      # Skips the engine submodule, which this job does not check out.
      - name: Docs reference files that exist
        run: python scripts/check_doc_paths.py

  console-pages:
    name: Console pages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The consoles have no compiler and no build step, so nothing else in this
    # repository fails when a page's wiring goes stale: the pages load, look
    # right, and do nothing. This is the gate that reads them — inline script
    # against the CSP that forbids it, ids the module asks for, deploy
    # placeholders still unsubstituted, rewrite targets that exist, and every
    # /v1 path declared on the gateway. Seconds to run, so it runs on every
    # event rather than behind a path filter. The node tests cover the
    # DOM-free helpers in console/util.js (roster cells, escaping); sign-in
    # and step-up still need Firebase fixtures and are hand-checked (TD-22).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python scripts/check_console.py
      - name: Console helper tests
        run: node --test "firebase-hosting/tests/*.test.mjs"

  # ===================================================================
  # Path filters — same rules on PR and push. Prove only what the diff
  # can break. Optional full matrix via `full-ci` label or workflow_dispatch.
  # No scheduled/weekly runs.
  # ===================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests:read for the Files API; Dependabot still 403s that API, so
    # PRs also pass base SHA below and paths-filter diffs via local git.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.flags.outputs.app }}
      native_core: ${{ steps.flags.outputs.native_core }}
      native_jni: ${{ steps.flags.outputs.native_jni }}
      backend: ${{ steps.flags.outputs.backend }}
      full_ci: ${{ steps.flags.outputs.full_ci }}
      heavy_ci: ${{ steps.flags.outputs.heavy_ci }}
      benchmark_ci: ${{ steps.flags.outputs.benchmark_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          # Explicit base forces git-diff mode (avoids PR Files API 403 on Dependabot).
          # An empty token is required on pull_request events, else the action
          # ignores `base` and falls back to the Files API (and warns).
          token: ''
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          filters: |
            app:
              - 'app/**'
              - '!app/src/main/cpp/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
            # Engine sources live in sempermechanics/semper-dic-engine. App CI only
            # sees pin bumps (gitlink) / .gitmodules — host/sanitizer suites run
            # in the engine repo's own workflow.
            native_core:
              - 'native'
              - '.gitmodules'
            native_jni:
              - 'native'
              - '.gitmodules'
              - 'app/src/main/cpp/**'
              - 'app/src/main/java/com/indicvision/semper/SemperNativeLib.kt'
            backend:
              - 'backend/**'
              - 'firestore.rules'
              - 'firebase-hosting/**'
              # test_security_controls reads it.
              - 'scripts/deploy-firestore.sh'
              # The client's copies of the three wire contracts. Without these,
              # a rename on an app-only PR skips the backend tier and the tests
              # holding each pair of lists together never run — which is the one
              # thing keeping them in step.
              - 'app/src/main/java/com/indicvision/semper/data/net/ApiErrors.kt'
              - 'app/src/main/java/com/indicvision/semper/data/net/ArtifactRoles.kt'
              - 'app/src/main/java/com/indicvision/semper/data/UploadWorkOutcomes.kt'
            ci_workflow:
              - '.github/workflows/ci.yml'
            android_test:
              - 'app/src/androidTest/**'
            packaging:
              - 'app/build.gradle.kts'
              - 'app/proguard-rules.pro'
              - 'gradle/libs.versions.toml'

      - name: Resolve tier flags
        id: flags
        env:
          FILTER_APP: ${{ steps.filter.outputs.app }}
          FILTER_NATIVE_CORE: ${{ steps.filter.outputs.native_core }}
          FILTER_NATIVE_JNI: ${{ steps.filter.outputs.native_jni }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_CI_WORKFLOW: ${{ steps.filter.outputs.ci_workflow }}
          FILTER_ANDROID_TEST: ${{ steps.filter.outputs.android_test }}
          FILTER_PACKAGING: ${{ steps.filter.outputs.packaging }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          FULL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ci || false }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          E2E_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          RELEASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
          BENCHMARK_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'benchmark') }}
          BENCHMARK_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.run_benchmark || false }}
        run: |
          set -euo pipefail
          full=false
          app=false; native_core=false; native_jni=false; backend=false
          heavy=false  # Tier 3 / 5 on this event
          benchmark=false

          # Push to main (or explicit full_ci) → full matrix.
          if { [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; } \
             || [ "$FULL_DISPATCH" = "true" ] \
             || [ "$FULL_LABEL" = "true" ]; then
            full=true
            heavy=true
          fi

          if [ "$BENCHMARK_LABEL" = "true" ] || [ "$BENCHMARK_DISPATCH" = "true" ]; then
            benchmark=true
          fi

          # Dependabot cheap path: never Tier 3/5; ecosystem picks one light tier.
          if [ "$EVENT_NAME" = "pull_request" ] && [[ "${HEAD_REF:-}" == dependabot/* ]]; then
            full=false
            heavy=false
            case "$HEAD_REF" in
              dependabot/pip/*) backend=true ;;
              dependabot/gradle/*) app=true ;;
              # The backend image. Tier 4 runs on the runner's Python, not the
              # image, but it is the nearest proof and beats gates-only (TD-68).
              dependabot/docker/*) backend=true ;;
              dependabot/github_actions/*) ;; # gates only
              *)
                # Unknown Dependabot ecosystem: stay gates-only.
                ;;
            esac
          elif [ "$full" = "true" ]; then
            app=true; native_core=true; native_jni=true; backend=true
          else
            # PR path mode: Tier 1 / 4 from paths. Fail closed if filters empty
            # (gates only) — do not force a full matrix.
            if [ "$FILTER_APP" = "true" ] || [ "$FILTER_ANDROID_TEST" = "true" ] || [ "$FILTER_PACKAGING" = "true" ]; then
              app=true
            fi
            if [ "$FILTER_NATIVE_CORE" = "true" ]; then native_core=true; fi
            if [ "$FILTER_NATIVE_JNI" = "true" ]; then native_jni=true; fi
            if [ "$FILTER_BACKEND" = "true" ]; then backend=true; fi
            # Editing ci.yml used to be gates-only because this filter was
            # collected and never read. Run the light app + backend tiers so a
            # workflow change cannot skip every real job.
            if [ "$FILTER_CI_WORKFLOW" = "true" ]; then
              app=true
              backend=true
            fi
            if [ "$E2E_LABEL" = "true" ] || [ "$RELEASE_LABEL" = "true" ]; then
              heavy=true
            fi
          fi

          {
            echo "app=$app"
            echo "native_core=$native_core"
            echo "native_jni=$native_jni"
            echo "backend=$backend"
            echo "full_ci=$full"
            echo "heavy_ci=$heavy"
            echo "benchmark_ci=$benchmark"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: app=$app native_core=$native_core native_jni=$native_jni backend=$backend full_ci=$full heavy_ci=$heavy benchmark_ci=$benchmark"

  # ===================================================================
  # Tier 1 — Kotlin compile + JVM unit tests + quality gates (no NDK)
  # ===================================================================
  tier1-app-fast:
    name: Tier 1 — App fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true'
      || needs.changes.outputs.full_ci == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android-build

      - name: Build, test and quality gates
        run: >
          ./gradlew --continue --console=plain
          :app:testDebugUnitTest
          spotlessCheck
          :app:detekt
          :app:lintDebug
          :app:compileReleaseKotlin

      # koverVerify enforces the `minBound` in app/build.gradle.kts (TD-38);
      # koverLog prints the measured number so a raise has evidence.
      - name: Kotlin coverage floor
        run: ./gradlew --console=plain :app:koverLog :app:koverVerify

  # ===================================================================
  # Tier 2 — Engine host / sanitizers
  # Moved to sempermechanics/semper-dic-engine (.github/workflows/ci.yml).
  # App CI only links the pinned submodule (Tier 3 / Tier 5).
  # ===================================================================

  # ===================================================================
  # Tier 3 — Emulator (JNI smoke + AnalysisWizardSmokeTest; not full E2E)
  # Decoupled from Tier 1 so native-jni can run when app Tier 1 is skipped.
  # ===================================================================
  tier3-emulator-e2e:
    name: Tier 3 — Emulator E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
      && (
        needs.changes.outputs.heavy_ci == 'true'
        || needs.changes.outputs.full_ci == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: x86_64

      - uses: ./.github/actions/enable-kvm

      # ubuntu-24.04 images leave ~7GB free after SDK/emulator install; default AVD
      # userdata wants ~7.4GB and fails with "Not enough space to create userdata partition".
      - name: Free disk space for AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # API 34 still has dumpsys gfxinfo framestats; API 37 returns empty
          # and Macrobenchmark startActivityAndWait cannot confirm launch.
          api-level: 34
          arch: x86_64
          disable-animations: true
          # Cap below typical free space so AVD create succeeds on crowded runners.
          disk-size: 4G
          # -no-metrics: without a metrics choice the emulator prints an
          # "ACTION REQUIRED" banner that a future release turns into a blocking prompt.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: >
            ./gradlew :app:connectedDebugAndroidTest
            -PabiFilters=x86_64
            -PnativeCompilerLauncher=ccache
            -Pandroid.testInstrumentationRunnerArguments.notPackage=com.indicvision.semper.benchmark
            --console=plain

      # Gradle names no failing test in the log; the report is in the build dir.
      - name: Report instrumented test results
        if: always()
        run: python3 scripts/ci_test_report.py app/build/outputs/androidTest-results

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-x86_64-
          except-key: cxx-x86_64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-x86_64-
          except-key: ccache-x86_64-${{ steps.native-ci.outputs.cache-infix }}

  # ===================================================================
  # Tier 4 — Backend pytest
  # ===================================================================
  tier4-backend:
    name: Tier 4 — Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.full_ci == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/backend-gate

      - name: Check ops shell scripts parse
        working-directory: .
        run: bash -n scripts/firestore-export.sh scripts/firestore-restore-drill.sh

      # The image installs from requirements.lock with --require-hashes. Prove it
      # resolves on the runtime's Python (3.12) and still covers every direct
      # dependency, so a stale or mis-generated lock fails here rather than in
      # the Cloud Build step of a deploy.
      - name: Verify the hashed lock
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --quiet --require-hashes -r requirements.lock
          /tmp/lockcheck/bin/python -c "import fastapi, uvicorn, google.auth, \
            google.cloud.firestore, google.cloud.tasks_v2, firebase_admin, \
            requests, cryptography, pydantic; print('lock imports OK')"
          python - <<'PY'
          import re, pathlib

          def pins(text):
              """name -> version. Extras stripped: the lock writes uvicorn[standard]."""
              found = {}
              for line in text.splitlines():
                  line = line.strip().lower()
                  if not line or line.startswith(("#", "-", " ")):
                      continue
                  m = re.match(r"^([a-z0-9._-]+)(?:\[[^\]]*\])?\s*==\s*([^\s\\]+)", line)
                  if m:
                      found[m.group(1)] = m.group(2)
              return found

          direct = pins(pathlib.Path("requirements.txt").read_text())
          locked = pins(pathlib.Path("requirements.lock").read_text())
          missing = sorted(set(direct) - set(locked))
          if missing:
              raise SystemExit(f"requirements.txt entries absent from the lock: {missing}")
          mismatched = sorted(
              f"{name}: txt={direct[name]} lock={locked[name]}"
              for name in direct
              if locked[name] != direct[name]
          )
          if mismatched:
              raise SystemExit(
                  "requirements.lock versions differ from requirements.txt: "
                  + "; ".join(mismatched)
              )
          print(f"lock covers all {len(direct)} direct dependencies at matching versions")
          PY

      # Everything above runs against tests/fake_firestore.py, whose transactions
      # apply writes immediately with no isolation and no retries. That makes the
      # concurrency guarantees consume_nonce / complete_file / bump_session_progress
      # exist to provide structurally untestable there. This tier runs the same
      # code against a real Firestore.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java for the emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # firebase-tools 15 dropped emulator support for Java < 21 (v15.0.0 notes).
          java-version: '21'

      - name: Run Firestore emulator tier
        env:
          GOOGLE_CLOUD_PROJECT: semper-ci-emulator
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npm install -g firebase-tools@15.31.0
          firebase emulators:exec \
            --only firestore \
            --config firebase.emulator.json \
            --project semper-ci-emulator \
            'pytest tests/test_firestore_emulator_integration.py -v'

  # ===================================================================
  # Tier 5 — Signed release build (arm64-v8a)
  # Decoupled from Tier 1 so native-jni can run when app Tier 1 is skipped.
  # ===================================================================
  tier5-signed-release:
    name: Tier 5 — Signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
      && (
        needs.changes.outputs.heavy_ci == 'true'
        || needs.changes.outputs.full_ci == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: arm64

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && 'app/release.keystore' || '' }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: >
          ./gradlew --console=plain
          :app:assembleRelease
          -PabiFilters=arm64-v8a
          -PnativeCompilerLauncher=ccache
          -PversionCode="${{ github.run_number }}"

      - uses: ./.github/actions/check-arm64-so

      - name: Verify release signature
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            || { echo "APK is NOT validly signed"; exit 1; }

      - name: Note unsigned build
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "::notice::No signing secrets available — release APK built but signature NOT verified."

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-arm64-
          except-key: cxx-arm64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-arm64-
          except-key: ccache-arm64-${{ steps.native-ci.outputs.cache-infix }}

  # ===================================================================
  # Macrobenchmark — opt-in only (label `benchmark` or dispatch run_benchmark)
  # ===================================================================
  tier-benchmark:
    name: Macrobenchmark startup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.benchmark_ci == 'true'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          # OpenCV's android samples ship ancient gradle-wrapper.jar files that
          # fail checksum validation when submodules are checked out recursively.
          validate-wrappers: false

      - uses: ./.github/actions/enable-kvm

      - name: Run startup Macrobenchmarks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Same image as tier 3. API 37 empties gfxinfo framestats, so
          # startActivityAndWait cannot confirm launch.
          api-level: 34
          arch: x86_64
          # The action's default options plus -no-metrics (see tier 3).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew :benchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY,UNLOCKED

      # Numbers are smoke on an emulator, not a regression gate (see
      # docs/app/TESTING.md), but leaving them uncaptured means every run answers
      # only pass/fail. Keep the raw *-benchmarkData.json/.perfetto-trace files so
      # a real regression is at least visible by hand until thresholds exist.
      # Failing test names and each benchmark's min / median / max into the log.
      - name: Report benchmark results
        if: always()
        run: >
          python3 scripts/ci_test_report.py
          benchmark/build/outputs/androidTest-results
          benchmark/build/outputs/connected_android_test_additional_output

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-results
          path: benchmark/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn

  # ===================================================================
  # ci-ok — single required status check
  # ===================================================================
  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - secret-scan
      - legal-pages
      - console-pages
      - changes
      - tier1-app-fast
      - tier3-emulator-e2e
      - tier4-backend
      - tier5-signed-release
      - tier-benchmark
    steps:
      - name: Check all tiers
        run: |
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.legal-pages.result }}" \
            "${{ needs.console-pages.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.tier1-app-fast.result }}" \
            "${{ needs.tier3-emulator-e2e.result }}" \
            "${{ needs.tier4-backend.result }}" \
            "${{ needs.tier5-signed-release.result }}" \
            "${{ needs.tier-benchmark.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "FAILED: $result"; exit 1 ;;
            esac
          done
          echo "All tiers passed or were skipped."
          echo "Note: engine host/sanitizer/C-SDK CI runs in sempermechanics/semper-dic-engine."
