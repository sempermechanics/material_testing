name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full matrix. A push to main runs the emulator and release tiers
  # only when its diff can break them, so this catches what paths cannot:
  # a new emulator image, an SDK or runner change, a flaky test going red.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      full_ci:
        description: 'Run every tier (ignore path filters)'
        type: boolean
        default: false
      run_benchmark:
        description: 'Run the benchmarks on an emulator (Macrobenchmark + HotPathMicroBenchmark smoke; no A/B without a PR base)'
        type: boolean
        default: false

# A new push cancels a PR's older run. On main a started run finishes (the full
# matrix, ~20 min): cancelling there meant a busy day of merges never finished
# Tier 3 / 5 on main at all (TD-97). GitHub still keeps only the newest pending
# run per group, so a burst of merges runs the one in flight and the latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; jobs that prune caches or read PRs widen it themselves.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pull-requests:read needed by gitleaks-action on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Dependabot branches: no Actions secrets (fork-like) and the org
      # gitleaks-action also 403s the PR commits API under Dependabot's
      # token. Key off head_ref (not actor) so rebases by humans/bots still
      # take the CLI path. Prefer also setting Dependabot secret
      # GITLEAKS_LICENSE if you later want the action on those PRs.
      - name: Scan repository and Git history
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Scan with gitleaks CLI (Dependabot branches)
        if: ${{ startsWith(github.head_ref, 'dependabot/') }}
        env:
          # Match gitleaks-action PR mode: only commits on the PR, not full history
          # (full history still surfaces pre-allowlist noise like old client keys).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VER=8.28.0
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          TARBALL="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSfLO "${BASE}/${TARBALL}"
          # Verify against the release's published checksums before running it.
          curl -sSfL "${BASE}/gitleaks_${VER}_checksums.txt" \
            | grep " ${TARBALL}$" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact \
            --log-opts="${BASE_SHA}..HEAD"

  legal-pages:
    name: Legal pages match their source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The published /privacy/ and /terms/ pages are generated from
    # docs/legal/*.md. They were previously placeholders whose own body said
    # "keep this in sync before launch" while the app linked to them as the real
    # policy. This makes drift a build failure instead of a promise.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/render_legal_pages.py --check

      # The docs map hundreds of source paths (docs/WORKFLOWS.md maps every
      # workflow to its files). A rename silently rots those references, and a
      # map that points at a file which no longer exists is worse than no map.
      # Skips the engine submodule, which this job does not check out.
      - name: Docs reference files that exist
        run: python scripts/check_doc_paths.py

  console-pages:
    name: Console pages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The consoles have no compiler and no build step, so nothing else in this
    # repository fails when a page's wiring goes stale: the pages load, look
    # right, and do nothing. This is the gate that reads them — inline script
    # against the CSP that forbids it, ids the module asks for, deploy
    # placeholders still unsubstituted, rewrite targets that exist, and every
    # /v1 path declared on the gateway. Seconds to run, so it runs on every
    # event rather than behind a path filter. The node tests cover the
    # DOM-free helpers in console/util.js, and auth.js (sign-in, step-up,
    # api, revoke gate), router.js and the three page modules against a fake
    # Firebase SDK and a DOM parsed from the real pages
    # (firebase-hosting/tests/harness.mjs).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python scripts/check_console.py
      # The tests write raw V8 coverage; console_coverage.mjs merges each
      # file's copies (pages load as page.js?load=N, which Node's own report
      # counts apart) and gates the console's line coverage two points
      # under the measured 98.30 % (2026-10-08). Every .js under public/
      # counts, loaded or not, except vendor/. Raise it with the tests that
      # lift it; never lower it.
      - name: Console helper tests
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/console-coverage
        run: node --test "firebase-hosting/tests/*.test.mjs"
      - name: Console line coverage (merged by file)
        run: node scripts/console_coverage.mjs "${{ runner.temp }}/console-coverage" --lines=96

  # ===================================================================
  # Path filters — same rules on PR and push. Prove only what the diff
  # can break. Full matrix: the weekly schedule, the `full-ci` label or
  # workflow_dispatch full_ci.
  # ===================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests:read for the Files API; Dependabot still 403s that API, so
    # PRs also pass base SHA below and paths-filter diffs via local git.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.flags.outputs.app }}
      backend: ${{ steps.flags.outputs.backend }}
      emulator: ${{ steps.flags.outputs.emulator }}
      release_build: ${{ steps.flags.outputs.release_build }}
      benchmark_ci: ${{ steps.flags.outputs.benchmark_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A scheduled run has no diff to read, nor has a push with no base (a
      # zero `before`); both run everything, so skip the filter.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        if: >-
          github.event_name != 'schedule'
          && !(github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        with:
          # Explicit base forces git-diff mode (avoids PR Files API 403 on Dependabot).
          # An empty token is required on pull_request events, else the action
          # ignores `base` and falls back to the Files API (and warns).
          token: ''
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # A file matches a filter on any of its patterns unless a '!' pattern
          # excludes it. The default ('some') made app's '!app/src/main/cpp/**'
          # match every file outside cpp/, so a docs-only PR ran Tier 1
          # (material_testing TD-96).
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - 'app/**'
              - '!app/src/main/cpp/**'
              # The wire bodies ApiDtosContractTest decodes (the backend's
              # test_wire_contracts.py reads the same files).
              - 'contracts/**'
              # The benchmark module builds with the app; without it a
              # benchmark-only PR ran nothing once TD-96 was fixed.
              - 'benchmark/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
            # Engine sources live in sempermechanics/semper-dic-engine. App CI only
            # sees pin bumps (gitlink) / .gitmodules — host/sanitizer suites run
            # in the engine repo's own workflow. Here a bump or a JNI change has
            # to build for both ABIs and run EnginePipelineSmokeTest on the
            # emulator before it merges, not after.
            native_jni:
              - 'engine'
              - '.gitmodules'
              - 'app/src/main/cpp/**'
              - 'app/src/main/java/com/sempermechanics/semper/SemperNativeLib.kt'
            # Composite actions only the emulator and release tiers use.
            native_ci:
              - '.github/actions/setup-native-ci/**'
              - '.github/actions/enable-kvm/**'
              - '.github/actions/check-arm64-so/**'
            backend:
              - 'backend/**'
              - 'firestore.rules'
              # test_wire_contracts holds the shared wire bodies to the routes.
              - 'contracts/**'
              # test_security_controls reads Hosting's firebase.json; the pages
              # themselves are console-pages' job, which runs on every event.
              - 'firebase-hosting/firebase.json'
              # test_security_controls reads these two.
              - 'scripts/deploy-firestore.sh'
              - '.github/workflows/deploy-backend.yml'
              # test_terms_and_consent reads the Terms' version.
              - 'docs/legal/**'
              # Tier 4's ruff is the only lint the ops scripts get.
              - 'scripts/*.py'
              # The client's copies of the three wire contracts. Without these,
              # a rename on an app-only PR skips the backend tier and the tests
              # holding each pair of lists together never run — which is the one
              # thing keeping them in step.
              - 'app/src/main/java/com/sempermechanics/semper/data/net/ApiErrors.kt'
              - 'app/src/main/java/com/sempermechanics/semper/data/net/ArtifactRoles.kt'
              - 'app/src/main/java/com/sempermechanics/semper/data/cloud/UploadWorkOutcomes.kt'
            ci_workflow:
              - '.github/workflows/ci.yml'
              # The composite actions the light tiers run (setup-android-build,
              # backend-gate, prune-cache); a change to one matched nothing.
              - '.github/actions/**'
              # Tier 1 reports its unit tests with it.
              - 'scripts/ci_test_report.py'
            android_test:
              - 'app/src/androidTest/**'
            packaging:
              - 'app/build.gradle.kts'
              - 'app/proguard-rules.pro'
              - 'gradle/libs.versions.toml'
            # What HotPathMicroBenchmark times, the benchmark itself and its
            # gate: a PR touching one runs the benchmark job, whose A/B against
            # the PR's base fails a slowdown (TD-199).
            hot_path:
              - 'app/src/main/java/com/sempermechanics/semper/report/**'
              - 'app/src/main/java/com/sempermechanics/semper/field/DicResult.kt'
              - 'app/src/main/java/com/sempermechanics/semper/ui/viewer/inspect/PointSpatialIndex.kt'
              - 'app/src/main/java/com/sempermechanics/semper/ui/analysis/sweep/SweepStudy.kt'
              - 'app/src/androidTest/java/com/sempermechanics/semper/benchmark/HotPathMicroBenchmark.kt'
              - 'scripts/micro_ab.py'
              - 'benchmark/gates.json'

      - name: Resolve tier flags
        id: flags
        env:
          FILTER_APP: ${{ steps.filter.outputs.app }}
          FILTER_NATIVE_JNI: ${{ steps.filter.outputs.native_jni }}
          FILTER_NATIVE_CI: ${{ steps.filter.outputs.native_ci }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_CI_WORKFLOW: ${{ steps.filter.outputs.ci_workflow }}
          FILTER_ANDROID_TEST: ${{ steps.filter.outputs.android_test }}
          FILTER_PACKAGING: ${{ steps.filter.outputs.packaging }}
          FILTER_HOT_PATH: ${{ steps.filter.outputs.hot_path }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          FULL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ci || false }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          E2E_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          RELEASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
          BENCHMARK_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'benchmark') }}
          BENCHMARK_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.run_benchmark || false }}
        run: |
          set -euo pipefail
          full=false
          app=false; backend=false
          emulator=false        # Tier 3
          release_build=false   # Tier 5
          benchmark=false

          # The weekly schedule, the full-ci label or dispatch full_ci → full
          # matrix. So is a push whose base is unknown (no diff to filter).
          main_push=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            main_push=true
          fi
          if [ "$EVENT_NAME" = "schedule" ] \
             || [ "$FULL_DISPATCH" = "true" ] \
             || [ "$FULL_LABEL" = "true" ] \
             || { [ "$main_push" = "true" ] && [ "${BEFORE//0/}" = "" ]; }; then
            full=true
          fi

          if [ "$BENCHMARK_LABEL" = "true" ] || [ "$BENCHMARK_DISPATCH" = "true" ]; then
            benchmark=true
          fi

          if [ "$full" = "true" ]; then
            app=true; backend=true; emulator=true; release_build=true
          elif [ "$EVENT_NAME" = "pull_request" ] && [[ "${HEAD_REF:-}" == dependabot/* ]]; then
            # Dependabot cheap path: never Tier 3/5; ecosystem picks one light tier.
            case "$HEAD_REF" in
              dependabot/pip/*) backend=true ;;
              dependabot/gradle/*) app=true ;;
              # The backend image. Tier 4 runs on the runner's Python, not the
              # image, but it is the nearest proof and beats gates-only (TD-68).
              dependabot/docker/*) backend=true ;;
              dependabot/github_actions/*) ;; # gates only
              *)
                # Unknown Dependabot ecosystem: stay gates-only.
                ;;
            esac
          else
            # Path mode, on a PR and on a push to main alike. Fail closed if the
            # filters are empty (gates only) — do not force a full matrix.
            if [ "$FILTER_APP" = "true" ] || [ "$FILTER_ANDROID_TEST" = "true" ] || [ "$FILTER_PACKAGING" = "true" ]; then
              app=true
            fi
            if [ "$FILTER_BACKEND" = "true" ]; then backend=true; fi
            # Editing ci.yml used to be gates-only because this filter was
            # collected and never read. Run the light app + backend tiers so a
            # workflow change cannot skip every real job.
            if [ "$FILTER_CI_WORKFLOW" = "true" ]; then
              app=true
              backend=true
            fi
            # An engine bump or a JNI change is proven on the emulator and in
            # the arm64 release build before it merges. These flags were
            # computed and read by no job, so a bump was first built on main.
            if [ "$FILTER_NATIVE_JNI" = "true" ] || [ "$FILTER_NATIVE_CI" = "true" ]; then
              emulator=true
              release_build=true
            fi
            # Keep rules and the release build config only fail under R8, which
            # Tier 1 never runs.
            if [ "$FILTER_PACKAGING" = "true" ]; then release_build=true; fi
            if [ "$E2E_LABEL" = "true" ] || [ "$RELEASE_LABEL" = "true" ]; then
              emulator=true
              release_build=true
            fi
            # A hot-path change on a PR is timed against its base (TD-199).
            # Not on main: the A/B needs a PR's base, and the PR already ran it.
            if [ "$FILTER_HOT_PATH" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
              benchmark=true
            fi
            # Main always reruns the light tiers on the merged tree: they are
            # minutes, and the heavy ones above still follow the diff.
            if [ "$main_push" = "true" ]; then
              app=true
              backend=true
            fi
          fi

          {
            echo "app=$app"
            echo "backend=$backend"
            echo "emulator=$emulator"
            echo "release_build=$release_build"
            echo "benchmark_ci=$benchmark"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: event=$EVENT_NAME full=$full app=$app backend=$backend emulator=$emulator release_build=$release_build benchmark_ci=$benchmark"

  # ===================================================================
  # Tier 1 — Kotlin compile + JVM unit tests + quality gates (no NDK)
  # ===================================================================
  tier1-app-fast:
    name: Tier 1 — App fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android-build

      # The androidTest and :benchmark sources compile here (no NDK, seconds) so
      # a change that breaks them fails on the PR; only the emulator tier runs
      # them, and that tier is opt-in for app-only changes.
      - name: Build, test and quality gates
        run: >
          ./gradlew --continue --console=plain
          :app:testDebugUnitTest
          spotlessCheck
          :app:detekt
          :app:lintDebug
          :app:compileReleaseKotlin
          :app:compileDebugAndroidTestKotlin
          :benchmark:compileBenchmarkKotlin

      # Gradle names no failing test in the log; the report is in the build dir.
      - name: Report unit test results
        if: always()
        run: python3 scripts/ci_test_report.py app/build/test-results/testDebugUnitTest

      # koverVerify enforces the bounds in app/build.gradle.kts (TD-38);
      # koverLog prints the measured number so a raise has evidence.
      - name: Kotlin coverage floor
        run: >
          ./gradlew --console=plain
          :app:koverLog :app:koverVerify :app:koverXmlReport :app:koverHtmlReport

      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-unit-tests-and-coverage
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/kover/**
          if-no-files-found: ignore

  # ===================================================================
  # Tier 2 — Engine host / sanitizers
  # Moved to sempermechanics/semper-dic-engine (.github/workflows/ci.yml).
  # App CI only links the pinned submodule (Tier 3 / Tier 5).
  # ===================================================================

  # ===================================================================
  # Tier 3 — Emulator: the whole androidTest suite bar the benchmark package
  # (EnginePipelineSmokeTest through the JNI, AnalysisWizardSmokeTest, …).
  # Runs on an engine/JNI change, the e2e/release/full-ci labels, the weekly
  # run and main pushes that touch them. Runs even when Tier 1 is skipped (an
  # engine-only bump), but never after Tier 1 failed.
  # ===================================================================
  tier3-emulator-e2e:
    name: Tier 3 — Emulator E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
      && needs.changes.outputs.emulator == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: x86_64

      - uses: ./.github/actions/enable-kvm

      # ubuntu-24.04 images leave ~7GB free after SDK/emulator install; default AVD
      # userdata wants ~7.4GB and fails with "Not enough space to create userdata partition".
      - name: Free disk space for AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      # FirebaseAuthIntegrationTest signs the CI test account in to the app's
      # Firebase project (TD-200). Without the secrets (a fork's or Dependabot's
      # PR) the arguments are left out and its cases skip. Through Gradle an
      # argument is cut at its first comma (TD-86): the password has none.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FIREBASE_TEST_EMAIL: ${{ secrets.FIREBASE_TEST_EMAIL }}
          FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
        with:
          # API 34 still has dumpsys gfxinfo framestats; API 37 returns empty
          # and Macrobenchmark startActivityAndWait cannot confirm launch.
          api-level: 34
          arch: x86_64
          disable-animations: true
          # Cap below typical free space so AVD create succeeds on crowded runners.
          disk-size: 4G
          # -no-metrics: without a metrics choice the emulator prints an
          # "ACTION REQUIRED" banner that a future release turns into a blocking prompt.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: >
            ./gradlew :app:connectedDebugAndroidTest
            -PabiFilters=x86_64
            -PnativeCompilerLauncher=ccache
            -Pandroid.testInstrumentationRunnerArguments.notPackage=com.sempermechanics.semper.benchmark
            ${FIREBASE_TEST_EMAIL:+"-Pandroid.testInstrumentationRunnerArguments.FIREBASE_TEST_EMAIL=$FIREBASE_TEST_EMAIL"}
            ${FIREBASE_TEST_PASSWORD:+"-Pandroid.testInstrumentationRunnerArguments.FIREBASE_TEST_PASSWORD=$FIREBASE_TEST_PASSWORD"}
            --console=plain

      # Gradle names no failing test in the log; the report is in the build dir.
      - name: Report instrumented test results
        if: always()
        run: python3 scripts/ci_test_report.py app/build/outputs/androidTest-results

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-x86_64-
          except-key: cxx-x86_64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-x86_64-
          except-key: ccache-x86_64-${{ steps.native-ci.outputs.cache-infix }}

  # ===================================================================
  # Tier 4 — Backend pytest
  # ===================================================================
  tier4-backend:
    name: Tier 4 — Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/backend-gate

      - name: Check ops shell scripts parse
        working-directory: .
        run: bash -n scripts/firestore-export.sh scripts/firestore-restore-drill.sh

      # The image installs from requirements.lock with --require-hashes. Prove it
      # resolves on the runtime's Python (3.12) and still covers every direct
      # dependency, so a stale or mis-generated lock fails here rather than in
      # the Cloud Build step of a deploy.
      - name: Verify the hashed lock
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --quiet --require-hashes -r requirements.lock
          /tmp/lockcheck/bin/python -c "import fastapi, uvicorn, google.auth, \
            google.cloud.firestore, google.cloud.tasks_v2, firebase_admin, \
            requests, cryptography, pydantic; print('lock imports OK')"
          python - <<'PY'
          import re, pathlib

          def pins(text):
              """name -> version. Extras stripped: the lock writes uvicorn[standard]."""
              found = {}
              for line in text.splitlines():
                  line = line.strip().lower()
                  if not line or line.startswith(("#", "-", " ")):
                      continue
                  m = re.match(r"^([a-z0-9._-]+)(?:\[[^\]]*\])?\s*==\s*([^\s\\]+)", line)
                  if m:
                      found[m.group(1)] = m.group(2)
              return found

          direct = pins(pathlib.Path("requirements.txt").read_text())
          locked = pins(pathlib.Path("requirements.lock").read_text())
          missing = sorted(set(direct) - set(locked))
          if missing:
              raise SystemExit(f"requirements.txt entries absent from the lock: {missing}")
          mismatched = sorted(
              f"{name}: txt={direct[name]} lock={locked[name]}"
              for name in direct
              if locked[name] != direct[name]
          )
          if mismatched:
              raise SystemExit(
                  "requirements.lock versions differ from requirements.txt: "
                  + "; ".join(mismatched)
              )
          print(f"lock covers all {len(direct)} direct dependencies at matching versions")
          PY

      # Everything above runs against tests/fake_firestore.py, whose transactions
      # apply writes immediately with no isolation and no retries. That makes the
      # concurrency guarantees consume_nonce / complete_file / bump_session_progress
      # exist to provide structurally untestable there. This tier runs the same
      # code against a real Firestore.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java for the emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # firebase-tools 15 dropped emulator support for Java < 21 (v15.0.0 notes).
          java-version: '21'

      # Appends to the backend gate's coverage data (backend/.coverage), so the
      # transaction paths only a real Firestore reaches count, and gates the
      # total two points under the measured 95.54 % (2026-10-08).
      - name: Run Firestore emulator tier
        env:
          GOOGLE_CLOUD_PROJECT: semper-ci-emulator
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npm install -g firebase-tools@15.31.0
          firebase emulators:exec \
            --only firestore \
            --config firebase.emulator.json \
            --project semper-ci-emulator \
            'pytest tests/test_firestore_emulator_integration.py -v --cov=app --cov-append --cov-report=term --cov-fail-under=93'

  # ===================================================================
  # Tier 5 — Signed release build (arm64-v8a), with R8
  # Runs on an engine/JNI change, a packaging change (keep rules, the app's
  # build script, the version catalog), the labels and the weekly run; even
  # when Tier 1 is skipped, never after it failed.
  # ===================================================================
  tier5-signed-release:
    name: Tier 5 — Signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
      && needs.changes.outputs.release_build == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: arm64

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # versionCode 1, below every release: this APK is signed with the release
      # key, so with the run number (hundreds, against release.yml's tens) it
      # installed over a release and Android then refused every real release
      # until an uninstall (TD-148 in material_testing; docs/ops/RELEASING.md).
      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && 'app/release.keystore' || '' }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: >
          ./gradlew --console=plain
          :app:assembleRelease
          -PabiFilters=arm64-v8a
          -PnativeCompilerLauncher=ccache
          -PversionCode=1

      - uses: ./.github/actions/check-arm64-so

      - name: Verify release signature
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            || { echo "APK is NOT validly signed"; exit 1; }

      - name: Note unsigned build
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "::notice::No signing secrets available — release APK built but signature NOT verified."

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-arm64-
          except-key: cxx-arm64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-arm64-
          except-key: ccache-arm64-${{ steps.native-ci.outputs.cache-infix }}

  # ===================================================================
  # Benchmarks — label `benchmark`, dispatch run_benchmark, or a PR that
  # touches a hot path (the `hot_path` filter). Macrobenchmark startup
  # (:benchmark) and the :app HotPathMicroBenchmark share one emulator boot.
  # The macro numbers and the micro smoke run are uploaded, not gated; on a PR
  # the micro suite also runs A/B against the PR's base, which is a gate.
  # ===================================================================
  tier-benchmark:
    name: Benchmarks (macro + micro)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.benchmark_ci == 'true'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          # OpenCV's android samples ship ancient gradle-wrapper.jar files that
          # fail checksum validation when submodules are checked out recursively.
          validate-wrappers: false

      # The microbenchmark lives in :app's androidTest, so it needs the same
      # debug x86_64 native build as tier 3; restore tier 3's .cxx / ccache.
      - uses: ./.github/actions/setup-native-ci
        with:
          abi: x86_64

      - uses: ./.github/actions/enable-kvm

      # Two native builds (benchmark + debug) plus the AVD: free space as tier 3 does.
      - name: Free disk space for AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      # The app id, read from app/build.gradle.kts as :benchmark reads it, so this
      # job runs unchanged in material_testing (its own id). The emulator script
      # runs each line in its own shell, so it takes the id from the environment.
      - name: Read the app id
        run: |
          APP_ID=$(sed -n 's/^ *applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$APP_ID" && test "$(printf '%s\n' "$APP_ID" | wc -l)" -eq 1
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      # The micro A/B's two builds (TD-199): the PR's base (A) and the PR (B),
      # each a debug app APK and its androidTest APK. Both build in this
      # checkout, base first, so the PR's build is the one left in app/build
      # and the base's native objects are reused where the engine is the same.
      - name: Build the PR's base and the PR for the microbenchmark A/B
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ab="$RUNNER_TEMP/micro-ab"
          head=$(git rev-parse HEAD)
          build() {
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PabiFilters=x86_64 -PnativeCompilerLauncher=ccache --console=plain
            mkdir -p "$ab/$1"
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ab/$1/"
          }
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c advice.detachedHead=false checkout "$BASE_SHA"
          git submodule update --init --recursive
          build A
          git -c advice.detachedHead=false checkout "$head"
          git submodule update --init --recursive
          build B
          ls -l "$ab"/*

      # One emulator boot, two suites; each line is its own command, and a failing
      # one fails the step. The micro run is a debug build on an emulator, hence
      # DEBUGGABLE in its suppress list: its numbers are relative, not absolutes.
      # It goes through `am instrument`, not connectedDebugAndroidTest: an
      # instrumentation argument passed through Gradle arrives cut at its first
      # comma (only EMULATOR was suppressed, TD-86), and API 34 raises
      # ACTIVITY-MISSING and NOT-AOT-COMPILED too. `am instrument` exits 0 on test
      # failures, so the grep on its summary line is the pass/fail. On a PR the
      # last line runs the micro A/B (scripts/micro_ab.py): A B B A on this
      # emulator, failing a hot path whose median is over microAbMargin
      # (benchmark/gates.json) above the base's. The `perf-accepted` label makes
      # it report without failing, for a slowdown the PR means to make.
      - name: Run startup Macrobenchmarks and hot-path Microbenchmarks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MICRO_AB_FLAGS: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') && '--advisory' || '' }}
        with:
          # Same image as tier 3. API 37 empties gfxinfo framestats, so
          # startActivityAndWait cannot confirm launch.
          api-level: 34
          arch: x86_64
          # The action's default options plus -no-metrics (see tier 3).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            ./gradlew :benchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY,UNLOCKED
            ./gradlew :app:installDebug :app:installDebugAndroidTest -PabiFilters=x86_64 -PnativeCompilerLauncher=ccache --console=plain
            "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -e class com.sempermechanics.semper.benchmark.HotPathMicroBenchmark -e androidx.benchmark.suppressErrors EMULATOR,DEBUGGABLE,LOW-BATTERY,UNLOCKED,ACTIVITY-MISSING,NOT-AOT-COMPILED "$APP_ID.test/androidx.test.runner.AndroidJUnitRunner" | tee micro-instrument.txt
            mkdir -p app/build/outputs/connected_android_test_additional_output
            "$ANDROID_HOME/platform-tools/adb" pull "/sdcard/Android/media/$APP_ID.test" app/build/outputs/connected_android_test_additional_output || true
            "$ANDROID_HOME/platform-tools/adb" pull "/sdcard/Android/media/$APP_ID" app/build/outputs/connected_android_test_additional_output || true
            "$ANDROID_HOME/platform-tools/adb" logcat -d -s Benchmark:I || true
            grep -q "^OK (" micro-instrument.txt
            if [ -d "$RUNNER_TEMP/micro-ab/A" ]; then python3 scripts/micro_ab.py --a "$RUNNER_TEMP/micro-ab/A" --b "$RUNNER_TEMP/micro-ab/B" --out micro-ab --package "$APP_ID" $MICRO_AB_FLAGS; fi

      # The smoke runs' numbers are not gated (absolute times on an emulator say
      # nothing; the micro A/B above is the gate), but keep the raw
      # *-benchmarkData.json/.perfetto-trace files so a run can be read by hand.
      # Failing test names and each benchmark's min / median / max into the log.
      - name: Report benchmark results
        if: always()
        run: >
          python3 scripts/ci_test_report.py
          benchmark/build/outputs/androidTest-results
          benchmark/build/outputs/connected_android_test_additional_output
          app/build/outputs/androidTest-results
          app/build/outputs/connected_android_test_additional_output

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-results
          path: benchmark/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn

      # Median timeNs and allocationCount per hot path (*-benchmarkData.json).
      - name: Upload microbenchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microbenchmark-results
          path: app/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn

      # Each A/B round's instrument output and benchmark JSON (1-A, 2-B, ...).
      - name: Upload microbenchmark A/B rounds
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: microbenchmark-ab
          path: micro-ab/**
          if-no-files-found: warn

  # ===================================================================
  # ci-ok — single required status check
  # ===================================================================
  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - secret-scan
      - legal-pages
      - console-pages
      - changes
      - tier1-app-fast
      - tier3-emulator-e2e
      - tier4-backend
      - tier5-signed-release
      - tier-benchmark
    steps:
      - name: Check all tiers
        run: |
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.legal-pages.result }}" \
            "${{ needs.console-pages.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.tier1-app-fast.result }}" \
            "${{ needs.tier3-emulator-e2e.result }}" \
            "${{ needs.tier4-backend.result }}" \
            "${{ needs.tier5-signed-release.result }}" \
            "${{ needs.tier-benchmark.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "FAILED: $result"; exit 1 ;;
            esac
          done
          echo "All tiers passed or were skipped."
          echo "Note: engine host/sanitizer/C-SDK CI runs in sempermechanics/semper-dic-engine."
