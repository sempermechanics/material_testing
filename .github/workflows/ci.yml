name: CI

# =====================================================================
# Test pyramid — cheapest/fastest first, so failures surface early.
# All jobs run in parallel; the ordering below is conceptual, not temporal.
#
#   Tier          Job                        Runs on      Proves
#   ------------  -------------------------  -----------  ----------------------
#   1 unit        native-tests               host         engine math (host CMake
#                                                          suite: unit/ + integration/)
#   2 unit+san    native-tests-sanitized     host         no UB / races (ASan+UBSan, TSan)
#   3 jvm+gates   android-kotlin             host         Kotlin unit tests +
#                                                          spotless/detekt/lint/R8
#   4 build       android-native-arm64       host+NDK     engine compiles for the
#                                                          shipped ABI (arm64-v8a)
#
# Tiers 1-3 are fast (~minutes, no NDK). Tier 4 is the slow from-source
# OpenCV build. The app ships arm64-v8a only (every 2022+ phone is 64-bit
# ARM), so CI builds exactly what users get — "test what you ship". x86/x86_64
# are emulator-only and the on-device runtime check are both covered by LOCAL
# emulator testing, not CI. See docs/engine/TESTING.md for the test catalog.
# =====================================================================

on:
  push:
    branches: [damodar, feature/hybrid-delaunay-dic, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # 1. Host-side engine correctness: golden synthetic tests, SIMD
  #    oracles, determinism, robustness/failure cases. Fast (~2 min).
  # ===================================================================
  native-tests:
    name: Native engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dic-submodules

      # OpenCV decodes the DICe fixtures, letting them stay vendored in their
      # ORIGINAL .tif form rather than converted. The .deb archives are cached
      # so repeat runs install from disk instead of re-downloading ~100 MB;
      # apt is pointed at a user-owned dir because /var/cache/apt is root-owned
      # and actions/cache cannot restore into it.
      - name: Cache OpenCV packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-libopencv-dev-${{ runner.os }}-v1

      - name: Install OpenCV (fixture decoding)
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-cache" libopencv-dev
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      # Build OUT of the source tree (repo-level build/, gitignored) so the
      # test folder stays pure sources.
      #
      # DIC_REQUIRE_OPENCV=ON: if OpenCV were missing, the image-backed DICe
      # tests would compile out and this job would still pass — green CI with
      # our most valuable coverage silently gone. Fail configure instead.
      - name: Configure
        run: >
          cmake -S app/src/test/cpp -B build/native-tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_REQUIRE_OPENCV=ON

      - name: Build
        run: cmake --build build/native-tests -j

      - name: Run tests
        run: ./build/native-tests/dic_tests

  # ===================================================================
  # 2. Same suite under sanitizers.
  #    - address,undefined: memory bugs (OOB, use-after-free, UB)
  #    - thread: data races in the shared-read parallel solve pattern
  #      (Robustness.ConcurrentSolves is the race detector's workload)
  #
  #    OpenCV is deliberately NOT installed here, so the image-backed DICe
  #    tests compile out. Linking an uninstrumented third-party library into a
  #    sanitized build invites LSan leak reports and TSan noise from OpenCV's
  #    internal thread pool — flaky red CI for no gain, since these sanitizers
  #    exist to find bugs in OUR engine, and the synthetic suites already
  #    exercise exactly the same engine code paths.
  # ===================================================================
  native-tests-sanitized:
    name: Sanitized (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['address,undefined', 'thread']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dic-submodules

      - name: Configure
        run: >
          cmake -S app/src/test/cpp -B build/native-tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_SANITIZER=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build/native-tests -j

      - name: Run tests
        run: ./build/native-tests/dic_tests

  # ===================================================================
  # 3. Kotlin compilation + JVM unit tests (no NDK needed).
  # ===================================================================
  android-kotlin:
    name: Kotlin compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle dependency/build cache. setup-gradle caches ~/.gradle by default
      # but is READ-ONLY off the default branch, so day-to-day branches would
      # never seed it and would re-resolve dependencies every run. Allow writes
      # from the long-lived dev branches (PRs stay read-only, so they reuse the
      # cache without churning it).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      - name: Compile Kotlin and run unit tests
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --console=plain

      # Style & static-analysis gates (Kotlin only; cpp/ is out of scope).
      # Existing findings are frozen in detekt-baseline.xml / lint-baseline.xml;
      # only NEW issues fail. Fix formatting locally with `spotlessApply`.
      - name: Code quality gates (spotless + detekt + lint)
        run: ./gradlew spotlessCheck :app:detekt :app:lintDebug --console=plain

      # R8/ProGuard pass for the release variant (no native build needed).
      # Catches missing keep rules and shrinker config breakage that would
      # otherwise only surface as runtime failures in shipped builds.
      - name: Release minification (R8) check
        run: ./gradlew :app:minifyReleaseWithR8 --console=plain

  # ===================================================================
  # 4. Native compile gate for the shipped ABI: OpenCV + engine built for
  #    arm64-v8a — the only architecture the app ships, and what every
  #    2022+ phone runs. Proves the SIMD/OpenMP code compiles and links
  #    (NEON, static OpenMP). x86/x86_64 (emulator-only) and the on-device
  #    runtime smoke test are covered by LOCAL emulator testing, not CI.
  # ===================================================================
  android-native-arm64:
    name: Android native build (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # validate-wrappers is off here: this job checks out submodules, and
      # OpenCV's repo bundles its own (ancient) gradle-wrapper.jar files
      # that fail checksum validation. Our own wrapper is validated by the
      # android-kotlin job, which has no submodules.
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          # Same rationale as the Kotlin job: let the dev branches seed the
          # Gradle cache so the NDK build isn't re-resolving deps every run.
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      # The from-source OpenCV build dominates; cache the object dir keyed on
      # everything that can change the native build.
      - name: Cache native build (.cxx)
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-arm64-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules', 'app/src/main/cpp/**/*.cpp', 'app/src/main/cpp/**/*.h') }}
          restore-keys: cxx-arm64-

      # arm64-v8a is the default ABI now, but pass it explicitly so the job is
      # self-documenting and independent of the gradle default.
      - name: Assemble debug APK (arm64-v8a)
        run: ./gradlew :app:assembleDebug -PabiFilters=arm64-v8a --console=plain

      - name: Verify the arm64-v8a .so is packaged
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libindicvision_core.so" \
            || { echo "MISSING arm64-v8a native lib"; exit 1; }
