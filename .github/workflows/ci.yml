name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full matrix. A push to main runs the emulator and release tiers
  # only when its diff can break them, so this catches what paths cannot:
  # a new emulator image, an SDK or runner change, a flaky test going red.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      full_ci:
        description: 'Run every tier (ignore path filters)'
        type: boolean
        default: false
      run_benchmark:
        description: 'Run the benchmarks on an emulator (Macrobenchmark + HotPathMicroBenchmark smoke; no A/B without a PR base)'
        type: boolean
        default: false

# A new push cancels a PR's older run. On main a started run finishes (the full
# matrix, ~20 min): cancelling there meant a busy day of merges never finished
# Tier 3 / 5 on main at all (TD-97). GitHub still keeps only the newest pending
# run per group, so a burst of merges runs the one in flight and the latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; jobs that prune caches or read PRs widen it themselves.
permissions:
  contents: read

# The engine's Eigen submodule points at gitlab.com, which has refused clones
# under load (2026-10-26). Every git command in every job, including
# actions/checkout's submodule clones, fetches it from the GitHub mirror instead.
# The gitlink pins the commit (Eigen 5.0.1, bc3b3987 at engine f072da0), so
# the source is identical; a mirror without that commit fails the checkout.
# checkout-submodules caches Eigen's git directory by that pin, so a run that
# restores it fetches Eigen from neither.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://github.com/eigen-mirror/eigen.git.insteadOf
  GIT_CONFIG_VALUE_0: https://gitlab.com/libeigen/eigen.git

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pull-requests:read needed by gitleaks-action on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Dependabot branches: no Actions secrets (fork-like) and the org
      # gitleaks-action also 403s the PR commits API under Dependabot's
      # token. Key off head_ref (not actor) so rebases by humans/bots still
      # take the CLI path. Prefer also setting Dependabot secret
      # GITLEAKS_LICENSE if you later want the action on those PRs.
      - name: Scan repository and Git history
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Scan with gitleaks CLI (Dependabot branches)
        if: ${{ startsWith(github.head_ref, 'dependabot/') }}
        env:
          # Match gitleaks-action PR mode: only commits on the PR, not full history
          # (full history still surfaces pre-allowlist noise like old client keys).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VER=8.28.0
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          TARBALL="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSfLO "${BASE}/${TARBALL}"
          # Verify against the release's published checksums before running it.
          curl -sSfL "${BASE}/gitleaks_${VER}_checksums.txt" \
            | grep " ${TARBALL}$" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact \
            --log-opts="${BASE_SHA}..HEAD"

  engine-pin:
    name: Engine pin is a tagged release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # TE2-006: the engine's own CI tests its tagged releases, so the gitlink
    # must point at a v* tag and must not move backwards or off the previous
    # pin's line (compared with HEAD^1: the base tip in a PR's merge commit,
    # the previous main on a push). A deliberate downgrade carries the PR label
    # `engine-downgrade`; labels are read at run time, so re-run the job after
    # adding one. Treeless clone of the public engine repo; seconds.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check the engine gitlink
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR" ]; then
            labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' || true)
          else
            labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].labels[].name' || true)
          fi
          allow=
          if printf '%s\n' "$labels" | grep -qx engine-downgrade; then allow=--allow-downgrade; fi
          python scripts/check_engine_pin.py $allow

  legal-pages:
    name: Legal pages match their source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The published /privacy/ and /terms/ pages are generated from
    # docs/legal/*.md. They were previously placeholders whose own body said
    # "keep this in sync before launch" while the app linked to them as the real
    # policy. This makes drift a build failure instead of a promise.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/render_legal_pages.py --check

      # The docs map hundreds of source paths (docs/WORKFLOWS.md maps every
      # workflow to its files). A rename silently rots those references, and a
      # map that points at a file which no longer exists is worse than no map.
      # Skips the engine submodule, which this job does not check out.
      - name: Docs reference files that exist
        run: python scripts/check_doc_paths.py

      # Every item of the readiness framework has a row in the gate's
      # cross-check, and every open row an owner that exists in TECH_DEBT or
      # FUTURE_IMPROVEMENTS. Docs-only edits reach no tier, so it runs here.
      - name: Readiness framework fully mapped
        run: python scripts/check_framework_coverage.py

      # ADR-015's ~500-line file guide (TD-292). Reads files, no Gradle, so it
      # runs here on every event rather than behind Tier 1's app filter. Fused
      # hot loops are not counted; the files allowed over the budget, and the
      # most lines each may reach, are in scripts/kotlin_file_size_allowlist.txt.
      - name: Main Kotlin files within ADR-015's size budget
        run: python scripts/check_kotlin_file_size.py

      # ADR-016 rule 1 (TD-291): no network call or WorkManager enqueue on a
      # screen's lifecycleScope, which a rotation cancels. A source heuristic,
      # not a lint rule; the triaged exceptions, each with its reason, are in
      # scripts/activity_scope_allowlist.txt, and a stale entry fails.
      - name: No user work on a screen's lifecycleScope (ADR-016)
        run: python scripts/check_activity_scope_work.py

      # ADR-018 (TD-171): no broad catch or runCatching around a suspend call
      # that swallows CancellationException. detekt's
      # SuspendFunSwallowedCancellation needs type resolution, which detekt
      # 1.23.8 cannot do here, so this is a source heuristic too; the triaged
      # exceptions are in scripts/swallowed_cancellation_allowlist.txt.
      - name: No swallowed coroutine cancellation (ADR-018)
        run: python scripts/check_swallowed_cancellation.py

      # The tests of the checks above that live in scripts/tests (stdlib
      # unittest, nothing to install). The older checks' tests are in
      # backend/tests (test_script_*.py) and run in Tier 4.
      - name: Tests of the source checks
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  console-pages:
    name: Console pages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The consoles have no compiler and no build step, so nothing else in this
    # repository fails when a page's wiring goes stale: the pages load, look
    # right, and do nothing. This is the gate that reads them — inline script
    # against the CSP that forbids it, ids the module asks for, deploy
    # placeholders still unsubstituted, rewrite targets that exist, and every
    # /v1 path declared on the gateway. Seconds to run, so it runs on every
    # event rather than behind a path filter. The node tests cover the
    # DOM-free helpers in console/util.js, and auth.js (sign-in, step-up,
    # api, revoke gate), router.js and the three page modules against a fake
    # Firebase SDK and a DOM parsed from the real pages
    # (firebase-hosting/tests/harness.mjs).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python scripts/check_console.py
      # The tests write raw V8 coverage; console_coverage.mjs merges each
      # file's copies (pages load as page.js?load=N, which Node's own report
      # counts apart) and gates the console's line coverage two points
      # under the measured 98.30 % (2026-10-08). Every .js under public/
      # counts, loaded or not, except vendor/. Raise it with the tests that
      # lift it; never lower it.
      - name: Console helper tests
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/console-coverage
        run: node --test "firebase-hosting/tests/*.test.mjs"
      - name: Console line coverage (merged by file)
        run: node scripts/console_coverage.mjs "${{ runner.temp }}/console-coverage" --lines=96

  console-a11y:
    name: Console accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The console pages in a real browser (Chromium), against a stub API and
    # the fake Firebase SDK: axe-core finds no serious or critical WCAG 2.1
    # A/AA violation on any page at 360, 768 and 1280 px, and no page scrolls
    # sideways (firebase-hosting/tests/a11y). Nothing here reaches a real
    # backend or Google; the stub refuses every other host. The versions are
    # pinned in firebase-hosting/package-lock.json.
    defaults:
      run:
        working-directory: firebase-hosting
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase-hosting/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console-a11y-report
          path: |
            firebase-hosting/playwright-report/
            firebase-hosting/test-results/
          retention-days: 7

  # ===================================================================
  # Path filters — same rules on PR and push. Prove only what the diff
  # can break. Full matrix: the weekly schedule, the `full-ci` label or
  # workflow_dispatch full_ci.
  # ===================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests:read for the Files API; Dependabot still 403s that API, so
    # PRs also pass base SHA below and paths-filter diffs via local git.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.flags.outputs.app }}
      backend: ${{ steps.flags.outputs.backend }}
      rules: ${{ steps.flags.outputs.rules }}
      emulator: ${{ steps.flags.outputs.emulator }}
      release_build: ${{ steps.flags.outputs.release_build }}
      benchmark_ci: ${{ steps.flags.outputs.benchmark_ci }}
      engine_host: ${{ steps.flags.outputs.engine_host }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A scheduled run has no diff to read, nor has a push with no base (a
      # zero `before`); both run everything, so skip the filter.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        if: >-
          github.event_name != 'schedule'
          && !(github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        with:
          # Explicit base forces git-diff mode (avoids PR Files API 403 on Dependabot).
          # An empty token is required on pull_request events, else the action
          # ignores `base` and falls back to the Files API (and warns).
          token: ''
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # A file matches a filter on any of its patterns unless a '!' pattern
          # excludes it. The default ('some') made a '!' pattern match every file
          # outside what it names, so a docs-only PR ran Tier 1 (material_testing
          # TD-96). No filter has one since app/src/main/cpp/ was deleted; this
          # keeps the next one meaning what it says.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - 'app/**'
              # The wire bodies ApiDtosContractTest decodes (the backend's
              # test_wire_contracts.py reads the same files).
              - 'contracts/**'
              # The benchmark module builds with the app; without it a
              # benchmark-only PR ran nothing once TD-96 was fixed.
              - 'benchmark/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
            # Engine sources live in sempermechanics/semper-dic-engine, the JNI
            # adapter too (engine/adapters/android/). App CI only sees pin bumps
            # (gitlink) / .gitmodules — the engine repo's own workflow tests its
            # commits; engine-host-sanitized reruns ASan+UBSan at the pin. Here a bump or a JNI change has to build for
            # both ABIs and run EnginePipelineSmokeTest on the emulator before it
            # merges, not after.
            native_jni:
              - 'engine'
              - '.gitmodules'
              - 'app/src/main/java/com/sempermechanics/semper/SemperNativeLib.kt'
            # Composite actions only the emulator and release tiers use.
            native_ci:
              - '.github/actions/setup-native-ci/**'
              - '.github/actions/enable-kvm/**'
              - '.github/actions/check-arm64-so/**'
              - '.github/actions/checkout-submodules/**'
            backend:
              - 'backend/**'
              - 'firestore.rules'
              # test_wire_contracts holds the shared wire bodies to the routes.
              - 'contracts/**'
              # test_security_controls reads Hosting's firebase.json; the pages
              # themselves are console-pages' job, which runs on every event.
              - 'firebase-hosting/firebase.json'
              # test_security_controls reads these two.
              - 'scripts/deploy-firestore.sh'
              - '.github/workflows/deploy-backend.yml'
              # test_terms_and_consent reads the Terms' version.
              - 'docs/legal/**'
              # Tier 4's ruff is the only lint the ops scripts get.
              - 'scripts/*.py'
              # Fixtures the scripts' pytest modules read (check_release_apk,
              # the stub gcloud), and the two GCP ops scripts and the
              # monitoring files test_script_ops_gcp.py runs against it.
              - 'scripts/tests/**'
              - 'scripts/check_gcp_posture.sh'
              - 'scripts/apply-monitoring.sh'
              - 'ops/monitoring/**'
              # The client's copies of the three wire contracts. Without these,
              # a rename on an app-only PR skips the backend tier and the tests
              # holding each pair of lists together never run — which is the one
              # thing keeping them in step.
              - 'app/src/main/java/com/sempermechanics/semper/data/net/ApiErrors.kt'
              - 'app/src/main/java/com/sempermechanics/semper/data/net/ArtifactRoles.kt'
              - 'app/src/main/java/com/sempermechanics/semper/data/cloud/UploadWorkOutcomes.kt'
            # firestore.rules denies every client; the rules tests prove it for
            # each collection backend/app uses, and fail when backend/app
            # names one the list misses, so a backend change runs them too.
            rules:
              - 'firestore.rules'
              - 'firestore-rules-tests/**'
              - 'backend/app/**'
            ci_workflow:
              - '.github/workflows/ci.yml'
              # The composite actions the light tiers run (setup-android-build,
              # backend-gate, prune-cache); a change to one matched nothing.
              - '.github/actions/**'
              # Tier 1 reports its unit tests, and what ended their JVM, with these.
              - 'scripts/ci_test_report.py'
              - 'scripts/ci_test_crash_report.py'
            android_test:
              - 'app/src/androidTest/**'
            packaging:
              - 'app/build.gradle.kts'
              - 'app/proguard-rules.pro'
              - 'gradle/libs.versions.toml'
            # What HotPathMicroBenchmark times, the benchmark itself and its
            # gate: a PR touching one runs the benchmark job, whose A/B against
            # the PR's base fails a slowdown (TD-199).
            hot_path:
              - 'app/src/main/java/com/sempermechanics/semper/report/**'
              - 'app/src/main/java/com/sempermechanics/semper/field/DicResult.kt'
              - 'app/src/main/java/com/sempermechanics/semper/ui/viewer/inspect/PointSpatialIndex.kt'
              - 'app/src/main/java/com/sempermechanics/semper/ui/analysis/sweep/SweepStudy.kt'
              - 'app/src/androidTest/java/com/sempermechanics/semper/benchmark/HotPathMicroBenchmark.kt'
              - 'scripts/micro_ab.py'
              - 'benchmark/gates.json'
              # The launch smoke of the minified build runs in the same job.
              - 'scripts/launch_smoke.py'

      - name: Resolve tier flags
        id: flags
        env:
          FILTER_APP: ${{ steps.filter.outputs.app }}
          FILTER_NATIVE_JNI: ${{ steps.filter.outputs.native_jni }}
          FILTER_NATIVE_CI: ${{ steps.filter.outputs.native_ci }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_RULES: ${{ steps.filter.outputs.rules }}
          FILTER_CI_WORKFLOW: ${{ steps.filter.outputs.ci_workflow }}
          FILTER_ANDROID_TEST: ${{ steps.filter.outputs.android_test }}
          FILTER_PACKAGING: ${{ steps.filter.outputs.packaging }}
          FILTER_HOT_PATH: ${{ steps.filter.outputs.hot_path }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          FULL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ci || false }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          E2E_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          RELEASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
          BENCHMARK_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'benchmark') }}
          BENCHMARK_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.run_benchmark || false }}
        run: |
          set -euo pipefail
          full=false
          app=false; backend=false
          rules=false           # Firestore rules tests
          emulator=false        # Tier 3
          release_build=false   # Tier 5
          benchmark=false

          # The weekly schedule, the full-ci label or dispatch full_ci → full
          # matrix. So is a push whose base is unknown (no diff to filter).
          main_push=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            main_push=true
          fi
          if [ "$EVENT_NAME" = "schedule" ] \
             || [ "$FULL_DISPATCH" = "true" ] \
             || [ "$FULL_LABEL" = "true" ] \
             || { [ "$main_push" = "true" ] && [ "${BEFORE//0/}" = "" ]; }; then
            full=true
          fi

          if [ "$BENCHMARK_LABEL" = "true" ] || [ "$BENCHMARK_DISPATCH" = "true" ]; then
            benchmark=true
          fi

          if [ "$full" = "true" ]; then
            app=true; backend=true; rules=true; emulator=true; release_build=true
          elif [ "$EVENT_NAME" = "pull_request" ] && [[ "${HEAD_REF:-}" == dependabot/* ]]; then
            # Dependabot cheap path: never Tier 3/5; ecosystem picks one light tier.
            case "$HEAD_REF" in
              dependabot/pip/*) backend=true ;;
              # firestore-rules-tests/package-lock.json (emulator + SDK pins).
              dependabot/npm_and_yarn/*) rules=true ;;
              dependabot/gradle/*) app=true ;;
              # The backend image. Tier 4 runs on the runner's Python, not the
              # image, but it is the nearest proof and beats gates-only (TD-68).
              dependabot/docker/*) backend=true ;;
              dependabot/github_actions/*) ;; # gates only
              *)
                # Unknown Dependabot ecosystem: stay gates-only.
                ;;
            esac
          else
            # Path mode, on a PR and on a push to main alike. Fail closed if the
            # filters are empty (gates only) — do not force a full matrix.
            if [ "$FILTER_APP" = "true" ] || [ "$FILTER_ANDROID_TEST" = "true" ] || [ "$FILTER_PACKAGING" = "true" ]; then
              app=true
            fi
            if [ "$FILTER_BACKEND" = "true" ]; then backend=true; fi
            if [ "$FILTER_RULES" = "true" ]; then rules=true; fi
            # Editing ci.yml used to be gates-only because this filter was
            # collected and never read. Run the light app + backend tiers so a
            # workflow change cannot skip every real job.
            if [ "$FILTER_CI_WORKFLOW" = "true" ]; then
              app=true
              backend=true
              rules=true
            fi
            # An engine bump or a JNI change is proven on the emulator and in
            # the arm64 release build before it merges. These flags were
            # computed and read by no job, so a bump was first built on main.
            if [ "$FILTER_NATIVE_JNI" = "true" ] || [ "$FILTER_NATIVE_CI" = "true" ]; then
              emulator=true
              release_build=true
            fi
            # Keep rules and the release build config only fail under R8, which
            # Tier 1 never runs. Tier 5 builds the R8 APK; on a PR the benchmark
            # job also launches one (its launch smoke), since only running it
            # shows a keep rule that is missing.
            if [ "$FILTER_PACKAGING" = "true" ]; then release_build=true; fi
            if [ "$FILTER_PACKAGING" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
              benchmark=true
            fi
            if [ "$E2E_LABEL" = "true" ] || [ "$RELEASE_LABEL" = "true" ]; then
              emulator=true
              release_build=true
            fi
            # A hot-path change on a PR is timed against its base (TD-199).
            # Not on main: the A/B needs a PR's base, and the PR already ran it.
            if [ "$FILTER_HOT_PATH" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
              benchmark=true
            fi
            # Main always reruns the light tiers on the merged tree: they are
            # minutes, and the heavy ones above still follow the diff.
            if [ "$main_push" = "true" ]; then
              app=true
              backend=true
              rules=true
            fi
          fi

          # The engine's host suite under ASan+UBSan (engine-host-sanitized)
          # runs whenever Tier 3 does, and on a ci.yml change so the job proves
          # itself on the PR that edits it.
          engine_host=$emulator
          if [ "$FILTER_CI_WORKFLOW" = "true" ]; then engine_host=true; fi

          {
            echo "app=$app"
            echo "backend=$backend"
            echo "rules=$rules"
            echo "emulator=$emulator"
            echo "release_build=$release_build"
            echo "benchmark_ci=$benchmark"
            echo "engine_host=$engine_host"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: event=$EVENT_NAME full=$full app=$app backend=$backend rules=$rules emulator=$emulator release_build=$release_build benchmark_ci=$benchmark engine_host=$engine_host"

  # ===================================================================
  # Engine host suite, sanitized — TE2-004. The engine repo's CI runs it on
  # its own commits; this runs the same suite at the commit this app pins,
  # with the engine CI's asan-ubsan configuration (tests/ CMake tree, system
  # libopencv-dev, Release, ASan+UBSan). No Gradle, no NDK, no Android OpenCV.
  # TSan and the C SDK smoke stay in the engine repo; the JNI adapter
  # (engine/adapters/android/jni) is built only by the NDK and is not here.
  # ===================================================================
  engine-host-sanitized:
    name: Engine host tests (ASan+UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.engine_host == 'true'
    defaults:
      run:
        working-directory: engine
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7

      # Submodules after checkout: Eigen from cache, every fetch retried.
      - uses: ./.github/actions/checkout-submodules

      # libopencv-dev or the full-field pipeline is silently left out of the
      # build (the engine CI's note); DIC_REQUIRE_OPENCV makes that a failure.
      - name: Install OpenCV + ccache
        id: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libopencv-dev ccache
      - name: Cache ccache objects
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-engine-san-${{ hashFiles('engine/**/*.cpp', 'engine/**/*.h', 'engine/**/*.hpp', 'engine/tests/CMakeLists.txt') }}
          restore-keys: ccache-engine-san-
      - name: Configure
        run: >
          cmake -S tests -B build/tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_REQUIRE_OPENCV=ON
          -DDIC_SANITIZER=address,undefined
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/tests -j"$(nproc)"
      - name: Run dic_tests
        run: ./build/tests/dic_tests
      # Only once ccache is installed: a failed checkout (the engine's Eigen
      # submodule comes from gitlab.com) would otherwise add a second error.
      - name: ccache statistics
        if: always() && steps.deps.outcome == 'success'
        run: ccache --show-stats

  # ===================================================================
  # Tier 1 — two jobs, no NDK. Static: spotless and detekt, about two
  # minutes, which is what the heavy tiers wait for, so the emulator does not
  # boot for a PR that is not even formatted. App fast: compile, JVM unit
  # tests, lint and the Kover floor (~8 min), beside the heavy tiers instead of
  # in front of them; its failure still fails CI OK. Of the material_testing
  # fork's five Tier 1 failures from 2026-10-18 to 10-26, two were spotless.
  # ===================================================================
  tier1-static:
    name: Tier 1 — Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android-build

      - name: Spotless and detekt
        run: ./gradlew --continue --console=plain spotlessCheck :app:detekt

  tier1-app-fast:
    name: Tier 1 — App fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android-build

      # The androidTest and :benchmark sources compile here (no NDK, seconds) so
      # a change that breaks them fails on the PR; only the emulator tier runs
      # them, and that tier is opt-in for app-only changes.
      - name: Build, test and quality gates
        run: >
          ./gradlew --continue --console=plain
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileReleaseKotlin
          :app:compileDebugAndroidTestKotlin
          :benchmark:compileBenchmarkKotlin

      # Gradle names no failing test in the log; the report is in the build dir.
      - name: Report unit test results
        if: always()
        run: python3 scripts/ci_test_report.py app/build/test-results/testDebugUnitTest

      # A worker that exits with no failing test says nothing in the Gradle
      # output; its crash file, heap dump, GC log and last output do (TD-312).
      - name: Report what ended the unit-test JVM
        if: failure()
        run: >
          python3 scripts/ci_test_crash_report.py
          app/build/test-crash app/build/test-results/testDebugUnitTest

      # koverVerify enforces the bounds in app/build.gradle.kts (TD-38);
      # koverLog prints the measured number so a raise has evidence.
      - name: Kotlin coverage floor
        run: >
          ./gradlew --console=plain
          :app:koverLog :app:koverVerify :app:koverXmlReport :app:koverHtmlReport

      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-unit-tests-and-coverage
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/kover/**
            app/build/test-crash/**
          if-no-files-found: ignore

  # ===================================================================
  # Tier 2 — Engine host / sanitizers
  # Moved to sempermechanics/semper-dic-engine (.github/workflows/ci.yml).
  # App CI only links the pinned submodule (Tier 3 / Tier 5).
  # ===================================================================

  # ===================================================================
  # Tier 3 — Emulator: the whole androidTest suite bar the benchmark package
  # (EnginePipelineSmokeTest through the JNI, AnalysisWizardSmokeTest, …).
  # Runs on an engine/JNI change, the e2e/release/full-ci labels, the weekly
  # run and main pushes that touch them. Runs even when Tier 1 is skipped (an
  # engine-only bump), but never after its static checks failed.
  # ===================================================================
  tier3-emulator-e2e:
    name: Tier 3 — Emulator E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-static]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-static.result == 'success' || needs.tier1-static.result == 'skipped')
      && needs.changes.outputs.emulator == 'true'
    steps:
      - uses: actions/checkout@v7

      # Submodules after checkout: Eigen from cache, every fetch retried.
      - uses: ./.github/actions/checkout-submodules

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: x86_64

      - uses: ./.github/actions/enable-kvm

      # ubuntu-24.04 images leave ~7GB free after SDK/emulator install; default AVD
      # userdata wants ~7.4GB and fails with "Not enough space to create userdata partition".
      - name: Free disk space for AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      # FirebaseAuthIntegrationTest signs the CI test account in to the app's
      # Firebase project (TD-200). StagingRoundTripDeviceTest backs up one file
      # to staging with the staff CI test account (STAGING_TEST_*, ADR-027;
      # TD-313) and deletes it. Without the secrets (a fork's or Dependabot's
      # PR) the arguments are left out and those cases skip. Through Gradle an
      # argument is cut at its first comma (TD-86): the passwords have none.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FIREBASE_TEST_EMAIL: ${{ secrets.FIREBASE_TEST_EMAIL }}
          FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        with:
          # API 34 still has dumpsys gfxinfo framestats; API 37 returns empty
          # and Macrobenchmark startActivityAndWait cannot confirm launch.
          api-level: 34
          arch: x86_64
          disable-animations: true
          # Cap below typical free space so AVD create succeeds on crowded runners.
          disk-size: 4G
          # -no-metrics: without a metrics choice the emulator prints an
          # "ACTION REQUIRED" banner that a future release turns into a blocking prompt.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: >
            ./gradlew :app:connectedDebugAndroidTest
            -PabiFilters=x86_64
            -PnativeCompilerLauncher=ccache
            -Pandroid.testInstrumentationRunnerArguments.notPackage=com.sempermechanics.semper.benchmark
            ${FIREBASE_TEST_EMAIL:+"-Pandroid.testInstrumentationRunnerArguments.FIREBASE_TEST_EMAIL=$FIREBASE_TEST_EMAIL"}
            ${FIREBASE_TEST_PASSWORD:+"-Pandroid.testInstrumentationRunnerArguments.FIREBASE_TEST_PASSWORD=$FIREBASE_TEST_PASSWORD"}
            ${STAGING_API_BASE_URL:+"-Pandroid.testInstrumentationRunnerArguments.STAGING_API_BASE_URL=$STAGING_API_BASE_URL"}
            ${STAGING_TEST_EMAIL:+"-Pandroid.testInstrumentationRunnerArguments.STAGING_TEST_EMAIL=$STAGING_TEST_EMAIL"}
            ${STAGING_TEST_PASSWORD:+"-Pandroid.testInstrumentationRunnerArguments.STAGING_TEST_PASSWORD=$STAGING_TEST_PASSWORD"}
            --console=plain

      # Gradle names no failing test in the log; the report is in the build dir.
      - name: Report instrumented test results
        if: always()
        run: python3 scripts/ci_test_report.py app/build/outputs/androidTest-results

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-x86_64-
          except-key: cxx-x86_64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-x86_64-
          except-key: ccache-x86_64-${{ steps.native-ci.outputs.cache-infix }}

  # ===================================================================
  # Tier 4 — Backend pytest
  # ===================================================================
  tier4-backend:
    name: Tier 4 — Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/backend-gate

      - name: Check ops shell scripts parse
        working-directory: .
        run: >
          bash -n scripts/firestore-export.sh scripts/firestore-restore-drill.sh
          scripts/check_gcp_posture.sh scripts/apply-monitoring.sh

      # The two GCP ops scripts run against production with nobody watching
      # their output closely; shellcheck (on the runner image) is their lint.
      - name: Shellcheck the GCP ops scripts
        working-directory: .
        run: shellcheck scripts/check_gcp_posture.sh scripts/apply-monitoring.sh

      # The image installs from requirements.lock with --require-hashes. Prove it
      # resolves on the runtime's Python (3.12) and still covers every direct
      # dependency, so a stale or mis-generated lock fails here rather than in
      # the Cloud Build step of a deploy.
      - name: Verify the hashed lock
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --quiet --require-hashes -r requirements.lock
          /tmp/lockcheck/bin/python -c "import fastapi, uvicorn, google.auth, \
            google.cloud.firestore, google.cloud.tasks_v2, firebase_admin, \
            requests, cryptography, pydantic; print('lock imports OK')"
          python - <<'PY'
          import re, pathlib

          def pins(text):
              """name -> version. Extras stripped: the lock writes uvicorn[standard]."""
              found = {}
              for line in text.splitlines():
                  line = line.strip().lower()
                  if not line or line.startswith(("#", "-", " ")):
                      continue
                  m = re.match(r"^([a-z0-9._-]+)(?:\[[^\]]*\])?\s*==\s*([^\s\\]+)", line)
                  if m:
                      found[m.group(1)] = m.group(2)
              return found

          direct = pins(pathlib.Path("requirements.txt").read_text())
          locked = pins(pathlib.Path("requirements.lock").read_text())
          missing = sorted(set(direct) - set(locked))
          if missing:
              raise SystemExit(f"requirements.txt entries absent from the lock: {missing}")
          mismatched = sorted(
              f"{name}: txt={direct[name]} lock={locked[name]}"
              for name in direct
              if locked[name] != direct[name]
          )
          if mismatched:
              raise SystemExit(
                  "requirements.lock versions differ from requirements.txt: "
                  + "; ".join(mismatched)
              )
          print(f"lock covers all {len(direct)} direct dependencies at matching versions")
          PY

      # Everything above runs against tests/fake_firestore.py, whose transactions
      # apply writes immediately with no isolation and no retries. That makes the
      # concurrency guarantees consume_nonce / complete_file / bump_session_progress
      # exist to provide structurally untestable there. This tier runs the same
      # code against a real Firestore.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java for the emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # firebase-tools 15 dropped emulator support for Java < 21 (v15.0.0 notes).
          java-version: '21'

      # Appends to the backend gate's coverage data (backend/.coverage), so the
      # transaction paths only a real Firestore reaches count, and gates the
      # total two points under the measured 95.54 % (2026-10-08).
      - name: Run Firestore emulator tier
        env:
          GOOGLE_CLOUD_PROJECT: semper-ci-emulator
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npm install -g firebase-tools@15.31.0
          firebase emulators:exec \
            --only firestore \
            --config firebase.emulator.json \
            --project semper-ci-emulator \
            'pytest tests/test_firestore_emulator_integration.py -v --cov=app --cov-append --cov-report=term --cov-fail-under=93'

  # ===================================================================
  # Firestore rules — the deny-all rules against the emulator
  # ===================================================================
  # Firestore is reached only by the backend's Admin SDK, which bypasses
  # rules, so firestore.rules denies every client. This proves it with
  # @firebase/rules-unit-testing for each collection backend/app uses:
  # signed out, as the owner, as another user and with admin-looking claims,
  # every get, list, query, collectionGroup query and write fails. A guard
  # test fails when backend/app names a collection the list misses.
  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    defaults:
      run:
        working-directory: firestore-rules-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-rules-tests/package-lock.json

      - name: Set up Java for the emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # firebase-tools 15 dropped emulator support for Java < 21 (v15.0.0 notes).
          java-version: '21'

      - name: Install the pinned emulator and SDK
        run: npm ci --no-audit --no-fund

      # A demo- project id: the emulator never reaches a real project.
      - name: Rules tests on the Firestore emulator
        run: >
          npx firebase emulators:exec --only firestore --project demo-rules
          --config firebase.json "node --test"

      - name: Upload rules coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firestore-rules-coverage
          path: firestore-rules-tests/coverage/**
          if-no-files-found: ignore

  # ===================================================================
  # Tier 5 — Signed release build (arm64-v8a), with R8
  # Runs on an engine/JNI change, a packaging change (keep rules, the app's
  # build script, the version catalog), the labels and the weekly run; even
  # when Tier 1 is skipped, never after its static checks failed.
  # ===================================================================
  tier5-signed-release:
    name: Tier 5 — Signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-static]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-static.result == 'success' || needs.tier1-static.result == 'skipped')
      && needs.changes.outputs.release_build == 'true'
    steps:
      - uses: actions/checkout@v7

      # Submodules after checkout: Eigen from cache, every fetch retried.
      - uses: ./.github/actions/checkout-submodules

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: arm64

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # versionCode 1, below every release: this APK is signed with the release
      # key, so with the run number (hundreds, against release.yml's tens) it
      # installed over a release and Android then refused every real release
      # until an uninstall (TD-148 in material_testing; docs/ops/RELEASING.md).
      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && 'app/release.keystore' || '' }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: >
          ./gradlew --console=plain
          :app:assembleRelease
          -PabiFilters=arm64-v8a
          -PnativeCompilerLauncher=ccache
          -PversionCode=1

      - uses: ./.github/actions/check-arm64-so

      - name: Verify release signature
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            || { echo "APK is NOT validly signed"; exit 1; }

      # The release hardening gate the Release workflow runs (signed or not:
      # aapt2 reads an unsigned APK too). No pins are passed here, so the
      # cert-pins line is a warning.
      - name: Inspect release APK hardening
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 scripts/check_release_apk.py "$APK" \
            --aapt2 "$BUILD_TOOLS/aapt2" \
            --mapping app/build/outputs/mapping/release/mapping.txt

      - name: Note unsigned build
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "::notice::No signing secrets available — release APK built but signature NOT verified."

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-arm64-
          except-key: cxx-arm64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-arm64-
          except-key: ccache-arm64-${{ steps.native-ci.outputs.cache-infix }}

  # ===================================================================
  # Benchmarks — label `benchmark`, dispatch run_benchmark, or a PR that
  # touches a hot path (the `hot_path` filter). Macrobenchmark startup
  # (:benchmark) and the :app HotPathMicroBenchmark share one emulator boot.
  # The macro numbers and the micro smoke run are uploaded, not gated; on a PR
  # the micro suite also runs A/B against the PR's base, which is a gate.
  # ===================================================================
  tier-benchmark:
    name: Benchmarks (macro + micro)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, tier1-static]
    permissions:
      contents: read
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.benchmark_ci == 'true'
      && (needs.tier1-static.result == 'success' || needs.tier1-static.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      # Submodules after checkout: Eigen from cache, every fetch retried.
      - uses: ./.github/actions/checkout-submodules

      - uses: ./.github/actions/setup-android-build
        with:
          # OpenCV's android samples ship ancient gradle-wrapper.jar files that
          # fail checksum validation when submodules are checked out recursively.
          validate-wrappers: false

      # The microbenchmark lives in :app's androidTest, so it needs the same
      # debug x86_64 native build as tier 3; restore tier 3's .cxx / ccache.
      - uses: ./.github/actions/setup-native-ci
        with:
          abi: x86_64

      - uses: ./.github/actions/enable-kvm

      # Two native builds (benchmark + debug) plus the AVD: free space as tier 3 does.
      - name: Free disk space for AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      # The app id, read from app/build.gradle.kts as :benchmark reads it, so this
      # job runs unchanged in material_testing (its own id). The emulator script
      # runs each line in its own shell, so it takes the id from the environment.
      - name: Read the app id
        run: |
          APP_ID=$(sed -n 's/^ *applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$APP_ID" && test "$(printf '%s\n' "$APP_ID" | wc -l)" -eq 1
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      # The micro A/B's two builds (TD-199): the PR's base (A) and the PR (B),
      # each a debug app APK and its androidTest APK. Both build in this
      # checkout, base first, so the PR's build is the one left in app/build
      # and the base's native objects are reused where the engine is the same.
      # Each folder's app-id.txt is the id its checkout builds: a PR that
      # renames the app runs its base under the old id.
      - name: Build the PR's base and the PR for the microbenchmark A/B
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ab="$RUNNER_TEMP/micro-ab"
          head=$(git rev-parse HEAD)
          # A copy: the base checked out below may predate the script.
          retry="$RUNNER_TEMP/retry.sh"
          cp .github/actions/checkout-submodules/retry.sh "$retry"
          build() {
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PabiFilters=x86_64 -PnativeCompilerLauncher=ccache --console=plain
            mkdir -p "$ab/$1"
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ab/$1/"
            sed -nE 's/^\s*applicationId\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts > "$ab/$1/app-id.txt"
          }
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c advice.detachedHead=false checkout "$BASE_SHA"
          bash "$retry" git submodule update --init --recursive
          build A
          git -c advice.detachedHead=false checkout "$head"
          bash "$retry" git submodule update --init --recursive
          build B
          ls -l "$ab"/*
          cat "$ab"/*/app-id.txt

      # The minified benchmark app (R8, as release) and the Macrobenchmark APK,
      # built before the emulator boots so it does not sit idle through the
      # compile. x86_64 only and through ccache: without -PabiFilters the
      # benchmark type adds x86_64 to release's arm64-v8a, and arm64 never runs
      # on this AVD (4 of the step's 14 minutes in material_testing run
      # 40310692266). The
      # connected task below passes the same flags, so it finds these up to date.
      - name: Build the minified benchmark app
        run: >
          ./gradlew :app:assembleBenchmark :benchmark:assembleBenchmark
          -PabiFilters=x86_64 -PnativeCompilerLauncher=ccache --console=plain

      # One emulator boot; each line is its own command, and a failing one fails
      # the step.
      # - The launch smoke (scripts/launch_smoke.py) cold-starts the minified app
      #   and fails on a crash or an R8 symptom in logcat: nothing else launches
      #   an R8 build before a user does.
      # - Macrobenchmarks: on a PR a dry run (one pass each, androidx.benchmark
      #   dryRunMode), since their emulator numbers are not gated; the full
      #   iterations run on dispatch and with the `benchmark` label. The smoke's
      #   install is removed first: this Gradle run packages the app again, and
      #   its install over the smoke's failed on the signature, which the
      #   connected task logged and still called BUILD SUCCESSFUL with no test
      #   run (TD-349). So ci_test_report.py --require-tests fails the step
      #   unless the run left a test case and no failing one.
      # - The micro smoke run only when there is no A/B (dispatch): on a PR the
      #   A/B's rounds run the same class twice from this build. It is a debug
      #   build on an emulator, hence DEBUGGABLE in its suppress list: its
      #   numbers are relative, not absolutes. It goes through `am instrument`,
      #   not connectedDebugAndroidTest: an instrumentation argument passed
      #   through Gradle arrives cut at its first comma (only EMULATOR was
      #   suppressed, TD-86), and API 34 raises ACTIVITY-MISSING and
      #   NOT-AOT-COMPILED too. `am instrument` exits 0 on test failures, so the
      #   grep on its summary line is the pass/fail.
      # - On a PR the last line runs the micro A/B (scripts/micro_ab.py): A B B A
      #   on this emulator, failing a hot path whose median is over microAbMargin
      #   (benchmark/gates.json) above the base's. The `perf-accepted` label makes
      #   it report without failing, for a slowdown the PR means to make.
      - name: Run startup Macrobenchmarks and hot-path Microbenchmarks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MICRO_AB_FLAGS: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') && '--advisory' || '' }}
          MACRO_DRY_RUN: >-
            ${{ github.event_name == 'pull_request'
            && !contains(github.event.pull_request.labels.*.name, 'benchmark')
            && '-Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true' || '' }}
        with:
          # Same image as tier 3. API 37 empties gfxinfo framestats, so
          # startActivityAndWait cannot confirm launch.
          api-level: 34
          arch: x86_64
          # The action's default options plus -no-metrics (see tier 3).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            python3 scripts/launch_smoke.py app/build/outputs/apk/benchmark/app-benchmark.apk --package "$APP_ID" --out launch-smoke
            "$ANDROID_HOME/platform-tools/adb" uninstall "$APP_ID" || true
            ./gradlew :benchmark:connectedBenchmarkAndroidTest -PabiFilters=x86_64 -PnativeCompilerLauncher=ccache --console=plain -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY,UNLOCKED $MACRO_DRY_RUN
            python3 scripts/ci_test_report.py --require-tests benchmark/build/outputs/androidTest-results
            [ -d "$RUNNER_TEMP/micro-ab/A" ] || ./gradlew :app:installDebug :app:installDebugAndroidTest -PabiFilters=x86_64 -PnativeCompilerLauncher=ccache --console=plain
            [ -d "$RUNNER_TEMP/micro-ab/A" ] || "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -e class com.sempermechanics.semper.benchmark.HotPathMicroBenchmark -e androidx.benchmark.suppressErrors EMULATOR,DEBUGGABLE,LOW-BATTERY,UNLOCKED,ACTIVITY-MISSING,NOT-AOT-COMPILED "$APP_ID.test/androidx.test.runner.AndroidJUnitRunner" | tee micro-instrument.txt
            mkdir -p app/build/outputs/connected_android_test_additional_output
            [ -d "$RUNNER_TEMP/micro-ab/A" ] || "$ANDROID_HOME/platform-tools/adb" pull "/sdcard/Android/media/$APP_ID.test" app/build/outputs/connected_android_test_additional_output || true
            [ -d "$RUNNER_TEMP/micro-ab/A" ] || "$ANDROID_HOME/platform-tools/adb" pull "/sdcard/Android/media/$APP_ID" app/build/outputs/connected_android_test_additional_output || true
            "$ANDROID_HOME/platform-tools/adb" logcat -d -s Benchmark:I || true
            [ -d "$RUNNER_TEMP/micro-ab/A" ] || grep -q "^OK (" micro-instrument.txt
            if [ -d "$RUNNER_TEMP/micro-ab/A" ]; then python3 scripts/micro_ab.py --a "$RUNNER_TEMP/micro-ab/A" --b "$RUNNER_TEMP/micro-ab/B" --out micro-ab --package "$APP_ID" $MICRO_AB_FLAGS; fi

      # The smoke runs' numbers are not gated (absolute times on an emulator say
      # nothing; the micro A/B above is the gate), but keep the raw
      # *-benchmarkData.json/.perfetto-trace files so a run can be read by hand.
      # Failing test names and each benchmark's min / median / max into the log.
      - name: Report benchmark results
        if: always()
        run: >
          python3 scripts/ci_test_report.py
          benchmark/build/outputs/androidTest-results
          benchmark/build/outputs/connected_android_test_additional_output
          app/build/outputs/androidTest-results
          app/build/outputs/connected_android_test_additional_output

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-results
          path: benchmark/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn

      # Median timeNs and allocationCount per hot path (*-benchmarkData.json).
      - name: Upload microbenchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microbenchmark-results
          path: app/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn

      # The launch smoke's logcat and crash buffer, for a red smoke.
      - name: Upload launch smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-smoke
          path: launch-smoke/**
          if-no-files-found: ignore

      # Each A/B round's instrument output and benchmark JSON (1-A, 2-B, ...).
      - name: Upload microbenchmark A/B rounds
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: microbenchmark-ab
          path: micro-ab/**
          if-no-files-found: warn

  # ===================================================================
  # ci-ok — single required status check
  # ===================================================================
  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - secret-scan
      - engine-pin
      - legal-pages
      - console-pages
      - console-a11y
      - changes
      - tier1-static
      - tier1-app-fast
      - tier3-emulator-e2e
      - tier4-backend
      - firestore-rules
      - tier5-signed-release
      - tier-benchmark
      - engine-host-sanitized
    steps:
      - name: Check all tiers
        run: |
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.engine-pin.result }}" \
            "${{ needs.legal-pages.result }}" \
            "${{ needs.console-pages.result }}" \
            "${{ needs.console-a11y.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.tier1-static.result }}" \
            "${{ needs.tier1-app-fast.result }}" \
            "${{ needs.tier3-emulator-e2e.result }}" \
            "${{ needs.tier4-backend.result }}" \
            "${{ needs.firestore-rules.result }}" \
            "${{ needs.tier5-signed-release.result }}" \
            "${{ needs.tier-benchmark.result }}" \
            "${{ needs.engine-host-sanitized.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "FAILED: $result"; exit 1 ;;
            esac
          done
          echo "All tiers passed or were skipped."
          echo "Note: engine TSan and C-SDK CI run in sempermechanics/semper-dic-engine."
