name: CI

on:
  push:
    branches: [damodar, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # Tier 1 — Kotlin compile + JVM unit tests + quality gates (no NDK)
  # ===================================================================
  tier1-app-fast:
    name: Tier 1 — App fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      - name: Build, test and quality gates
        run: >
          ./gradlew --continue --console=plain
          :app:testDebugUnitTest
          spotlessCheck
          :app:detekt
          :app:lintDebug
          :app:compileReleaseKotlin

  # ===================================================================
  # Tier 2a — Host-side engine correctness
  # ===================================================================
  tier2-engine-host:
    name: Tier 2 — Engine host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'engine')
      || !contains(join(github.event.pull_request.head.sha, ''), 'skip-native')
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dic-submodules

      - name: Cache OpenCV packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-libopencv-dev-${{ runner.os }}-v1

      - name: Install OpenCV + ccache
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-cache" libopencv-dev ccache
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Cache ccache objects
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-host-tests-${{ github.sha }}
          restore-keys: ccache-host-tests-

      - name: Configure
        run: >
          cmake -S native/tests -B build/native-tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_REQUIRE_OPENCV=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/native-tests -j

      - name: Run tests
        run: ./build/native-tests/dic_tests

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      # Last main step: the old entries go before actions/cache saves the new one.
      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-host-tests-
          except-key: ccache-host-tests-${{ github.sha }}

  # ===================================================================
  # Tier 2b — Sanitizers (ASan+UBSan, TSan)
  # ===================================================================
  tier2-sanitizers:
    name: Tier 2 — Sanitized (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'engine')
      || !contains(join(github.event.pull_request.head.sha, ''), 'skip-native')
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: 'address,undefined'
            id: asan-ubsan
          - sanitizer: 'thread'
            id: tsan
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dic-submodules

      - name: Install ccache
        run: sudo apt-get install -y -qq ccache

      - name: Cache ccache objects
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-san-${{ matrix.id }}-${{ github.sha }}
          restore-keys: ccache-san-${{ matrix.id }}-

      - name: Configure
        run: >
          cmake -S native/tests -B build/native-tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_SANITIZER=${{ matrix.sanitizer }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/native-tests -j

      - name: Run tests
        run: ./build/native-tests/dic_tests

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-san-${{ matrix.id }}-
          except-key: ccache-san-${{ matrix.id }}-${{ github.sha }}

  # ===================================================================
  # Tier 3 — Emulator E2E (JNI smoke + Espresso)
  # ===================================================================
  tier3-emulator-e2e:
    name: Tier 3 — Emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'engine')
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      - name: Cache native build (.cxx) — x86_64
        uses: actions/cache@v6
        with:
          path: app/.cxx
          key: cxx-x86_64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}
          restore-keys: cxx-x86_64-

      - name: Install ccache
        run: sudo apt-get install -y -qq ccache

      - name: Cache ccache objects — x86_64
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-x86_64-${{ github.sha }}
          restore-keys: ccache-x86_64-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >
            ./gradlew :app:connectedDebugAndroidTest
            -PabiFilters=x86_64
            -PnativeCompilerLauncher=ccache
            --console=plain
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-x86_64-
          except-key: cxx-x86_64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-x86_64-
          except-key: ccache-x86_64-${{ github.sha }}

  # ===================================================================
  # Tier 4 — Backend pytest
  # ===================================================================
  tier4-backend:
    name: Tier 4 — Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'push'
      || contains(join(github.event.pull_request.changed_files, ','), 'backend/')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Lint
        run: ruff check app/ tests/

      - name: Test
        run: pytest tests/ -v

  # ===================================================================
  # Tier 5 — Signed release build (arm64-v8a)
  # ===================================================================
  tier5-signed-release:
    name: Tier 5 — Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'engine')
      || contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      - name: Cache native build (.cxx) — arm64
        uses: actions/cache@v6
        with:
          path: app/.cxx
          key: cxx-arm64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}
          restore-keys: cxx-arm64-

      - name: Install ccache
        run: sudo apt-get install -y -qq ccache

      - name: Cache ccache objects — arm64
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-arm64-${{ github.sha }}
          restore-keys: ccache-arm64-

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content
          SIGNING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && 'app/release.keystore' || '' }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: >
          ./gradlew --console=plain
          :app:minifyReleaseWithR8
          :app:assembleRelease
          -PabiFilters=arm64-v8a
          -PnativeCompilerLauncher=ccache

      - name: Verify arm64-v8a .so in release APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found — signing secrets may be missing (unsigned build skipped)"
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          fi
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libindicvision_core.so" \
            || { echo "MISSING arm64-v8a native lib"; exit 1; }

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: ccache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache --show-stats

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-arm64-
          except-key: cxx-arm64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-arm64-
          except-key: ccache-arm64-${{ github.sha }}

  # ===================================================================
  # ci-ok — single required status check
  # ===================================================================
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - tier1-app-fast
      - tier2-engine-host
      - tier2-sanitizers
      - tier3-emulator-e2e
      - tier4-backend
      - tier5-signed-release
    steps:
      - name: Check all tiers
        run: |
          results=()
          for result in \
            "${{ needs.tier1-app-fast.result }}" \
            "${{ needs.tier2-engine-host.result }}" \
            "${{ needs.tier2-sanitizers.result }}" \
            "${{ needs.tier3-emulator-e2e.result }}" \
            "${{ needs.tier4-backend.result }}" \
            "${{ needs.tier5-signed-release.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "FAILED: $result"; exit 1 ;;
            esac
          done
          echo "All tiers passed or were skipped."
