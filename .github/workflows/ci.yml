name: CI

on:
  push:
    branches: [damodar, main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_ci:
        description: 'Run every tier (ignore path filters)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests:read needed by gitleaks-action on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Dependabot branches: no Actions secrets (fork-like) and the org
      # gitleaks-action also 403s the PR commits API under Dependabot's
      # token. Key off head_ref (not actor) so rebases by humans/bots still
      # take the CLI path. Prefer also setting Dependabot secret
      # GITLEAKS_LICENSE if you later want the action on those PRs.
      - name: Scan repository and Git history
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Scan with gitleaks CLI (Dependabot branches)
        if: ${{ startsWith(github.head_ref, 'dependabot/') }}
        env:
          # Match gitleaks-action PR mode: only commits on the PR, not full history
          # (full history still surfaces pre-allowlist noise like old client keys).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VER=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact \
            --log-opts="${BASE_SHA}..HEAD"

  legal-pages:
    name: Legal pages match their source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The published /privacy/ and /terms/ pages are generated from
    # docs/legal/*.md. They were previously placeholders whose own body said
    # "keep this in sync before launch" while the app linked to them as the real
    # policy. This makes drift a build failure instead of a promise.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/render_legal_pages.py --check

  # ===================================================================
  # Path filters — same rules on PR and push. Prove only what the diff
  # can break. Optional full matrix via `full-ci` label or workflow_dispatch.
  # No scheduled/weekly runs.
  # ===================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull-requests:read for the Files API; Dependabot still 403s that API, so
    # PRs also pass base SHA below and paths-filter diffs via local git.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.flags.outputs.app }}
      native_core: ${{ steps.flags.outputs.native_core }}
      native_jni: ${{ steps.flags.outputs.native_jni }}
      backend: ${{ steps.flags.outputs.backend }}
      full_ci: ${{ steps.flags.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          # Explicit base forces git-diff mode (avoids PR Files API 403 on Dependabot).
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          filters: |
            app:
              - 'app/**'
              - '!app/src/main/cpp/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
            # Engine sources live in semperdic/semper-dic-engine. App CI only
            # sees pin bumps (gitlink) / .gitmodules — host/sanitizer suites run
            # in the engine repo's own workflow.
            native_core:
              - 'native'
              - '.gitmodules'
            native_jni:
              - 'native'
              - '.gitmodules'
              - 'app/src/main/cpp/**'
              - 'app/src/main/java/com/indicvision/semper/SemperNativeLib.kt'
            backend:
              - 'backend/**'
            ci_workflow:
              - '.github/workflows/ci.yml'
            android_test:
              - 'app/src/androidTest/**'
            packaging:
              - 'app/build.gradle.kts'
              - 'app/proguard-rules.pro'
              - 'gradle/libs.versions.toml'

      - name: Resolve tier flags
        id: flags
        env:
          FILTER_APP: ${{ steps.filter.outputs.app }}
          FILTER_NATIVE_CORE: ${{ steps.filter.outputs.native_core }}
          FILTER_NATIVE_JNI: ${{ steps.filter.outputs.native_jni }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_CI: ${{ steps.filter.outputs.ci_workflow }}
          FILTER_ANDROID_TEST: ${{ steps.filter.outputs.android_test }}
          FILTER_PACKAGING: ${{ steps.filter.outputs.packaging }}
          FULL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ci || false }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          full=false
          if [ "$FULL_DISPATCH" = "true" ] || [ "$FULL_LABEL" = "true" ] || [ "$FILTER_CI" = "true" ]; then
            full=true
          fi
          # Fail open: if paths-filter produced no outputs (empty before SHA), run all.
          if [ -z "$FILTER_APP$FILTER_NATIVE_CORE$FILTER_NATIVE_JNI$FILTER_BACKEND$FILTER_CI" ]; then
            full=true
          fi

          app=false; native_core=false; native_jni=false; backend=false
          if [ "$full" = "true" ]; then
            app=true; native_core=true; native_jni=true; backend=true
          else
            if [ "$FILTER_APP" = "true" ] || [ "$FILTER_ANDROID_TEST" = "true" ] || [ "$FILTER_PACKAGING" = "true" ]; then
              app=true
            fi
            if [ "$FILTER_NATIVE_CORE" = "true" ]; then native_core=true; fi
            if [ "$FILTER_NATIVE_JNI" = "true" ]; then native_jni=true; fi
            if [ "$FILTER_BACKEND" = "true" ]; then backend=true; fi
          fi

          {
            echo "app=$app"
            echo "native_core=$native_core"
            echo "native_jni=$native_jni"
            echo "backend=$backend"
            echo "full_ci=$full"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: app=$app native_core=$native_core native_jni=$native_jni backend=$backend full_ci=$full"

  # ===================================================================
  # Tier 1 — Kotlin compile + JVM unit tests + quality gates (no NDK)
  # ===================================================================
  tier1-app-fast:
    name: Tier 1 — App fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true'
      || needs.changes.outputs.full_ci == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      - name: Build, test and quality gates
        run: >
          ./gradlew --continue --console=plain
          :app:testDebugUnitTest
          spotlessCheck
          :app:detekt
          :app:lintDebug
          :app:compileReleaseKotlin

      - name: Kotlin coverage (report-only)
        run: ./gradlew --console=plain :app:koverLog

  # ===================================================================
  # Tier 2 — Engine host / sanitizers
  # Moved to semperdic/semper-dic-engine (.github/workflows/ci.yml).
  # App CI only links the pinned submodule (Tier 3 / Tier 5).
  # ===================================================================

  # ===================================================================
  # Tier 3 — Emulator (JNI smoke + AnalysisWizardSmokeTest; not full E2E)
  # Decoupled from Tier 1 so native-jni can run when app Tier 1 is skipped.
  # ===================================================================
  tier3-emulator-e2e:
    name: Tier 3 — Emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
      && (
        needs.changes.outputs.native_jni == 'true'
        || needs.changes.outputs.full_ci == 'true'
        || contains(github.event.pull_request.labels.*.name, 'e2e')
        || contains(github.event.pull_request.labels.*.name, 'engine')
      )
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: false
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      - name: Cache native build (.cxx) — x86_64
        uses: actions/cache@v6
        with:
          path: app/.cxx
          key: cxx-x86_64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', 'native/cmake/*.cmake', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}
          restore-keys: cxx-x86_64-

      - name: Install ccache
        run: sudo apt-get install -y -qq ccache

      - name: Cache ccache objects — x86_64
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-x86_64-${{ github.sha }}
          restore-keys: ccache-x86_64-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ubuntu-latest images leave ~7GB free after SDK/emulator install; default AVD
      # userdata wants ~7.4GB and fails with "Not enough space to create userdata partition".
      - name: Free disk space for AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          # Cap below typical free space so AVD create succeeds on crowded runners.
          disk-size: 4G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >
            ./gradlew :app:connectedDebugAndroidTest
            -PabiFilters=x86_64
            -PnativeCompilerLauncher=ccache
            --console=plain
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-x86_64-
          except-key: cxx-x86_64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', 'native/cmake/*.cmake', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-x86_64-
          except-key: ccache-x86_64-${{ github.sha }}

  # ===================================================================
  # Tier 4 — Backend pytest
  # ===================================================================
  tier4-backend:
    name: Tier 4 — Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.full_ci == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Lint
        # scripts/ included deliberately: the migration runner and the ops shell
        # scripts are run by hand against production and were previously neither
        # executed nor linted anywhere, so a syntax error surfaced there first.
        run: ruff check app/ tests/ scripts/ ../scripts/

      - name: Check ops shell scripts parse
        working-directory: .
        run: bash -n scripts/firestore-export.sh scripts/firestore-restore-drill.sh

      # Secret scanning (see the secret-scan job) covers what we committed; this
      # covers what we depend on. Audits the pinned runtime set, not the test
      # tooling. If a CVE lands with no fixed release, pin the advisory with
      # --ignore-vuln rather than deleting the gate.
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      # The image installs from requirements.lock with --require-hashes. Prove it
      # resolves on the runtime's Python (3.12) and still covers every direct
      # dependency, so a stale or mis-generated lock fails here rather than in
      # the Cloud Build step of a deploy.
      - name: Verify the hashed lock
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --quiet --require-hashes -r requirements.lock
          /tmp/lockcheck/bin/python -c "import fastapi, uvicorn, google.auth, \
            google.cloud.firestore, google.cloud.tasks_v2, firebase_admin, \
            requests, cryptography, pydantic; print('lock imports OK')"
          python - <<'PY'
          import re, pathlib

          def names(text):
              """Package names, extras stripped: the lock writes uvicorn[standard]."""
              found = set()
              for line in text.splitlines():
                  line = line.strip().lower()
                  if not line or line.startswith(("#", "-", " ")):
                      continue
                  m = re.match(r"^([a-z0-9._-]+)(\[[^\]]*\])?\s*==", line)
                  if m:
                      found.add(m.group(1))
                  elif re.match(r"^[a-z0-9._-]+(\[[^\]]*\])?\s*$", line):
                      found.add(re.split(r"\[", line)[0])
              return found

          direct = names(pathlib.Path("requirements.txt").read_text())
          locked = names(pathlib.Path("requirements.lock").read_text())
          missing = sorted(direct - locked)
          if missing:
              raise SystemExit(f"requirements.txt entries absent from the lock: {missing}")
          print(f"lock covers all {len(direct)} direct dependencies")
          PY

      - name: Test
        # Gated, not just reported. The floor sits just under the measured value
        # (78% at the time of writing) so ordinary churn does not break unrelated
        # PRs, while a real drop in coverage fails. Raise it when it climbs;
        # never lower it to make a red build green.
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=75

      # Everything above runs against tests/fake_firestore.py, whose transactions
      # apply writes immediately with no isolation and no retries. That makes the
      # concurrency guarantees consume_nonce / complete_file / bump_session_progress
      # exist to provide structurally untestable there. This tier runs the same
      # code against a real Firestore.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Java for the emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Firestore emulator tier
        env:
          GOOGLE_CLOUD_PROJECT: semper-ci-emulator
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npm install -g firebase-tools@13
          firebase emulators:exec \
            --only firestore \
            --config firebase.emulator.json \
            --project semper-ci-emulator \
            'pytest tests/test_firestore_emulator_integration.py -v'

  # ===================================================================
  # Tier 5 — Signed release build (arm64-v8a)
  # Decoupled from Tier 1 so native-jni can run when app Tier 1 is skipped.
  # ===================================================================
  tier5-signed-release:
    name: Tier 5 — Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, tier1-app-fast]
    permissions:
      contents: read
      actions: write   # prune-cache
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.tier1-app-fast.result == 'success' || needs.tier1-app-fast.result == 'skipped')
      && (
        needs.changes.outputs.native_jni == 'true'
        || needs.changes.outputs.full_ci == 'true'
        || contains(github.event.pull_request.labels.*.name, 'release')
        || contains(github.event.pull_request.labels.*.name, 'engine')
      )
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: false
          cache-read-only: ${{ github.ref != 'refs/heads/damodar' && github.ref != 'refs/heads/main' }}

      - name: Cache native build (.cxx) — arm64
        uses: actions/cache@v6
        with:
          path: app/.cxx
          key: cxx-arm64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', 'native/cmake/*.cmake', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}
          restore-keys: cxx-arm64-

      - name: Install ccache
        run: sudo apt-get install -y -qq ccache

      - name: Cache ccache objects — arm64
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-arm64-${{ github.sha }}
          restore-keys: ccache-arm64-

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content
          SIGNING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && 'app/release.keystore' || '' }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: >
          ./gradlew --console=plain
          :app:minifyReleaseWithR8
          :app:assembleRelease
          -PabiFilters=arm64-v8a
          -PnativeCompilerLauncher=ccache
          -PversionCode="${{ github.run_number }}"

      - name: Verify arm64-v8a .so in release APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "No release APK produced by assembleRelease"; exit 1; fi
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsemper_core.so" \
            || { echo "MISSING arm64-v8a native lib"; exit 1; }

      - name: Verify release signature
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            || { echo "APK is NOT validly signed"; exit 1; }

      - name: Note unsigned build
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "::notice::No signing secrets available — release APK built but signature NOT verified."

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: ccache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache --show-stats

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-arm64-
          except-key: cxx-arm64-${{ hashFiles('native/CMakeLists.txt', 'native/adapters/android/CMakeLists.txt', 'native/cmake/*.cmake', '.gitmodules', 'native/**/*.cpp', 'native/**/*.h', 'native/**/*.hpp') }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-arm64-
          except-key: ccache-arm64-${{ github.sha }}

  # ===================================================================
  # ci-ok — single required status check
  # ===================================================================
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secret-scan
      - legal-pages
      - changes
      - tier1-app-fast
      - tier3-emulator-e2e
      - tier4-backend
      - tier5-signed-release
    steps:
      - name: Check all tiers
        run: |
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.legal-pages.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.tier1-app-fast.result }}" \
            "${{ needs.tier3-emulator-e2e.result }}" \
            "${{ needs.tier4-backend.result }}" \
            "${{ needs.tier5-signed-release.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "FAILED: $result"; exit 1 ;;
            esac
          done
          echo "All tiers passed or were skipped."
          echo "Note: engine host/sanitizer/C-SDK CI runs in semperdic/semper-dic-engine."
