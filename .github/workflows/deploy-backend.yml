name: Deploy Backend

# Staging and production Cloud Run deploys with immutable revision pins,
# post-deploy smoke on /readyz, and automatic traffic rollback on smoke failure.
# Reminder: challenges.expireAt Firestore TTL is a one-time field policy
# (docs/backend/BACKEND_SETUP_GCP.md §A2a), not applied by this workflow.
# Auth is via Workload Identity Federation — set GCP_WIF_PROVIDER / GCP_DEPLOY_SA
# in each GitHub Environment (staging / production) before first use.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (GitHub Environment + default service name)
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      project:
        description: >
          GCP project id (e.g. indicvision-dic-app). NOT the Cloud Run service
          name.
        required: true
      region:
        description: >
          Cloud Run region. Default matches docs/backend/BACKEND_SETUP_GCP.md and
          config.py's TASKS_LOCATION default — Cloud Tasks location should match
          Cloud Run's region. NOTE: asia-south1 is outside GCP's "always free"
          egress region set (that tier is NA-only) — verify current free-tier
          terms for whatever region a deploy actually targets before relying on
          them for capacity planning.
        required: true
        default: asia-south1
      service:
        description: Cloud Run service name (empty = indic-api / indic-api-staging)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-test.txt
      - run: ruff check app/ tests/
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Resolve service name
        run: |
          SVC="${{ github.event.inputs.service }}"
          if [ -z "$SVC" ]; then
            if [ "${{ github.event.inputs.environment }}" = "production" ]; then
              SVC="indic-api"
            else
              SVC="indic-api-staging"
            fi
          fi
          echo "service=$SVC" >> "$GITHUB_OUTPUT"
          # Production is reachable only through API Gateway, which invokes the
          # service with its own SA (see gateway/openapi.yaml jwt_audience). A
          # publicly-invokable prod service would let callers bypass every
          # x-google-management quota by hitting the Cloud Run URL directly.
          # Staging stays public so it can be smoke-tested without the gateway.
          #
          # One-time IAM prerequisite before the first private prod deploy:
          #   gcloud run services add-iam-policy-binding indic-api \
          #     --member="serviceAccount:${GATEWAY_SA}" --role=roles/run.invoker
          #     --project PROJECT --region REGION
          # plus the same binding for the deploy SA, so the smoke step below can
          # still reach /readyz. Flipping this flag first takes the API down.
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "ingress=--no-allow-unauthenticated" >> "$GITHUB_OUTPUT"
          else
            echo "ingress=--allow-unauthenticated" >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Validate project input
        env:
          PROJECT: ${{ github.event.inputs.project }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          AUTH_PROJECT=$(gcloud config get-value project 2>/dev/null || true)
          if [ -z "$PROJECT" ]; then
            echo "::error::workflow input 'project' is empty"
            exit 1
          fi
          # Operators often paste the Cloud Run service name into "project".
          if [ "$PROJECT" = "$SERVICE" ] || [[ "$PROJECT" == indic-api* ]]; then
            echo "::error::project='$PROJECT' looks like a Cloud Run service name, not a GCP project id. Use the project id (e.g. indicvision-dic-app)."
            exit 1
          fi
          if [ -n "$AUTH_PROJECT" ] && [ "$PROJECT" != "$AUTH_PROJECT" ]; then
            echo "::error::project input '$PROJECT' does not match WIF-authenticated project '$AUTH_PROJECT'."
            exit 1
          fi
          echo "Deploy target project=$PROJECT service=$SERVICE"

      - id: previous
        name: Capture previous serving revision
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          # Distinguish "service does not exist yet" from a wrong project /
          # permission error — the latter must not look like a first deploy.
          set +e
          PREV=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/tmp/describe.err)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -Eiq 'NOT_FOUND|was not found|Cannot find|does not exist' /tmp/describe.err; then
              PREV=""
            else
              cat /tmp/describe.err >&2
              echo "::error::Could not describe $SERVICE in project=$PROJECT region=$REGION (rc=$rc). Check the project id input."
              exit "$rc"
            fi
          fi
          echo "revision=${PREV}" >> "$GITHUB_OUTPUT"
          # Cloud Run rejects --no-traffic on first create of a service.
          if [ -n "$PREV" ]; then
            echo "no_traffic=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_traffic=false" >> "$GITHUB_OUTPUT"
            echo "First deploy of $SERVICE: allowing traffic on create (no_traffic unsupported)."
          fi

      # deploy-cloudrun *merges* env_vars into the live revision's env, so a
      # variable this workflow stopped setting stays on the service forever.
      # MAX_SESSIONS_PER_USER / PRO_MAX_SESSIONS_PER_USER were retired by the
      # licensing rollout (DEMO_MAX_ANALYSES / LICENSED_MAX_SESSIONS_PER_USER
      # replace them); the code ignores them, but a stale value misleads anyone
      # reading the console. Print the live env and warn — removal is a manual
      # `gcloud run services update --remove-env-vars` after promote, so the
      # previous revision keeps its env for rollback.
      - name: Describe live env
        if: steps.previous.outputs.revision != ''
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(spec.template.spec.containers[0].env)' \
            | tr ';' '\n' | sed -E "s/'value': '[^']*'/'value': <redacted>/" \
            | tee /tmp/live-env.txt
          for stale in MAX_SESSIONS_PER_USER PRO_MAX_SESSIONS_PER_USER; do
            if grep -q "'name': '$stale'" /tmp/live-env.txt; then
              echo "::warning::$stale is still set on $SERVICE. It is ignored since the licensing rollout; remove it after promote with: gcloud run services update $SERVICE --project $PROJECT --region $REGION --remove-env-vars $stale"
            fi
          done

      # Deploy the candidate WITHOUT shifting live traffic when a prior revision
      # exists. A prior deploy with no_traffic=false still left 100% on the
      # previous revision while smoke ran (new revision Ready+Retired with zero
      # requests), so CI validated the old __readyz__ probe and rolled "back" to
      # itself. Tag + no_traffic makes the smoke target unambiguous; promote only
      # after /readyz passes. First-time creates must omit no_traffic.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          project_id: ${{ github.event.inputs.project }}
          service: ${{ steps.meta.outputs.service }}
          region: ${{ github.event.inputs.region }}
          # Dockerfile in backend/ builds an immutable image per git SHA (Cloud
          # Build tags by digest). Never promote a mutable :latest reference.
          source: backend
          no_traffic: ${{ steps.previous.outputs.no_traffic }}
          tag: cand-${{ github.run_id }}-${{ github.run_attempt }}
          # The licensing settings carry expression defaults: an unset repo
          # variable must resolve to the safe value (demo cap 25, MFA on, App
          # Check off — `enforce` would 403 every installed pre-App-Check build),
          # never to an empty string the backend would parse as something else.
          # CONSOLE_ORIGINS is space-separated: this block splits pairs on
          # commas, so a comma inside a value truncates it.
          env_vars: |-
            GOOGLE_CLOUD_PROJECT=${{ github.event.inputs.project }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            SHARED_DRIVE_ID=${{ vars.SHARED_DRIVE_ID }}
            SERVICE_ACCOUNT_EMAIL=${{ vars.SERVICE_ACCOUNT_EMAIL }}
            AUTO_APPROVE_HD=${{ vars.AUTO_APPROVE_HD }}
            ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
            SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
            NOTIFY_FROM=${{ vars.NOTIFY_FROM }}
            TASKS_QUEUE=${{ vars.TASKS_QUEUE }}
            TASKS_LOCATION=${{ vars.TASKS_LOCATION }}
            TASKS_TARGET_BASE_URL=${{ vars.TASKS_TARGET_BASE_URL }}
            TASKS_INVOKER_SA=${{ vars.TASKS_INVOKER_SA }}
            REQUIRE_ATTESTED_UPLOADS=${{ vars.REQUIRE_ATTESTED_UPLOADS }}
            DEMO_MAX_ANALYSES=${{ vars.DEMO_MAX_ANALYSES || '25' }}
            LICENSED_MAX_SESSIONS_PER_USER=${{ vars.LICENSED_MAX_SESSIONS_PER_USER || '999' }}
            ADMIN_WEB_MFA_ENABLED=${{ vars.ADMIN_WEB_MFA_ENABLED || '1' }}
            APP_CHECK_MODE=${{ vars.APP_CHECK_MODE || 'off' }}
            SELF_DEVICE_CHANGE_COOLDOWN_DAYS=${{ vars.SELF_DEVICE_CHANGE_COOLDOWN_DAYS || '30' }}
            CONSOLE_ORIGINS=${{ vars.CONSOLE_ORIGINS || 'https://app.sempermechanics.com https://indicvision-dic-app-auth.firebaseapp.com' }}
          secrets: |-
            RESEND_API_KEY=resend-api-key:latest
          flags: >-
            ${{ steps.meta.outputs.ingress }} --cpu=1 --memory=512Mi
            --min-instances=0 --max-instances=10 --concurrency=40 --timeout=300
            --service-account=${{ vars.SERVICE_ACCOUNT_EMAIL }}
            --revision-suffix=${{ github.run_id }}-${{ github.run_attempt }}

      # Cloud Run requires aud = the *service* URL even when calling a traffic
      # tag (docs: authenticating/service-to-service). Minting against the tag
      # URL yields HTML 401 before the container runs.
      - id: service_url
        name: Resolve service URL (ID token audience)
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - id: smoke_token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.service_url.outputs.url }}

      - name: Post-deploy smoke (/readyz on candidate)
        id: smoke
        env:
          # Tag URL from deploy (cand-…---indic-api-….run.app); aud is service URL.
          URL: ${{ steps.deploy.outputs.url }}
          ID_TOKEN: ${{ steps.smoke_token.outputs.id_token }}
        run: |
          set -euo pipefail
          echo "Smoking candidate ${URL}/readyz"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' --max-time 15 \
              -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/readyz" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "readyz ok"
              cat /tmp/readyz.json
              exit 0
            fi
            echo "readyz attempt $i → HTTP $CODE"
            sleep 5
          done
          echo "Smoke failed"
          cat /tmp/readyz.json || true
          exit 1

      # Only reached when smoke passed — live traffic stays on PREV until here.
      - id: promote
        name: Promote candidate to 100% traffic
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
          REV: ${{ steps.meta.outputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "Routing 100% traffic to ${REV}"
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions="${REV}=100" \
            --project "$PROJECT" --region "$REGION"

      # Deliberately AFTER the smoke + promote gate.
      - name: Record immutable image digest
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
          REV: ${{ steps.meta.outputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          IMG=$(gcloud run revisions describe "$REV" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(status.imageDigest)')
          echo "Deployed revision=${REV} imageDigest=${IMG}"

      # Revert only if we already moved live traffic (promote succeeded) and a
      # later step failed. A failed smoke leaves PREV serving — nothing to undo.
      - name: Rollback traffic on post-promote failure
        if: failure() && steps.promote.outcome == 'success' && steps.previous.outputs.revision != ''
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
          PREV: ${{ steps.previous.outputs.revision }}
        run: |
          set -euo pipefail
          echo "Routing 100% traffic back to ${PREV}"
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions="${PREV}=100" \
            --project "$PROJECT" --region "$REGION"
