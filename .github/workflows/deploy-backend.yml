name: Deploy Backend

# Staging and production Cloud Run deploys with immutable revision pins,
# post-deploy smoke on /readyz, and automatic traffic rollback on smoke failure.
# Reminder: challenges.expireAt Firestore TTL is a one-time field policy
# (docs/backend/BACKEND_SETUP_GCP.md §A2a), not applied by this workflow.
# Auth is via Workload Identity Federation — set GCP_WIF_PROVIDER / GCP_DEPLOY_SA
# in each GitHub Environment (staging / production) before first use.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (GitHub Environment + default service name)
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      project:
        description: >
          GCP project id (e.g. indicvision-dic-app). NOT the Cloud Run service
          name.
        required: true
      region:
        description: >
          Cloud Run region. Default matches docs/backend/BACKEND_SETUP_GCP.md and
          config.py's TASKS_LOCATION default — Cloud Tasks location should match
          Cloud Run's region. NOTE: asia-south1 is outside GCP's "always free"
          egress region set (that tier is NA-only) — verify current free-tier
          terms for whatever region a deploy actually targets before relying on
          them for capacity planning.
        required: true
        default: asia-south1
      service:
        description: Cloud Run service name (empty = semper-api / semper-api-staging)
        required: false
        default: ""
      release_train:
        description: >
          App release train this backend ships with, set as the Cloud Run
          label release-train on the service and the new revision (TD-262).
          Empty = the newest v* tag reachable from the deployed commit, or
          "untagged". Lowercased; dots and other characters become dashes;
          cut to 63 characters.
        required: false
        default: ""
      gateway_mode:
        description: >
          dry-run renders the gateway spec and prints its diff against the
          live config; apply also creates the config and switches the gateway
          (ADR-006). Staging's gateway is semper-gw-staging.
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    # Only the upstream repo deploys or touches production. material_testing
    # carries this file through its syncs; there it would deploy semper-api
    # (or, on the schedule, fail daily for want of secrets).
    if: github.repository == 'sempermechanics/semperdic-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-gate

  deploy:
    needs: test
    # Production ships only what is on main; staging may deploy a branch.
    if: github.event.inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ github.event.inputs.environment }}
    outputs:
      service: ${{ steps.meta.outputs.service }}
    steps:
      # Full history and tags: the release-train step runs git describe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve service name
        # Inputs via env, not ${{ }} in the script, so a crafted value cannot
        # become shell.
        env:
          SVC_INPUT: ${{ github.event.inputs.service }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
        run: |
          SVC="${SVC_INPUT}"
          if [ -z "$SVC" ]; then
            if [ "${TARGET_ENV}" = "production" ]; then
              SVC="semper-api"
            else
              SVC="semper-api-staging"
            fi
          fi
          echo "service=$SVC" >> "$GITHUB_OUTPUT"
          # Production is reachable only through API Gateway, which invokes the
          # service with its own SA (see gateway/openapi.yaml jwt_audience). A
          # publicly-invokable prod service would let callers bypass every
          # x-google-management quota by hitting the Cloud Run URL directly.
          # Staging is private too: --allow-unauthenticated binds allUsers,
          # which would undo its service-account-only invoker list on every
          # deploy. The smoke step below already sends an ID token.
          #
          # One-time IAM prerequisite per service before its first deploy
          # from here:
          #   gcloud run services add-iam-policy-binding SERVICE \
          #     --member="serviceAccount:${GATEWAY_SA}" --role=roles/run.invoker
          #     --project PROJECT --region REGION
          # plus the same binding for the deploy SA, so the smoke step below can
          # still reach /readyz. Without it the smoke 403s and the candidate is
          # never promoted.
          echo "ingress=--no-allow-unauthenticated" >> "$GITHUB_OUTPUT"

      # TD-262: the app release train this revision ships with, as the Cloud
      # Run label release-train, so a release can name the backend revision it
      # was tested against (`gcloud run revisions list
      # --filter=metadata.labels.release-train=v1-2-0`). The operator may name
      # it; otherwise the newest v* tag reachable from the deployed commit.
      # Label values allow only [a-z0-9_-], at most 63 characters.
      - id: release
        name: Resolve release train
        env:
          TRAIN_INPUT: ${{ github.event.inputs.release_train }}
        run: |
          set -euo pipefail
          raw="$TRAIN_INPUT"
          from="the release_train input"
          if [ -z "$raw" ]; then
            raw=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo untagged)
            from="git describe on $(git rev-parse --short HEAD)"
          fi
          train=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr '.' '-' \
            | tr -c 'a-z0-9_-' '-' | cut -c1-63)
          train=${train:-untagged}
          echo "train=$train" >> "$GITHUB_OUTPUT"
          echo "Release train: $train (from $from)"
          {
            echo "### Release train"
            echo "Label \`release-train=$train\` on the service and the new revision, from $from."
          } >> "$GITHUB_STEP_SUMMARY"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Validate project input
        env:
          PROJECT: ${{ github.event.inputs.project }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          AUTH_PROJECT=$(gcloud config get-value project 2>/dev/null || true)
          if [ -z "$PROJECT" ]; then
            echo "::error::workflow input 'project' is empty"
            exit 1
          fi
          # Operators often paste the Cloud Run service name into "project".
          if [ "$PROJECT" = "$SERVICE" ] || [[ "$PROJECT" == semper-api* ]] || [[ "$PROJECT" == indic-api* ]]; then
            echo "::error::project='$PROJECT' looks like a Cloud Run service name, not a GCP project id. Use the project id (e.g. indicvision-dic-app)."
            exit 1
          fi
          if [ -n "$AUTH_PROJECT" ] && [ "$PROJECT" != "$AUTH_PROJECT" ]; then
            echo "::error::project input '$PROJECT' does not match WIF-authenticated project '$AUTH_PROJECT'."
            exit 1
          fi
          echo "Deploy target project=$PROJECT service=$SERVICE"

      - id: previous
        name: Capture previous serving revision
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          # Distinguish "service does not exist yet" from a wrong project /
          # permission error — the latter must not look like a first deploy.
          set +e
          PREV=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/tmp/describe.err)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -Eiq 'NOT_FOUND|was not found|Cannot find|does not exist' /tmp/describe.err; then
              PREV=""
            else
              cat /tmp/describe.err >&2
              echo "::error::Could not describe $SERVICE in project=$PROJECT region=$REGION (rc=$rc). Check the project id input."
              exit "$rc"
            fi
          fi
          echo "revision=${PREV}" >> "$GITHUB_OUTPUT"
          # Cloud Run rejects --no-traffic on first create of a service.
          if [ -n "$PREV" ]; then
            echo "no_traffic=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_traffic=false" >> "$GITHUB_OUTPUT"
            echo "First deploy of $SERVICE: allowing traffic on create (no_traffic unsupported)."
          fi

      # deploy-cloudrun *merges* env_vars into the live revision's env, so a
      # variable this workflow stopped setting stays on the service forever.
      # MAX_SESSIONS_PER_USER was retired by the licensing rollout
      # (DEMO_MAX_ANALYSES / LICENSED_MAX_SESSIONS_PER_USER replace it), and
      # REQUIRE_ATTESTED_UPLOADS by TD-45 (/uploads is always device-attested
      # now). The code ignores both, but a stale value misleads anyone reading
      # the console. Print the live env and warn — removal is a manual
      # `gcloud run services update --remove-env-vars` after promote, so the
      # previous revision keeps its env for rollback.
      - name: Describe live env
        if: steps.previous.outputs.revision != ''
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(spec.template.spec.containers[0].env)' \
            | tr ';' '\n' | sed -E "s/'value': '[^']*'/'value': <redacted>/" \
            | tee /tmp/live-env.txt
          for stale in MAX_SESSIONS_PER_USER REQUIRE_ATTESTED_UPLOADS; do
            if grep -q "'name': '$stale'" /tmp/live-env.txt; then
              echo "::warning::$stale is still set on $SERVICE. The backend no longer reads it; remove it after promote with: gcloud run services update $SERVICE --project $PROJECT --region $REGION --remove-env-vars $stale"
            fi
          done

      # The entitlement signing key reaches the service as a Secret Manager
      # reference, never a plain env value. It is mounted only when the
      # ENTITLEMENT_SIGNING_SECRET variable names a secret and that secret
      # exists: Cloud Run refuses a revision whose secret is missing, and an
      # environment that has not created the key yet must still deploy (the
      # backend then issues no signed entitlements). Reading the secret's
      # metadata needs roles/secretmanager.viewer for the deploy SA; the
      # runtime SA needs roles/secretmanager.secretAccessor on the secret.
      - id: runtime_secrets
        name: Resolve runtime secrets
        env:
          PROJECT: ${{ github.event.inputs.project }}
          ENTITLEMENT_SECRET: ${{ vars.ENTITLEMENT_SIGNING_SECRET }}
          RUNTIME_SA: ${{ vars.SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          lines="RESEND_API_KEY=resend-api-key:latest"
          if [ -z "$ENTITLEMENT_SECRET" ]; then
            echo "::notice::ENTITLEMENT_SIGNING_SECRET is not set: deploying without ENTITLEMENT_SIGNING_KEY."
          elif gcloud secrets describe "$ENTITLEMENT_SECRET" --project "$PROJECT" --format='value(name)' >/dev/null 2>/tmp/secret-err; then
            # The runtime SA must be able to read it, or the candidate never
            # starts and every deploy stops there (TD-269). Read-only; an
            # unreadable policy is a warning, a missing grant fails here.
            if [ -z "$RUNTIME_SA" ]; then
              echo "::warning::SERVICE_ACCOUNT_EMAIL is not set: not checked whether the runtime SA can read ${ENTITLEMENT_SECRET}."
            elif ! check=$(bash scripts/check_secret_access.sh "$PROJECT" "$ENTITLEMENT_SECRET" "$RUNTIME_SA"); then
              echo "::error::$check"
              exit 1
            else
              echo "$check"
              case "$check" in WARN:*) echo "::warning::$check" ;; esac
            fi
            lines="$lines"$'\n'"ENTITLEMENT_SIGNING_KEY=${ENTITLEMENT_SECRET}:latest"
            echo "Mounting ENTITLEMENT_SIGNING_KEY from secret ${ENTITLEMENT_SECRET}."
          else
            echo "::warning::Secret ${ENTITLEMENT_SECRET} not found or not readable in ${PROJECT} ($(head -c 200 /tmp/secret-err | tr '\n' ' ')). Deploying without ENTITLEMENT_SIGNING_KEY."
          fi
          {
            echo "secrets<<SECRETS_EOF"
            echo "$lines"
            echo "SECRETS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Deploy the candidate WITHOUT shifting live traffic when a prior revision
      # exists. A prior deploy with no_traffic=false still left 100% on the
      # previous revision while smoke ran (new revision Ready+Retired with zero
      # requests), so CI validated the old __readyz__ probe and rolled "back" to
      # itself. Tag + no_traffic makes the smoke target unambiguous; promote only
      # after /readyz passes. First-time creates must omit no_traffic.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          project_id: ${{ github.event.inputs.project }}
          service: ${{ steps.meta.outputs.service }}
          region: ${{ github.event.inputs.region }}
          # Dockerfile in backend/ builds an immutable image per git SHA (Cloud
          # Build tags by digest). Never promote a mutable :latest reference.
          source: backend
          no_traffic: ${{ steps.previous.outputs.no_traffic }}
          tag: cand-${{ github.run_id }}-${{ github.run_attempt }}
          # Merged with the action's own managed-by / commit-sha labels and
          # passed to `gcloud run deploy --update-labels`, which keeps every
          # other label on the service and copies them onto the new revision.
          labels: |-
            release-train=${{ steps.release.outputs.train }}
          # The licensing settings carry expression defaults: an unset repo
          # variable must resolve to the safe value (demo cap 25, MFA on, App
          # Check off — `enforce` would 403 every installed pre-App-Check build),
          # never to an empty string the backend would parse as something else.
          # CONSOLE_ORIGINS and KILL_SWITCHES are space-separated: this block
          # splits pairs on commas, so a comma inside a value truncates it.
          # NOTIFY_SECURITY_FROM unset (empty) keeps the holder's new-device
          # mail off (TD-295, TD-309); set it to a verified Resend sender.
          env_vars: |-
            GOOGLE_CLOUD_PROJECT=${{ github.event.inputs.project }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            SHARED_DRIVE_ID=${{ vars.SHARED_DRIVE_ID }}
            SERVICE_ACCOUNT_EMAIL=${{ vars.SERVICE_ACCOUNT_EMAIL }}
            AUTO_APPROVE_HD=${{ vars.AUTO_APPROVE_HD }}
            ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
            SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
            NOTIFY_FROM=${{ vars.NOTIFY_FROM }}
            NOTIFY_SECURITY_FROM=${{ vars.NOTIFY_SECURITY_FROM }}
            TASKS_QUEUE=${{ vars.TASKS_QUEUE }}
            TASKS_LOCATION=${{ vars.TASKS_LOCATION }}
            TASKS_TARGET_BASE_URL=${{ vars.TASKS_TARGET_BASE_URL }}
            TASKS_INVOKER_SA=${{ vars.TASKS_INVOKER_SA }}
            DEMO_MAX_ANALYSES=${{ vars.DEMO_MAX_ANALYSES || '25' }}
            LICENSED_MAX_SESSIONS_PER_USER=${{ vars.LICENSED_MAX_SESSIONS_PER_USER || '999' }}
            ADMIN_WEB_MFA_ENABLED=${{ vars.ADMIN_WEB_MFA_ENABLED || '1' }}
            APP_CHECK_MODE=${{ vars.APP_CHECK_MODE || 'off' }}
            SELF_DEVICE_CHANGE_COOLDOWN_DAYS=${{ vars.SELF_DEVICE_CHANGE_COOLDOWN_DAYS || '30' }}
            CONSOLE_ORIGINS=${{ vars.CONSOLE_ORIGINS || 'https://app.sempermechanics.com https://indicvision-dic-app-auth.firebaseapp.com' }}
            CHECK_REVOKED_ON_STEP_UP=${{ vars.CHECK_REVOKED_ON_STEP_UP || 'false' }}
            ENTITLEMENT_KID=${{ vars.ENTITLEMENT_KID || 'ent-1' }}
            ENTITLEMENT_OFFLINE_GRACE_DAYS=${{ vars.ENTITLEMENT_OFFLINE_GRACE_DAYS || '14' }}
            MIN_SUPPORTED_VERSION_CODE=${{ vars.MIN_SUPPORTED_VERSION_CODE || '0' }}
            RECOMMENDED_VERSION_CODE=${{ vars.RECOMMENDED_VERSION_CODE || '0' }}
            MIN_SUPPORTED_VERSION_CODE_MATERIAL_TESTING=${{ vars.MIN_SUPPORTED_VERSION_CODE_MATERIAL_TESTING || '0' }}
            RECOMMENDED_VERSION_CODE_MATERIAL_TESTING=${{ vars.RECOMMENDED_VERSION_CODE_MATERIAL_TESTING || '0' }}
            KILL_SWITCHES=${{ vars.KILL_SWITCHES }}
          # RESEND_API_KEY always; ENTITLEMENT_SIGNING_KEY when its secret exists
          # (runtime_secrets above).
          secrets: ${{ steps.runtime_secrets.outputs.secrets }}
          flags: >-
            ${{ steps.meta.outputs.ingress }} --cpu=1 --memory=512Mi
            --min-instances=${{ vars.MIN_INSTANCES || '0' }}
            --max-instances=10 --concurrency=40 --timeout=300
            --service-account=${{ vars.SERVICE_ACCOUNT_EMAIL }}
            --revision-suffix=${{ github.run_id }}-${{ github.run_attempt }}

      # Cloud Run requires aud = the *service* URL even when calling a traffic
      # tag (docs: authenticating/service-to-service). Minting against the tag
      # URL yields HTML 401 before the container runs.
      - id: service_url
        name: Resolve service URL (ID token audience)
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - id: smoke_token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.service_url.outputs.url }}

      - name: Post-deploy smoke (/readyz on candidate)
        id: smoke
        env:
          # Tag URL from deploy (cand-…---semper-api-….run.app); aud is service URL.
          URL: ${{ steps.deploy.outputs.url }}
          ID_TOKEN: ${{ steps.smoke_token.outputs.id_token }}
        run: |
          set -euo pipefail
          echo "Smoking candidate ${URL}/readyz"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' --max-time 15 \
              -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/readyz" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "readyz ok"
              cat /tmp/readyz.json
              exit 0
            fi
            echo "readyz attempt $i → HTTP $CODE"
            sleep 5
          done
          echo "Smoke failed"
          cat /tmp/readyz.json || true
          exit 1

      # Only reached when smoke passed — live traffic stays on PREV until here.
      # The candidate is the newest revision (the concurrency group serialises
      # deploys), so --to-latest serves it and a later `gcloud run services
      # update` goes live without a manual update-traffic. The next deploy's
      # no_traffic pins LATEST to the then-serving revision by name, as before.
      # Every cand-* tag goes in the same call: a tag exists only for the smoke
      # above, and a stale one keeps its revision addressable.
      - id: promote
        name: Promote candidate to 100% traffic
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
          REV: ${{ steps.meta.outputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          DESC=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --format=json)
          LATEST=$(jq -r '.status.latestReadyRevisionName' <<<"$DESC")
          if [ "$LATEST" != "$REV" ]; then
            echo "Latest ready revision is ${LATEST}, not ${REV}; refusing to promote"
            exit 1
          fi
          TAGS=$(jq -r '[.spec.traffic[]?.tag // empty | select(startswith("cand-"))] | unique | join(",")' <<<"$DESC")
          echo "Routing 100% traffic to ${REV} (latest); dropping tags: ${TAGS:-none}"
          gcloud run services update-traffic "$SERVICE" --to-latest \
            ${TAGS:+--remove-tags="$TAGS"} \
            --project "$PROJECT" --region "$REGION"

      # Deliberately AFTER the smoke + promote gate.
      # A missing release-train label only warns: this runs after the promote,
      # and a failure here would roll back a healthy revision.
      - name: Record immutable image digest
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
          REV: ${{ steps.meta.outputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          TRAIN: ${{ steps.release.outputs.train }}
        run: |
          set -euo pipefail
          DESC=$(gcloud run revisions describe "$REV" \
            --project "$PROJECT" --region "$REGION" --format=json)
          IMG=$(jq -r '.status.imageDigest // empty' <<<"$DESC")
          LABEL=$(jq -r '.metadata.labels["release-train"] // empty' <<<"$DESC")
          echo "Deployed revision=${REV} imageDigest=${IMG} release-train=${LABEL:-<none>}"
          if [ "$LABEL" != "$TRAIN" ]; then
            echo "::warning::Revision ${REV} carries release-train='${LABEL}', expected '${TRAIN}'. Set it by hand: gcloud run services update ${SERVICE} --project ${PROJECT} --region ${REGION} --update-labels release-train=${TRAIN}"
          fi
          echo "Revision \`${REV}\` serving; release train \`${LABEL:-none}\`; image \`${IMG}\`." >> "$GITHUB_STEP_SUMMARY"

      # Pin the images by digest for the registry cleanup policy
      # (backend/deploy/ar-cleanup-policy.json). A source deploy tags every image
      # it builds `latest` before the smoke, so `latest` names the newest build,
      # not the one serving: after a failed smoke, PREV served an image no tag
      # kept. `serving` moves to the image now taking traffic and
      # `rollback-prev` to the one it replaced; `tags add` moves a tag that
      # exists. A failed smoke never gets here, so `serving` stays on PREV.
      # Last in the job, rollback-prev first, so no failure after it can leave
      # PREV unpinned. continue-on-error: re-pinning by hand
      # (BACKEND_SETUP_GCP.md A7) beats rolling back a healthy revision.
      # One-time IAM: moving a tag that exists needs artifactregistry.tags.delete,
      # which roles/artifactregistry.writer lacks; the deploy SA holds
      # roles/artifactregistry.repoAdmin on cloud-run-source-deploy only.
      - name: Pin the serving and rollback images
        continue-on-error: true
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          REV: ${{ steps.meta.outputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREV: ${{ steps.previous.outputs.revision }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Image pin failed; re-pin serving/rollback-prev by hand (BACKEND_SETUP_GCP.md A7)"' ERR
          digest() {  # digest <revision>: image@sha256:…, or fail
            local img
            img=$(gcloud run revisions describe "$1" --project "$PROJECT" --region "$REGION" \
              --format='value(status.imageDigest)')
            [[ "$img" == *@sha256:* ]] || { echo "No image digest for $1" >&2; return 1; }
            echo "$img"
          }
          pin() {  # pin <image@sha256:digest> <tag>
            gcloud artifacts docker tags add "$1" "${1%@*}:$2" --quiet
            echo "Pinned $2 -> $1"
          }
          # Both digests before any tag, so a failed lookup tags nothing.
          OLD=""
          if [ -n "$PREV" ] && [ "$PREV" != "$REV" ]; then
            OLD=$(digest "$PREV")
          fi
          NEW=$(digest "$REV")
          if [ -n "$OLD" ]; then
            pin "$OLD" rollback-prev
          fi
          pin "$NEW" serving

      # Revert only if we already moved live traffic (promote succeeded) and a
      # later step failed. A failed smoke leaves PREV serving — nothing to undo.
      - name: Rollback traffic on post-promote failure
        if: failure() && steps.promote.outcome == 'success' && steps.previous.outputs.revision != ''
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          SERVICE: ${{ steps.meta.outputs.service }}
          PREV: ${{ steps.previous.outputs.revision }}
        run: |
          set -euo pipefail
          echo "Routing 100% traffic back to ${PREV}"
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions="${PREV}=100" \
            --project "$PROJECT" --region "$REGION"

  # API Gateway after the promote (ADR-006). A config that names a route the
  # backend does not serve yet would 5xx, so this runs only once `deploy` has
  # promoted the revision that serves it. Both environments: staging has its
  # own gateway (`semper-gw-staging` on API `semper-api-staging`), which went
  # three days without new routes while this job was production-only.
  # `dry-run` (the default) renders the spec and prints its diff against the
  # live config; only `apply` creates a config and switches.
  #
  # One-time IAM for the deploy SA: roles/apigateway.admin on the project and
  # roles/iam.serviceAccountUser on the gateway SA (vars.GATEWAY_SA, default
  # indic-gw@PROJECT). Both environments use the repo-level deploy SA.
  gateway:
    needs: deploy
    # The same ref rule as `deploy`: production from main only.
    if: github.event.inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment }}
    env:
      PROJECT: ${{ github.event.inputs.project }}
      REGION: ${{ github.event.inputs.region }}
      SERVICE: ${{ needs.deploy.outputs.service }}
      MODE: ${{ github.event.inputs.gateway_mode }}
      # An environment-scoped var overrides these; the defaults are the live names.
      GW_ID: ${{ vars.GATEWAY_ID || (github.event.inputs.environment == 'production' && 'semper-gw' || 'semper-gw-staging') }}
      GW_API: ${{ vars.GATEWAY_API || (github.event.inputs.environment == 'production' && 'semper-api' || 'semper-api-staging') }}
      GW_REGION: ${{ vars.GATEWAY_REGION || 'asia-northeast1' }}
      GW_SA_VAR: ${{ vars.GATEWAY_SA }}
      # The Firebase Auth project, which is not the GCP project. Empty would
      # render the issuer https://securetoken.google.com/ and reject every token.
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      # First entry of the allowlist the promoted revision was deployed with.
      CORS_ORIGIN_LIST: ${{ vars.CONSOLE_ORIGINS || 'https://app.sempermechanics.com' }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - id: render
        name: Render the spec and diff it against the live config
        run: |
          set -euo pipefail
          RUN_URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          MANAGED_SERVICE=$(gcloud api-gateway apis describe "$GW_API" \
            --project "$PROJECT" --format='value(managedService)')
          for v in RUN_URL FIREBASE_PROJECT_ID MANAGED_SERVICE; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty"; exit 1; fi
          done

          OUT=backend/gateway/openapi.generated.yaml
          sed -e "s|__CLOUD_RUN_URL__|$RUN_URL|g" \
              -e "s|__FIREBASE_PROJECT_ID__|$FIREBASE_PROJECT_ID|g" \
              -e "s|__MANAGED_SERVICE__|$MANAGED_SERVICE|g" \
            backend/gateway/openapi.yaml > "$OUT"
          # if/then, not `grep && exit 1`: that form exits 1 when nothing is left.
          if grep -v '^[[:space:]]*#' "$OUT" | grep -qE '__[A-Z_]+__'; then
            echo "::error::unsubstituted placeholder remains in $OUT"
            exit 1
          fi

          PREV_CFG=$(gcloud api-gateway gateways describe "$GW_ID" \
            --project "$PROJECT" --location "$GW_REGION" \
            --format='value(apiConfig)' | sed 's|.*/||')
          if [ -z "$PREV_CFG" ]; then echo "::error::gateway $GW_ID has no live config"; exit 1; fi
          echo "prev=$PREV_CFG" >> "$GITHUB_OUTPUT"
          echo "Live config: $PREV_CFG (the rollback target)"

          gcloud api-gateway api-configs describe "$PREV_CFG" --api="$GW_API" \
            --project "$PROJECT" --view=FULL --format=json > /tmp/live-config.json
          # The document's bytes come back base64 in the JSON, and GNU
          # `base64 -d` rejects the URL-safe or unpadded form (run 35990981043).
          # Accept either alphabet and missing padding; a body that is not
          # base64 at all is taken as the spec text itself.
          python3 - /tmp/live-config.json /tmp/live-spec.yaml <<'PY'
          import base64, binascii, json, sys
          doc = json.load(open(sys.argv[1]))["openapiDocuments"][0]["document"]
          raw = doc.get("contents") or ""
          s = "".join(raw.split()).replace("-", "+").replace("_", "/")
          try:
              body = base64.b64decode(s + "=" * (-len(s) % 4), validate=True)
          except (binascii.Error, ValueError):
              body = raw.encode()
          open(sys.argv[2], "wb").write(body)
          print(f"Live document {doc.get('path', '?')}: {len(raw)} chars, {len(body)} bytes")
          PY
          if cmp -s /tmp/live-spec.yaml "$OUT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The live config already serves this spec; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Gateway spec diff (live $PREV_CFG → this commit)"
              echo '```diff'
              diff -u /tmp/live-spec.yaml "$OUT" || true
              echo '```'
              echo "Mode: \`$MODE\`."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - id: switch
        name: Create a config and switch the gateway to it
        if: steps.render.outputs.changed == 'true' && env.MODE == 'apply'
        run: |
          set -euo pipefail
          GW_SA="${GW_SA_VAR:-indic-gw@${PROJECT}.iam.gserviceaccount.com}"
          # Minute plus run number: a second deploy the same day cannot collide.
          NEW_CFG="v$(date -u +%Y%m%d%H%M)-${GITHUB_RUN_NUMBER}"
          gcloud api-gateway api-configs create "$NEW_CFG" --api="$GW_API" \
            --project "$PROJECT" \
            --openapi-spec=backend/gateway/openapi.generated.yaml \
            --backend-auth-service-account="$GW_SA"
          gcloud api-gateway gateways update "$GW_ID" --api="$GW_API" \
            --api-config="$NEW_CFG" --project "$PROJECT" --location="$GW_REGION"
          echo "new=$NEW_CFG" >> "$GITHUB_OUTPUT"

      # Route known but unauthenticated → 401 (404 = the route is missing from
      # the config). The consoles' preflight → 200 with the allowed origin.
      - name: Verify the gateway from outside
        if: steps.switch.outcome == 'success'
        run: |
          set -euo pipefail
          HOST=$(gcloud api-gateway gateways describe "$GW_ID" \
            --project "$PROJECT" --location "$GW_REGION" --format='value(defaultHostname)')
          ORIGIN="${CORS_ORIGIN_LIST%% *}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$HOST/v1/config")
          echo "GET /v1/config → $CODE"
          if [ "$CODE" != "401" ]; then echo "::error::expected 401 from /v1/config"; exit 1; fi
          curl -si --max-time 20 -X OPTIONS "https://$HOST/v1/me" \
            -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' > /tmp/preflight.txt
          head -1 /tmp/preflight.txt
          if ! head -1 /tmp/preflight.txt | grep -q ' 200'; then
            echo "::error::preflight did not answer 200"; exit 1
          fi
          if ! grep -qi "^access-control-allow-origin: $ORIGIN" /tmp/preflight.txt; then
            echo "::error::preflight lacks access-control-allow-origin: $ORIGIN"; exit 1
          fi

      - name: Roll the gateway back
        if: failure() && steps.switch.outcome == 'success'
        env:
          PREV_CFG: ${{ steps.render.outputs.prev }}
        run: |
          set -euo pipefail
          echo "Switching $GW_ID back to $PREV_CFG"
          gcloud api-gateway gateways update "$GW_ID" --api="$GW_API" \
            --api-config="$PREV_CFG" --project "$PROJECT" --location="$GW_REGION"
