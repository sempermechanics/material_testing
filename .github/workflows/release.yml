name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0-beta.2)'
        required: true
      changelog:
        description: 'Release notes (markdown)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

concurrency:
  group: release
  cancel-in-progress: false

# The engine's Eigen submodule points at gitlab.com, which has refused clones
# under load (2026-10-26). Every git command in every job, including
# actions/checkout's submodule clones, fetches it from the GitHub mirror instead.
# The gitlink pins the commit (Eigen 5.0.1, bc3b3987 at engine f072da0), so
# the source is identical; a mirror without that commit fails the checkout.
# checkout-submodules caches Eigen's git directory by that pin, so a run that
# restores it fetches Eigen from neither.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://github.com/eigen-mirror/eigen.git.insteadOf
  GIT_CONFIG_VALUE_0: https://gitlab.com/libeigen/eigen.git

jobs:
  # Green CI was previously only a manual checklist item in RELEASING.md, so a
  # red suite could still be signed and published. These three jobs and
  # verify-ci below are the gate and run in parallel; the three are the same
  # checks as the old sequential `verify` job.
  # Releases only ship from main — refuse other refs.
  verify-legal:
    name: Verify legal pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Legal pages match their source
        run: python scripts/render_legal_pages.py --check

  verify-android:
    name: Verify Android unit tests and quality gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        # JVM unit tests do not loadLibrary — skip the OpenCV/engine tree.

      - uses: ./.github/actions/setup-android-build

      # Tier 1's checks, not just its tests: a release must not sign what CI
      # would have stopped (TD-43). compileReleaseKotlin is left to
      # build-release, whose R8 build compiles it anyway.
      - name: Android unit tests and quality gates
        run: >
          ./gradlew --continue --console=plain
          :app:testDebugUnitTest
          spotlessCheck
          :app:detekt
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          :benchmark:compileBenchmarkKotlin

      - name: Kotlin coverage floor
        run: ./gradlew --console=plain :app:koverVerify

  verify-backend:
    name: Verify backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/backend-gate

  # The version input names the tag the release is published under, and the
  # build is github.sha (main's head at dispatch). Refuse a malformed version,
  # and a tag that already exists on another commit; a new tag is created at
  # github.sha by publish (target_commitish) (TE6-008).
  verify-tag:
    name: Verify the version tag names this commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags

      - name: Version format and tag commit
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: python3 scripts/check_release_tag.py --version "$VERSION" --sha "$GITHUB_SHA"

  # The three jobs above re-run part of CI; the rest of it (secret scan,
  # console pages, the emulator tier, the Firestore rules, the signed-release
  # tier) was a checklist line in RELEASING.md. This requires every CI job's
  # latest check run on this commit to have passed, not been skipped, so the
  # commit needs a full-matrix CI run first (dispatch CI with full_ci, or its
  # weekly run) (TE6-009).
  verify-ci:
    name: Verify full-matrix CI passed on this commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Full-matrix CI OK on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            > "$RUNNER_TEMP/check-runs.json"
          python3 scripts/check_release_ci.py --runs "$RUNNER_TEMP/check-runs.json" --sha "$GITHUB_SHA"

  build-release:
    name: Build signed release
    if: github.ref == 'refs/heads/main'
    needs: [verify-legal, verify-android, verify-backend, verify-tag, verify-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      actions: write   # prune-cache
    steps:
      - uses: actions/checkout@v7

      # Submodules after checkout: Eigen from cache, every fetch retried.
      - uses: ./.github/actions/checkout-submodules

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: arm64

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Resolve version name
        run: echo "VERSION_NAME=${VERSION#v}" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ github.event.inputs.version }}

      # The APK (GitHub Release, sideload) and the AAB (Play upload, by hand)
      # come from one Gradle run, so they share one R8 pass and one mapping.
      - name: Build signed release APK and bundle
        env:
          SIGNING_KEYSTORE: app/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          # Fail the release if cloud is silently disabled — must be the API
          # Gateway (or Cloud Run) HTTPS URL for the target environment.
          # INDIC_API_BASE_URL is the var's name before the rename; drop it once
          # SEMPER_API_BASE_URL is set in every environment.
          SEMPER_API_BASE_URL: ${{ vars.SEMPER_API_BASE_URL || vars.INDIC_API_BASE_URL }}
          # CertificatePinner pins for the API host (comma-separated sha256/...=).
          # Empty means system trust only; check_release_apk.py warns on it.
          SEMPER_API_CERT_PINS: ${{ secrets.SEMPER_API_CERT_PINS }}
          # Public keys the app verifies signed entitlements with (public, so a var).
          SEMPER_ENTITLEMENT_PUBKEYS: ${{ vars.SEMPER_ENTITLEMENT_PUBKEYS }}
          # Releases sit above every CI run number ever used as a versionCode
          # (main's CI reached 671 before it switched to a fixed 1), so a phone
          # holding an old CI APK takes the next release as an update.
          # run_number counts this workflow's runs and is monotonic only while
          # the workflow keeps its identity: renaming or re-creating release.yml
          # restarts it at 1, and the next versionCode would then be lower than
          # an installed one. Raise RELEASE_CODE_BASE past the last release's
          # versionCode in the same change (TE6-008).
          RELEASE_CODE_BASE: 1000
        run: |
          if [ -z "${SEMPER_API_BASE_URL}" ]; then
            echo "SEMPER_API_BASE_URL is not set in the release environment vars."
            echo "Set it to the API Gateway URL before shipping."
            exit 1
          fi
          ./gradlew --console=plain \
            :app:assembleRelease \
            :app:bundleRelease \
            -PabiFilters=arm64-v8a \
            -PnativeCompilerLauncher=ccache \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="$((RELEASE_CODE_BASE + ${{ github.run_number }}))" \
            -PrequireCloudApi=true \
            -PuploadCrashlyticsMapping=true

      - uses: ./.github/actions/check-arm64-so

      # The whole point of the signing inputs above: prove the APK is actually
      # signed with the release key. Fails the release if signing did not happen.
      - name: Verify release signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" \
            || { echo "APK is NOT validly signed"; exit 1; }
          # Newer build-tools print "V2 Signer: certificate SHA-256 digest:";
          # older ones used "Signer #1 certificate SHA-256 digest:".
          echo "Release APK is signed:"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -iE "(Signer #1|V[0-9]+ Signer):? ?certificate SHA-256"

      # What the release build type promises, read back from the APK itself:
      # not debuggable or testOnly, no debug source-set component, no App Check
      # debug provider, no cleartext, minSdk as app/build.gradle.kts says, the
      # consent defaults (collection off, no AD_ID permission), an R8 mapping
      # that renames app classes (readiness A1.5; MASWE-0067 / MASWE-0089).
      # Warns, without failing, when no certificate pin was compiled in.
      # Entitlement keys (TE4-001): a warning while TD-215 is open. Once the
      # signing key is live SEMPER_ENTITLEMENT_PUBKEYS is set, and from then a
      # release that compiled none fails here; SEMPER_REQUIRE_ENTITLEMENT_PINS
      # =true keeps that on should the pubkeys variable be cleared by mistake
      # (RELEASING.md, step 5). Both are unset today: no release fails on it.
      # Signing key (TE1-007): the signer must be the release certificate every
      # Semper release so far carries (runs 31565590316 to 39064532280, last
      # v1.2-beta.4 = versionCode 1036), or the APK would not install over
      # theirs. SEMPER_RELEASE_CERT_SHA256 overrides it (a deliberate rotation,
      # with a v3 lineage); a fork, which signs with its own key, has no
      # default and gets a warning until it sets the variable.
      - name: Inspect release APK hardening
        env:
          REQUIRE_ENTITLEMENT_PINS: ${{ (vars.SEMPER_ENTITLEMENT_PUBKEYS != '' || vars.SEMPER_REQUIRE_ENTITLEMENT_PINS == 'true') && 'true' || '' }}
          EXPECTED_SIGNER: ${{ vars.SEMPER_RELEASE_CERT_SHA256 || (github.repository == 'sempermechanics/semperdic-app' && 'ff72a8b08f02a05d65b53d91250bef7e3b0ff7538af2b0168ee52d5f36b15c9a' || '') }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIGNER=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -iE "(Signer #1|V[0-9]+ Signer):? ?certificate SHA-256 digest:" \
            | head -1 | awk '{print $NF}')
          python3 scripts/check_release_apk.py "$APK" \
            --aapt2 "$BUILD_TOOLS/aapt2" \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --signer-sha256 "$SIGNER" \
            ${EXPECTED_SIGNER:+--expected-signer-sha256 "$EXPECTED_SIGNER"} \
            ${REQUIRE_ENTITLEMENT_PINS:+--require-entitlement-pins}

      # An AAB is a signed JAR, not an APK: apksigner does not read it.
      - name: Verify release bundle signature
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner.txt" \
            || { echo "::error::Release bundle is NOT validly signed"; exit 1; }

      # google-services publishes default_web_client_id from oauth client_type 3.
      # AuthActivity hides Google SSO when that string is missing. Resource
      # shrinking strips getIdentifier-only lookups — catch a regression here.
      - name: Verify Google SSO web client id survives resource shrinking
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if ! unzip -p "$APK" resources.arsc | grep -a -q 'default_web_client_id'; then
            echo "::error::default_web_client_id missing from release APK resources."
            echo "Resource shrinking likely stripped it. Keep a static R.string reference"
            echo "or tools:keep=@string/default_web_client_id (see GoogleSignInHelper)."
            exit 1
          fi
          WEB_ID=$(python3 -c "import json; c=json.load(open('app/google-services.json'))['client'][0]['oauth_client']; print(next(x['client_id'] for x in c if x['client_type']==3))")
          if ! unzip -p "$APK" resources.arsc | grep -a -qF "$WEB_ID"; then
            echo "::error::Web client id $WEB_ID not present in release resources.arsc"
            exit 1
          fi
          echo "Google SSO default_web_client_id present in release APK."

      # App Links only verify if the RELEASE signing certificate is listed in the
      # hosted assetlinks.json. When it is not, email sign-in and reset links stop
      # opening the app and silently fall back to a browser disambiguation dialog
      # — which is phishable and looks like an app bug. Catch it at release time
      # instead of in the field.
      - name: Verify assetlinks lists the release signing certificate
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          DIGEST=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -iE "(Signer #1|V[0-9]+ Signer):? ?certificate SHA-256 digest:" \
            | head -1 \
            | awk '{print $NF}')
          # apksigner prints bare lowercase hex; assetlinks uses colon-separated
          # uppercase.
          FP=$(echo "$DIGEST" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          echo "Release certificate fingerprint: $FP"
          if ! grep -qF "$FP" firebase-hosting/public/.well-known/assetlinks.json; then
            echo "::error::Release signing certificate $FP is not in assetlinks.json."
            echo "Add it to firebase-hosting/public/.well-known/assetlinks.json and redeploy Hosting."
            exit 1
          fi
          echo "assetlinks.json lists the release certificate."

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # For a Play Console upload by hand; nothing here uploads to Play.
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # R8 obfuscates release builds, so a field stack trace is unreadable without
      # the mapping for the exact build that produced it. It cannot be regenerated
      # afterwards — if this file is lost, those crashes stay unreadable forever.
      # Deliberately NOT attached to the GitHub release: it is the deobfuscation
      # key, and publishing it would undo the obfuscation for everyone. The
      # durable copy is Crashlytics (-PuploadCrashlyticsMapping=true above,
      # TD-40); this artifact is the 90-day fallback for a manual retrace.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping-${{ github.event.inputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      # Same prefix as CI tier 5 so a Kotlin-only release reuses the last native
      # compile instead of uploading a new SHA-keyed blob.
      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-arm64-
          except-key: cxx-arm64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-arm64-
          except-key: ccache-arm64-${{ steps.native-ci.outputs.cache-infix }}

  publish:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: release-apk/

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-aab
          path: release-aab/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version }}
          # A tag that does not exist yet is created at the built commit, not
          # at the default branch's tip when this step runs (verify-tag
          # refused one already on another commit).
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          prerelease: ${{ github.event.inputs.channel == 'beta' }}
          files: |
            release-apk/*.apk
            release-aab/*.aab
