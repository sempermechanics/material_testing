name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0-beta.2)'
        required: true
      changelog:
        description: 'Release notes (markdown)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Green CI was previously only a manual checklist item in RELEASING.md, so a
  # red suite could still be signed and published. These three jobs are the
  # gate and run in parallel — same checks as the old sequential `verify` job.
  # Releases only ship from main — refuse other refs.
  verify-legal:
    name: Verify legal pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Legal pages match their source
        run: python scripts/render_legal_pages.py --check

  verify-android:
    name: Verify Android unit tests and quality gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        # JVM unit tests do not loadLibrary — skip the OpenCV/engine tree.

      - uses: ./.github/actions/setup-android-build

      # Tier 1's checks, not just its tests: a release must not sign what CI
      # would have stopped (TD-43).
      - name: Android unit tests and quality gates
        run: >
          ./gradlew --continue --console=plain
          :app:testDebugUnitTest
          spotlessCheck
          :app:detekt
          :app:lintDebug

  verify-backend:
    name: Verify backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/backend-gate

  build-release:
    name: Build signed release
    if: github.ref == 'refs/heads/main'
    needs: [verify-legal, verify-android, verify-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      actions: write   # prune-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          validate-wrappers: false

      - uses: ./.github/actions/setup-native-ci
        id: native-ci
        with:
          abi: arm64

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Resolve version name
        run: echo "VERSION_NAME=${VERSION#v}" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE: app/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          # Fail the release if cloud is silently disabled — must be the API
          # Gateway (or Cloud Run) HTTPS URL for the target environment.
          INDIC_API_BASE_URL: ${{ vars.INDIC_API_BASE_URL }}
        run: |
          if [ -z "${INDIC_API_BASE_URL}" ]; then
            echo "INDIC_API_BASE_URL is not set in the release environment vars."
            echo "Set it to the API Gateway URL before shipping."
            exit 1
          fi
          ./gradlew --console=plain \
            :app:assembleRelease \
            -PabiFilters=arm64-v8a \
            -PnativeCompilerLauncher=ccache \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${{ github.run_number }}" \
            -PrequireCloudApi=true \
            -PuploadCrashlyticsMapping=true

      - uses: ./.github/actions/check-arm64-so

      # The whole point of the signing inputs above: prove the APK is actually
      # signed with the release key. Fails the release if signing did not happen.
      - name: Verify release signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" \
            || { echo "APK is NOT validly signed"; exit 1; }
          # Newer build-tools print "V2 Signer: certificate SHA-256 digest:";
          # older ones used "Signer #1 certificate SHA-256 digest:".
          echo "Release APK is signed:"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -iE "(Signer #1|V[0-9]+ Signer):? ?certificate SHA-256"

      # google-services publishes default_web_client_id from oauth client_type 3.
      # AuthActivity hides Google SSO when that string is missing. Resource
      # shrinking strips getIdentifier-only lookups — catch a regression here.
      - name: Verify Google SSO web client id survives resource shrinking
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if ! unzip -p "$APK" resources.arsc | grep -a -q 'default_web_client_id'; then
            echo "::error::default_web_client_id missing from release APK resources."
            echo "Resource shrinking likely stripped it. Keep a static R.string reference"
            echo "or tools:keep=@string/default_web_client_id (see GoogleSignInHelper)."
            exit 1
          fi
          WEB_ID=$(python3 -c "import json; c=json.load(open('app/google-services.json'))['client'][0]['oauth_client']; print(next(x['client_id'] for x in c if x['client_type']==3))")
          if ! unzip -p "$APK" resources.arsc | grep -a -qF "$WEB_ID"; then
            echo "::error::Web client id $WEB_ID not present in release resources.arsc"
            exit 1
          fi
          echo "Google SSO default_web_client_id present in release APK."

      # App Links only verify if the RELEASE signing certificate is listed in the
      # hosted assetlinks.json. When it is not, email sign-in and reset links stop
      # opening the app and silently fall back to a browser disambiguation dialog
      # — which is phishable and looks like an app bug. Catch it at release time
      # instead of in the field.
      - name: Verify assetlinks lists the release signing certificate
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          DIGEST=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -iE "(Signer #1|V[0-9]+ Signer):? ?certificate SHA-256 digest:" \
            | head -1 \
            | awk '{print $NF}')
          # apksigner prints bare lowercase hex; assetlinks uses colon-separated
          # uppercase.
          FP=$(echo "$DIGEST" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          echo "Release certificate fingerprint: $FP"
          if ! grep -qF "$FP" firebase-hosting/public/.well-known/assetlinks.json; then
            echo "::error::Release signing certificate $FP is not in assetlinks.json."
            echo "Add it to firebase-hosting/public/.well-known/assetlinks.json and redeploy Hosting."
            exit 1
          fi
          echo "assetlinks.json lists the release certificate."

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # R8 obfuscates release builds, so a field stack trace is unreadable without
      # the mapping for the exact build that produced it. It cannot be regenerated
      # afterwards — if this file is lost, those crashes stay unreadable forever.
      # Deliberately NOT attached to the GitHub release: it is the deobfuscation
      # key, and publishing it would undo the obfuscation for everyone. The
      # durable copy is Crashlytics (-PuploadCrashlyticsMapping=true above,
      # TD-40); this artifact is the 90-day fallback for a manual retrace.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping-${{ github.event.inputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      # Same prefix as CI tier 5 so a Kotlin-only release reuses the last native
      # compile instead of uploading a new SHA-keyed blob.
      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: cxx-arm64-
          except-key: cxx-arm64-${{ steps.native-ci.outputs.cache-infix }}

      - uses: ./.github/actions/prune-cache
        with:
          key-prefix: ccache-arm64-
          except-key: ccache-arm64-${{ steps.native-ci.outputs.cache-infix }}

  publish:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-release
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: release-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          prerelease: ${{ github.event.inputs.channel == 'beta' }}
          files: release-apk/*.apk
