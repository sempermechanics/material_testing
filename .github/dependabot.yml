version: 2
updates:
  # Backend Python deps (pinned in backend/requirements*.txt).
  - package-ecosystem: pip
    directory: /backend
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      backend-deps:
        patterns:
          - "*"

  # Android / Gradle deps (version catalog + app module).
  - package-ecosystem: gradle
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle-deps:
        patterns:
          - "*"

  # The workflows' actions (checkout, setup-*, upload/download-artifact, …).
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-deps:
        patterns:
          - "*"
