version: 2
updates:
  # Backend Python deps (pinned in backend/requirements*.txt).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Android / Gradle deps (version catalog + app module).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The workflows' actions (checkout, setup-*, upload/download-artifact, …).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
