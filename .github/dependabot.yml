version: 2
updates:
  # Backend Python deps (pinned in backend/requirements*.txt).
  #
  # Dependabot bumps requirements.txt only. It cannot regenerate the hashed
  # requirements.lock the deploy image installs, so every backend PR here lands
  # the two files out of step and CI tier 4 fails on the version diff. Fix it by
  # running the "Backend lock" workflow against the Dependabot branch, which
  # compiles on Linux / Python 3.12 and pushes the lock to that PR.
  # See .github/workflows/backend-lock.yml and docs/ops/RELEASING.md.
  - package-ecosystem: pip
    directory: /backend
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      backend-deps:
        patterns:
          - "*"

  # Android / Gradle deps (version catalog + app module).
  - package-ecosystem: gradle
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle-deps:
        patterns:
          - "*"

  # The workflows' actions (checkout, setup-*, upload/download-artifact, …),
  # and the composite actions under .github/actions/, which `directory: /`
  # alone never scans.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-deps:
        patterns:
          - "*"

  # The backend image's base (python:3.12-slim, pinned by digest), so OS
  # security fixes arrive as a PR instead of only when someone re-pins by hand.
  - package-ecosystem: docker
    directory: /backend
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  # Deliberately no gitsubmodule entry: moving the `native` engine pin changes
  # the bit-exact .dat / GIF oracles, so it is a reviewed step under
  # docs/engine/ENGINE_APP_CONTRACT.md, not a monthly bot bump.
