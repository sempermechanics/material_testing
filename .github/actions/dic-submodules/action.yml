name: Fetch DIC engine submodules
description: >
  Shallow-checkout only the submodules the host test build needs — Eigen and
  OpenCV's header-only universal-intrinsics — and fall back to a full clone if
  the shallow fetch is rejected. Used by the host-side (non-NDK) jobs; the
  NDK/emulator jobs need the whole OpenCV tree and use `submodules: recursive`
  on checkout instead.

runs:
  using: composite
  steps:
    - name: Fetch Eigen + OpenCV headers (shallow)
      shell: bash
      run: |
        git submodule update --init --depth 1 \
          native/third_party/eigen \
          native/third_party/opencv \
        || git submodule update --init \
          native/third_party/eigen \
          native/third_party/opencv
