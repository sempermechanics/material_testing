name: Fetch DIC engine submodules
description: >
  Init the pinned semper-dic-engine submodule at native/, then its nested
  Eigen/OpenCV third_party checkouts. Host engine tests now run in
  semperdic/semper-dic-engine; this action remains for any app job that
  needs the engine tree without a full recursive checkout.

runs:
  using: composite
  steps:
    - name: Fetch engine + Eigen/OpenCV (shallow)
      shell: bash
      run: |
        set -euo pipefail
        git submodule update --init --depth 1 native \
          || git submodule update --init native
        git -C native submodule update --init --depth 1 \
          third_party/eigen third_party/opencv \
          || git -C native submodule update --init \
            third_party/eigen third_party/opencv
