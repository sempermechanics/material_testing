- id: MT-TE2-001
  axis: technical
  gate: G1
  title: 'Fork sync merge #144 silently downgraded the engine from v0.6.1 (f072da0) to v0.2.3 (1284edf); M''s main crashes
    on an incremental run and solves with a 3-minor-versions-old engine'
  type: defect
  severity: P0
  criterion: 'TE-2 compare: ''M''s engine pin differs from S''s; check what version M ships and whether its oracles match''.
    P0 = wrong measurement output; crash in a core flow (analysis).'
  evidence:
  - 'M a4a6350e (merge of semperdic 968637cb, 2026-10-22): BOTH parents pin f072da0 (1cc1084d = M #143 ''pin engine v0.6.1'';
    968637cb), the merge result pins 1284edf: `git diff a4a6350e^1 a4a6350e -- engine` = -f072da03 +1284edf7'
  - 'M 839d4285 (HEAD, #144) tree: engine 1284edf; engine/CMakeLists.txt:4 at 1284edf = `project(semper VERSION 0.2.3 ...)`;
    1284edf carries no tag (f072da0 = v0.6.1)'
  - M app/src/main/java/com/sempermechanics/semper/SemperNativeLib.kt:83,105,114 declare initializeIncremental / computeIncrementalFrame
    / releaseIncremental; 1284edf adapters/android/jni/SemperJNI.cpp exports none of them (only computeFullFieldDirect, getImageDimensions,
    getPreviewFromBytes, initializeReference, setCancelRequested, setDebugOutputDir) -> UnsatisfiedLinkError
  - M app/src/main/java/com/sempermechanics/semper/ui/analysis/run/BatchAnalysis.kt:170-171,262-263 call them whenever spec.incremental
  - 'M CONTEXT.md:44,145 still say engine 0.6.0/0.6.1 (AKAZE+RANSAC anchor lattice); 0.2.3 predates the anchor lattice (0.3.0),
    incremental reference (0.4.0), AKAZE homography (0.6.0) and the 0.6.1 seeding fix (engine/CHANGELOG.md 0.6.1: deflection
    up to 1.5% low on PMMA under 0.6.0)'
  - 'Not caught by tests: no androidTest calls the incremental JNI (grep in M app/src/androidTest = 0); M''s JVM real-data
    tests use arrays recorded on an old engine and ''stay green either way'' (M docs/ops/FORK_SYNC.md:39-41); .dat/GIF oracles
    do not involve the engine (identical sha256 in S and M)'
  - 'M''s last release v1.4-beta.2 (d08aae07) pins 23034fe (0.4.2): not affected; origin/main contains a4a6350e'
  reproduce: 'M=/c/Users/chand/Downloads/app_dev/material_testing-readiness

    git -C $M ls-tree a4a6350e^1 engine; git -C $M ls-tree a4a6350e^2 engine; git -C $M ls-tree a4a6350e engine   # f072da0,
    f072da0, 1284edf

    git -C $M/engine show 1284edf:CMakeLists.txt | sed -n 4p                                                        # VERSION
    0.2.3

    git -C $M/engine show 1284edf:adapters/android/jni/SemperJNI.cpp | grep -c Incremental                          # 0

    grep -n "external fun .*Incremental" $M/app/src/main/java/com/sempermechanics/semper/SemperNativeLib.kt          # 3 declarations

    '
  proposed_fix: 'On the fork: `git -C engine checkout f072da0 && git add engine` on a branch, re-run the fork''s real-data
    checks (real_data_steel_tensile.py, real_data_pmma_bending.py) per FORK_SYNC.md step 4, run Tier 3 + Tier 5. Add the gitlink
    guard from TE2-006 to the fork''s CI and a FORK_SYNC.md step: after a sync merge, `git ls-tree HEAD engine` must equal
    semperdic''s pin unless the fork deliberately differs. Add one androidTest that runs an incremental solve through the
    JNI so a missing symbol fails Tier 3.'
  files_touched:
  - 'M: engine (gitlink)'
  - 'M: .github/workflows/ci.yml'
  - 'M: docs/ops/FORK_SYNC.md'
  - 'M: app/src/androidTest/java/com/sempermechanics/semper/pipeline/EnginePipelineSmokeTest.kt'
  effort: S
  fix_risk: 'low — restores the pin both merge parents already had; measurement output returns to the declared and validated
    v0.6.1 (not an oracle change: .dat/GIF goldens are engine-independent)'
  external_action: 'Admin: do not cut a Material Testing release from 839d4285; confirm no internal build from it reached
    testers.'
  status: confirmed
  verdict: CONFIRMED
  verified_by_command: git -C $M ls-tree {a4a6350e^1,a4a6350e^2,a4a6350e,HEAD,origin/main} engine; git -C $M diff a4a6350e^1
    a4a6350e -- engine; git -C $M/engine show 1284edf:CMakeLists.txt, describe, tag --points-at; git -C $M/engine show {1284edf,f072da0}:adapters/android/jni/SemperJNI.cpp
    | grep -o Java_com_[A-Za-z0-9_]*; git grep RegisterNatives 1284edf; grep external fun / Incremental in M SemperNativeLib.kt,
    BatchAnalysis.kt, RunSpec.kt, app/build.gradle.kts
  verified_observation: 'Both parents (1cc1084d #143, 968637cb) pin f072da03 (v0.6.1); the merge a4a6350e, HEAD 839d4285 and
    origin/main pin 1284edf7 (v0.2.3-2-g1284edf, CMake VERSION 0.2.3, an ancestor of f072da0). 1284edf''s adapter exports
    6 sempermechanics symbols, none incremental, no RegisterNatives; f072da0 exports 9. M SemperNativeLib.kt:83,105,114 declare
    the 3 incremental funs, called at BatchAnalysis.kt:171,263,363 when refUpdateInterval>0 (RunSpec.kt:48); the app builds
    ../engine/CMakeLists.txt, no catch of UnsatisfiedLinkError/Throwable in run/. The crash is inferred from the symbols (not
    built or run). v1.4-beta.2 pins 23034fe (0.4.2).'
  severity_final: P0
