- id: AE1-101
  axis: technical
  gate: UX
  title: Switching dark mode (or a scheduled dark theme) closes Semper and removes its pinned home-screen icon;
    wizard input is lost
  type: defect
  severity: P1
  criterion: 'AE-1 theming: a light/dark theme change keeps the current screen and its state (no task loss in a
    core flow)'
  evidence:
  - app/src/main/java/com/sempermechanics/semper/ui/common/LauncherIcon.kt:26-58 (sync enables the wanted alias
    and DISABLES the other with DONT_KILL_APP)
  - app/src/main/java/com/sempermechanics/semper/SemperApp.kt:77 (sync at process start), :81-84 (sync in Application.onConfigurationChanged)
  - app/src/main/AndroidManifest.xml:81-105 (LauncherLight / LauncherDark aliases of SplashActivity, the task root)
  - 'S/phase1/AE-1/dumps/themeswitch_logcat.txt: ~1 s after ''cmd uimode night no'' the task closes (m=CLOSE Task
    #44) and the launcher logs ''removing unavailable component ... LauncherDark'' / ''removing items from db ...
    removedComponents'''
  - S/phase1/AE-1/screens/repro_themeswitch_before.png, repro_themeswitch_after.png (Home -> launcher)
  - S/phase1/AE-1/screens/repro_themeswitch_wizard_before.png, repro_themeswitch_wizard_after.png (wizard step 1
    with a picked reference -> launcher)
  - S/phase1/AE-1/screens/repro_themeswitch_relaunch.png (relaunch lands on Home; the wizard selection is gone)
  - 'S/phase1/AE-1/screens/repro_themeswitch_run_before.png, repro_themeswitch_run_after.png (a Compute started
    before the switch still completed: the app-lifetime run survives, so no result loss)'
  - First launch after a theme change made while Semper was not running opens and immediately closes (13:45:36 and
    13:46:16 launches in the same logcat session); the second launch stays
  reproduce: '1) adb -s emulator-5584 shell cmd uimode night no; launch Semper twice from the launcher so it stays
    open. 2) Open + > pick a reference (wizard step 1). 3) adb -s emulator-5584 shell cmd uimode night yes. 4) Within
    ~1 s Semper''s task is gone (adb shell dumpsys activity activities | grep topResumedActivity shows the launcher)
    and the Semper icon disappears from the home screen if pinned. Relaunch: Home, wizard input lost.'
  proposed_fix: Never disable the alias that roots a live task. Swap aliases only when no Semper activity exists
    (e.g. defer to the next cold start before any activity is created, or in an onTrimMemory(UI_HIDDEN)+no-task
    check), or drop the alias swap and use one alias with an adaptive/monochrome icon. Keep LauncherIconTest; add
    an instrumented test that toggles night mode with HomeActivity resumed and asserts the activity is recreated,
    not finished.
  files_touched:
  - app/src/main/java/com/sempermechanics/semper/ui/common/LauncherIcon.kt
  - app/src/main/java/com/sempermechanics/semper/SemperApp.kt
  - app/src/main/AndroidManifest.xml
  effort: M
  fix_risk: medium — launcher-alias behaviour differs by launcher; needs a device check on Pixel and Samsung launchers
  external_action: null
  status: fixed-verified
  prior_id: null
  carried: false
  verdict: CONFIRMED
  severity_final: P1
  verified_by_command: Home resumed (task 51, root LauncherLight); adb -s emulator-5584 logcat -c; cmd uimode night
    yes; dumpsys activity activities | grep topResumedActivity; logcat -d. Then relaunch x2 in dark, + > Allow all
    > speckle_00 (wizard step 1, ref picked), cmd uimode night no, same checks, relaunch, + again
  verified_observation: 'night yes: HomeActivity relaunched (15:03:26) then ~1 s later ''Transition requested type=CLOSE
    triggerTask taskId=51 ... cmp=.LauncherLight'', ''m=CLOSE'', launcher ''removing unavailable component ... LauncherLight''
    and ''removing items from db ... removedComponents=[...LauncherLight]''; topResumedActivity = NexusLauncherActivity.
    Same on night no from wizard step 1 (LauncherDark removed, task gone). Relaunch lands on Home; + opens a fresh
    picker, the picked reference is gone. Code: LauncherIcon.kt:26-58 disables the other alias with DONT_KILL_APP;
    SemperApp.kt:77 and :81-84 call sync. (v1_101_logcat.txt, screens v1_101_*.png)'
  verifier_note: Arguably P0-adjacent (the app vanishes from a core flow like a crash), but no process death and
    no result loss, so P1 kept.
  decision: 'fix now (Admin 2026-10-28: complete everything but legal)'
  reverify: R2 VERIFIED
  fix_commits:
  - 1e2965655
  - 79d7a3826
