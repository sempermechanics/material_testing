- id: TE3-101
  axis: technical
  gate: G3
  title: 'Seat-reconciliation test fails on Windows + Python 3.12: the fake store''s SERVER_TIMESTAMP is the 15.6
    ms wall clock, so the revoke stamp and the next lastSeenAt collide'
  type: defect
  severity: P2
  criterion: 'Backend suite (CLAUDE.md: python -m pytest tests/ -q --cov=app --cov-fail-under=93) passes deterministically
    on every supported dev OS; a test''s verdict must not depend on clock resolution'
  evidence:
  - S/baseline/backend/pytest.log:178-179 -> FAILED tests/test_seat_reconciliation.py::test_the_holders_next_request_confirms_the_revoke_despite_the_throttle;
    1 failed, 2297 passed, 86 skipped
  - 'S/phase1/TE-3/seat_recon_runs.log: 3 of 3 isolated runs fail; time.get_clock_info(''time'') -> implementation=''GetSystemTimeAsFileTime()'',
    resolution=0.015625 on CPython 3.12.10 win64'
  - backend/tests/fake_firestore.py:96 (_resolve) and :172 (update) turn SERVER_TIMESTAMP into datetime.now(timezone.utc)
  - backend/app/repo/seats.py:371 stamps seat revokedAt; the holder's next request writes lastSeenAt via backend/app/repo/users.py:200-207
    (checkpoint forces the write, correct); backend/app/repo/reconcile.py:236 answers last_seen > revoked_at (strict).
    Within one 15.6 ms tick both stamps are equal, so the test reads revokedStillRunning (tests/test_seat_reconciliation.py:150-186)
  - 'Proof of cause and fix: S/phase1/TE-3/mono_clock_plugin.py (strictly increasing clock for fake_firestore only)
    -> tests/test_seat_reconciliation.py 15 passed (S/phase1/TE-3/seat_recon_monoclock.log); whole suite 2298 passed,
    86 skipped, 0 failed (S/phase1/TE-3/full_suite_monoclock.log)'
  - 'Other collision risks searched: only one strict comparison of two stored timestamps in app (reconcile.py:236;
    roster_io.py:254 uses >= against a computed cutoff; users.py:201 uses <=, which fails safe). Tests ordering
    by timestamp set explicit values (test_licence_delete.py:157-167, test_licence_desk.py:24-34, test_firestore_repo.py:157-166
    uses minute offsets); the fake breaks order_by ties on doc id (fake_firestore.py:296-301), so no other test
    is exposed today'
  - 'Production is not affected: real Firestore commit timestamps are microsecond and the next request commits after
    the revoke'
  reproduce: 'cd W/backend && PYTHONDONTWRITEBYTECODE=1 $V -m pytest -p no:cacheprovider --no-cov -q ''tests/test_seat_reconciliation.py::test_the_holders_next_request_confirms_the_revoke_despite_the_throttle''  #
    1 failed on Windows; then PYTHONPATH=S/phase1/TE-3 ... -p mono_clock_plugin -> passes'
  proposed_fix: 'Give fake_firestore one strictly increasing clock: a module-level _now() that returns max(datetime.now(utc),
    _last + 1 µs) and is used at :96 and :172 (and anywhere else the fake stamps SERVER_TIMESTAMP). Keeps app code
    and Linux behaviour unchanged. Optionally add a fake_firestore unit test that two consecutive SERVER_TIMESTAMP
    writes are strictly ordered.'
  files_touched:
  - backend/tests/fake_firestore.py
  effort: S
  fix_risk: low — test double only; the full suite passes with the monotonic clock (2298 passed)
  external_action: null
  status: fixed-verified
  prior_id: null
  carried: false
  verdict: CONFIRMED
  severity_final: P2
  verified_by_command: cd W/backend; venv312 pytest -p no:cacheprovider --no-cov -q tests/test_seat_reconciliation.py::test_the_holders_next_request_confirms_the_revoke_despite_the_throttle,
    13 isolated runs; whole file once; then own plugin S/phase2/V3/probe/v3_mono_clock.py (strictly increasing datetime
    for fake_firestore) via -p v3_mono_clock, 5 runs; time.get_clock_info('time')
  verified_observation: 'Isolated: 10 failed / 3 passed over 13 runs (flaky, not always-fail as the record says:
