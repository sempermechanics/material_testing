  axis: technical
  gate: G4
  title: Offline grace counts powered-on time, not calendar time, when the wall clock is set back to its high-water
    mark across a power-off; the limit is in a KDoc but not in ADR-023 Trade-offs or a test
  type: observation
  severity: observation
  criterion: 'G4 offline grace: at most 14 d offline (ADR-023 decision 6 scopes the clock rules to ''make casual
    clock changes useless'', not tamper-proof)'
  evidence:
  - 'app/src/main/java/com/sempermechanics/semper/data/account/entitlement/EntitlementClock.kt:119-131 (advance:
    on a new boot delta = elapsed since boot; rollback only if wall < highWater - 10 min, :123)'
  - 'app/src/main/java/com/sempermechanics/semper/data/account/entitlement/EntitlementClock.kt:78-80 (KDoc: a reboot
    ''undercounts the time the phone was off'')'
  - docs/adr/ADR-023-signed-offline-entitlement.md Trade-offs (no mention of the power-off undercount)
  - app/src/test/java/com/sempermechanics/semper/data/account/entitlement/EntitlementClockTest.kt:137-148 (reboot
    test sets the clock *below* the high-water mark; the 'held at high-water across power-off' case is not pinned)
  - 'Latent: no token is issued today (TE4-001)'
  reproduce: 'Read EntitlementClock.advance/effectiveNowMs: check in at T0, run 1 d (highWater = T0+1 d), power
    off 30 d, set the wall clock to T0+1 d before boot.

    On boot: wall >= highWater - 10 min -> no rollback; effective = max(T0+1 d, T0+1 d+uptime) -> Within, though
    31 calendar days passed.

    '
  proposed_fix: 'State in ADR-023 Trade-offs that the offline bound is 14 d of powered-on time for a user who resets
    the clock across power-offs (casual-tamper scope), and pin it with an EntitlementClockTest case so a later change
    is deliberate. Optional hardening after TD-10: shorten ENTITLEMENT_OFFLINE_GRACE_DAYS, or end grace on a boot
    whose wall clock has not advanced past the previous boot''s last reading.'
