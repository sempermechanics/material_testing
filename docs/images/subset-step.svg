<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="300" rx="10" fill="#ffffff" stroke="#d8dee4"/>
  <text x="24" y="30" font-size="13" font-weight="600" fill="#1f2328">Subset is what gets matched. Step is how far apart the matches sit.</text>

  <!-- speckle field -->
  <rect x="24" y="46" width="330" height="220" rx="6" fill="#f3f4f6" stroke="#d8dee4"/>
  <g fill="#8b96a0">
    <circle cx="52" cy="74" r="4"/><circle cx="96" cy="62" r="3"/><circle cx="140" cy="86" r="5"/>
    <circle cx="188" cy="68" r="3.5"/><circle cx="236" cy="90" r="4.5"/><circle cx="286" cy="70" r="3"/>
    <circle cx="66" cy="122" r="3.5"/><circle cx="118" cy="140" r="4.5"/><circle cx="164" cy="118" r="3"/>
    <circle cx="214" cy="146" r="4"/><circle cx="262" cy="124" r="3.5"/><circle cx="312" cy="142" r="4.5"/>
    <circle cx="48" cy="182" r="4"/><circle cx="100" cy="200" r="3"/><circle cx="150" cy="176" r="4.5"/>
    <circle cx="200" cy="206" r="3.5"/><circle cx="252" cy="184" r="4"/><circle cx="300" cy="204" r="3"/>
    <circle cx="74" cy="240" r="3.5"/><circle cx="130" cy="248" r="4"/><circle cx="182" cy="234" r="3"/>
    <circle cx="238" cy="250" r="4.5"/><circle cx="292" cy="238" r="3.5"/>
  </g>

  <!-- grid points -->
  <g fill="#0288d1">
    <circle cx="80" cy="100" r="3"/><circle cx="140" cy="100" r="3"/><circle cx="200" cy="100" r="3"/>
    <circle cx="260" cy="100" r="3"/><circle cx="320" cy="100" r="3"/>
    <circle cx="80" cy="160" r="3"/><circle cx="140" cy="160" r="3"/><circle cx="200" cy="160" r="3"/>
    <circle cx="260" cy="160" r="3"/><circle cx="320" cy="160" r="3"/>
    <circle cx="80" cy="220" r="3"/><circle cx="140" cy="220" r="3"/><circle cx="200" cy="220" r="3"/>
    <circle cx="260" cy="220" r="3"/><circle cx="320" cy="220" r="3"/>
  </g>

  <!-- one subset -->
  <rect x="112" y="132" width="56" height="56" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="176" y="150" font-size="11" fill="#d64545" font-weight="600">subset</text>
  <text x="176" y="165" font-size="10" fill="#656d76">one match</text>

  <!-- step bracket -->
  <path d="M200 244 h60" stroke="#0288d1" stroke-width="1.5"/>
  <path d="M200 240 v8 M260 240 v8" stroke="#0288d1" stroke-width="1.5"/>
  <text x="230" y="262" text-anchor="middle" font-size="11" fill="#0288d1" font-weight="600">step</text>

  <!-- right column notes -->
  <rect x="386" y="60" width="350" height="86" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="404" y="84" font-size="12" font-weight="600" fill="#1f2328">Bigger subset</text>
  <text x="404" y="104" font-size="11" fill="#656d76">More pattern in each match. Survives weak speckle.</text>
  <text x="404" y="122" font-size="11" fill="#656d76">Smooths sharp strain gradients.</text>

  <rect x="386" y="162" width="350" height="86" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="404" y="186" font-size="12" font-weight="600" fill="#1f2328">Smaller step</text>
  <text x="404" y="206" font-size="11" fill="#656d76">More points, denser field.</text>
  <text x="404" y="224" font-size="11" fill="#656d76">Halving it roughly quadruples the run time.</text>
</svg>
