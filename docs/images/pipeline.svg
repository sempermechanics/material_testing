<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="210" rx="10" fill="#ffffff" stroke="#d8dee4"/>

  <!-- inputs -->
  <rect x="24" y="38" width="150" height="52" rx="8" fill="#e8f4fb" stroke="#0288d1"/>
  <text x="99" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Reference frame</text>
  <text x="99" y="78" text-anchor="middle" font-size="11" fill="#656d76">undeformed, ×1</text>

  <rect x="24" y="112" width="150" height="52" rx="8" fill="#e8f4fb" stroke="#0288d1"/>
  <text x="99" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Deformed frames</text>
  <text x="99" y="152" text-anchor="middle" font-size="11" fill="#656d76">one per load step, ×N</text>

  <path d="M180 64 h40 l0 37" stroke="#9aa4ae" stroke-width="1.5" fill="none"/>
  <path d="M180 138 h40 l0 -37" stroke="#9aa4ae" stroke-width="1.5" fill="none"/>
  <path d="M220 101 h34" stroke="#9aa4ae" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4ae"/>
    </marker>
  </defs>

  <!-- solver -->
  <rect x="258" y="60" width="180" height="84" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="348" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Match subsets</text>
  <text x="348" y="107" text-anchor="middle" font-size="11" fill="#656d76">on a grid inside your ROI</text>
  <text x="348" y="125" text-anchor="middle" font-size="11" fill="#656d76">runs on the phone</text>

  <path d="M444 102 h34" stroke="#9aa4ae" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect x="486" y="30" width="250" height="150" rx="8" fill="#ffffff" stroke="#d8dee4"/>
  <text x="502" y="52" font-size="12" font-weight="600" fill="#1f2328">Five fields, per frame</text>

  <rect x="502" y="64" width="100" height="26" rx="5" fill="#eef6ec" stroke="#7fb069"/>
  <text x="552" y="81" text-anchor="middle" font-size="12" fill="#1f2328">U · V</text>
  <text x="614" y="81" font-size="11" fill="#656d76">displacement, px</text>

  <rect x="502" y="100" width="100" height="26" rx="5" fill="#fdf0e6" stroke="#e8a05c"/>
  <text x="552" y="117" text-anchor="middle" font-size="12" fill="#1f2328">Exx · Eyy · Exy</text>
  <text x="614" y="117" font-size="11" fill="#656d76">strain, mε</text>

  <text x="502" y="150" font-size="11" fill="#656d76">Plus ZNSSD per point —</text>
  <text x="502" y="166" font-size="11" fill="#656d76">the match quality, in the CSV.</text>
</svg>
