<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="280" rx="10" fill="#ffffff" stroke="#d8dee4"/>
  <text x="24" y="32" font-size="13" font-weight="600" fill="#1f2328">The virtual strain gauge is the distance one strain value covers.</text>
  <text x="24" y="52" font-size="11" fill="#656d76">Strain comes from a plane fitted to every grid point inside a circle. The strain window is that circle's diameter, in px.</text>

  <!-- same window, two steps -->
  <circle cx="150" cy="140" r="50" fill="#e8f4fb" stroke="#0288d1" stroke-dasharray="4 3"/>
  <circle cx="370" cy="140" r="50" fill="#e8f4fb" stroke="#0288d1" stroke-dasharray="4 3"/>
  <g fill="#c9d1d9">
    <circle cx="90" cy="80" r="3.5"/><circle cx="90" cy="100" r="3.5"/><circle cx="90" cy="120" r="3.5"/><circle cx="90" cy="140" r="3.5"/><circle cx="90" cy="160" r="3.5"/><circle cx="90" cy="180" r="3.5"/><circle cx="90" cy="200" r="3.5"/><circle cx="110" cy="80" r="3.5"/><circle cx="110" cy="100" r="3.5"/><circle cx="110" cy="180" r="3.5"/><circle cx="110" cy="200" r="3.5"/><circle cx="130" cy="80" r="3.5"/><circle cx="130" cy="200" r="3.5"/><circle cx="150" cy="80" r="3.5"/><circle cx="150" cy="200" r="3.5"/><circle cx="170" cy="80" r="3.5"/><circle cx="170" cy="200" r="3.5"/><circle cx="190" cy="80" r="3.5"/><circle cx="190" cy="100" r="3.5"/><circle cx="190" cy="180" r="3.5"/><circle cx="190" cy="200" r="3.5"/><circle cx="210" cy="80" r="3.5"/><circle cx="210" cy="100" r="3.5"/><circle cx="210" cy="120" r="3.5"/><circle cx="210" cy="140" r="3.5"/><circle cx="210" cy="160" r="3.5"/><circle cx="210" cy="180" r="3.5"/><circle cx="210" cy="200" r="3.5"/><circle cx="330" cy="100" r="3.5"/><circle cx="330" cy="180" r="3.5"/><circle cx="410" cy="100" r="3.5"/><circle cx="410" cy="180" r="3.5"/>
  </g>
  <g fill="#0288d1">
    <circle cx="110" cy="120" r="3.5"/><circle cx="110" cy="140" r="3.5"/><circle cx="110" cy="160" r="3.5"/><circle cx="130" cy="100" r="3.5"/><circle cx="130" cy="120" r="3.5"/><circle cx="130" cy="140" r="3.5"/><circle cx="130" cy="160" r="3.5"/><circle cx="130" cy="180" r="3.5"/><circle cx="150" cy="100" r="3.5"/><circle cx="150" cy="120" r="3.5"/><circle cx="150" cy="140" r="3.5"/><circle cx="150" cy="160" r="3.5"/><circle cx="150" cy="180" r="3.5"/><circle cx="170" cy="100" r="3.5"/><circle cx="170" cy="120" r="3.5"/><circle cx="170" cy="140" r="3.5"/><circle cx="170" cy="160" r="3.5"/><circle cx="170" cy="180" r="3.5"/><circle cx="190" cy="120" r="3.5"/><circle cx="190" cy="140" r="3.5"/><circle cx="190" cy="160" r="3.5"/><circle cx="330" cy="140" r="3.5"/><circle cx="370" cy="100" r="3.5"/><circle cx="370" cy="140" r="3.5"/><circle cx="370" cy="180" r="3.5"/><circle cx="410" cy="140" r="3.5"/>
  </g>

  <!-- vsg spans -->
  <path d="M100 216 h100 M320 216 h100" stroke="#d64545" stroke-width="2"/>
  <path d="M100 210 v12 M200 210 v12 M320 210 v12 M420 210 v12" stroke="#d64545" stroke-width="2"/>
  <text x="150" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#d64545">VSG</text>
  <text x="370" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#d64545">VSG</text>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#656d76">step s · 21 points fitted</text>
  <text x="370" y="250" text-anchor="middle" font-size="11" fill="#656d76">step 2s · 5 points fitted</text>

  <!-- formula -->
  <rect x="510" y="80" width="226" height="126" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="528" y="106" font-size="12" font-weight="600" fill="#1f2328">VSG = strain window   [px]</text>
  <text x="528" y="130" font-size="11" fill="#656d76">The window is a diameter, not a</text>
  <text x="528" y="146" font-size="11" fill="#656d76">count of points. Step sets how</text>
  <text x="528" y="162" font-size="11" fill="#656d76">many points land inside it.</text>
  <text x="528" y="186" font-size="11" fill="#656d76">Quote the VSG in a paper.</text>

  <text x="24" y="270" font-size="11" fill="#656d76">Wider window: smoother strain, less local detail. Narrower: more detail, more noise.</text>
</svg>
