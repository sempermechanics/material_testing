  <text x="24" y="32" font-size="13" font-weight="600" fill="#1f2328">The strain window is a count of points; the virtual strain gauge is the distance it covers.</text>
  <text x="24" y="52" font-size="11" fill="#656d76">Strain comes from a plane fitted to every grid point within (window − 1) / 2 steps of the centre.</text>

