  <text x="150" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#d64545">VSG = 4s + 1</text>
  <text x="380" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#d64545">VSG = 8s + 1</text>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#656d76">step s · 5-point window · 13 fitted</text>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#656d76">step 2s · 5-point window · 13 fitted</text>

  <!-- formula -->
  <rect x="500" y="80" width="236" height="132" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="516" y="106" font-size="12" font-weight="600" fill="#1f2328">VSG = (window − 1) × step + 1</text>
  <text x="516" y="124" font-size="11" fill="#656d76">window in points, VSG in px</text>
  <text x="516" y="148" font-size="11" fill="#656d76">The app shows the VSG under</text>
  <text x="516" y="164" font-size="11" fill="#656d76">the slider and in the results.</text>
  <text x="516" y="188" font-size="11" fill="#656d76">Quote the VSG in a paper.</text>

  <text x="24" y="280" font-size="11" fill="#656d76">Wider window or coarser step: smoother strain, less local detail. Narrower: more detail, more noise.</text>
</svg>
