rcle cx="186" cy="171" r="3.5"/><circle cx="198" cy="171" r="3.5"/><circle cx="102" cy="183" r="3.5"/><circle cx="114" cy="183" r="3.5"/><circle cx="126" cy="183" r="3.5"/><circle cx="138" cy="183" r="3.5"/><circle cx="150" cy="183" r="3.5"/><circle cx="162" cy="183" r="3.5"/><circle cx="174" cy="183" r="3.5"/><circle cx="186" cy="183" r="3.5"/><circle cx="198" cy="183" r="3.5"/></g>
