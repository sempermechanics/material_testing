  /v1/institutions/licenses:
    get:
      operationId: institutionMyLicenses
      description: >
        Which institution licences the caller administers, found from their
        verified email rather than from a licence id they already hold. This
        is what lets one sign-in page route somebody to their own roster.
        An empty list is the ordinary answer and is not an error. No
        /v1/campus alias: the route is new, so nothing pre-rename calls it.
      responses:
        '200': { description: OK }
        '403': { description: email_not_verified }
        '429': { description: Rate limited }
  /v1/institutions/licenses/{licenseId}/seats:
    post:
      operationId: institutionAddSeat
      description: >
        Put someone on this license's roster, by email. They do not need an
        account yet: an address that has one takes a seat immediately, and an
        address that does not becomes a pending invite, redeemed automatically
        at that person's first sign-in. Exactly one of seat and invite is
        returned. An invite holds no seat and consumes no slot — there is no
        uid to entitle until it is claimed. On an assigned license a seat
        entitles immediately; on a floating one it makes the holder eligible
        and a slot is taken by checking out a lease.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
      responses:
        '200': { description: "OK — carries either seat or invite" }
        '400': { description: invalid_email }
        '403': { description: email_not_verified }
        '404': { description: license_not_found }
        '409': { description: "Roster full, seat on hold, or that address is already promised to a different licence (license_seats_exhausted, license_seat_disabled, invite_exists)" }
        '429': { description: Rate limited }
    get:
      operationId: institutionListSeats
      description: >
        Institution self-service, no dashboard UI — driven by IT's own
        tooling/curl. Requires an ID token (not device-attested) whose
        *verified* email is present in this license's adminEmails; a
        license id the caller does not administer 404s identically to one
        that does not exist, so probing another institution's license ids
        learns nothing. Lists every seat: uid, email, device lock, status,
        plus the outstanding invites — addresses promised a place who have
        not signed in yet. Never returns key plaintext.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '403': { description: email_not_verified }
        '404': { description: "license_not_found (unknown, not an institution license, or not administered by caller)" }
        '429': { description: Rate limited }
