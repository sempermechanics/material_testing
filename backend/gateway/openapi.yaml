      description: >
        Withdraw a promise that has not been kept yet. Addressed by the invite
        id from the seats listing rather than by email, so addresses stay out
        of request paths and access logs. Nothing to undo on the account side:
        an unclaimed invite never entitled anyone. Removing a member who HAS
        signed in is the seat revoke route. An invite id belonging to another
        licence 404s identically to one that does not exist.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
        - name: inviteKey
          in: path
          required: true
