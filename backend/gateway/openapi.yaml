swagger: '2.0'
info:
  title: Semper API
  description: >
    API Gateway front door for the private Semper Cloud Run service.
    Device-attested routes require headers X-Device-Id, X-Nonce, X-Signature
    (ECDSA-P256 over nonce+METHOD+path+sha256(body)) in addition to the
    end-user Bearer ID token (Authorization or X-Forwarded-Authorization).

    State-changing /v1/admin/* routes accept EITHER that attestation or, for
    the staff web console, an admin ID token that records a completed second
    factor (firebase.sign_in_second_factor) from a sign-in newer than
    ADMIN_WEB_REAUTH_SECONDS. A browser cannot produce an attestation, which
    is what previously kept the console read-only. The browser path is
    genuinely weaker than device binding — a phished live MFA session inside
    the freshness window can act — and is withdrawn entirely by setting
    ADMIN_WEB_MFA_ENABLED=0. Admin *reads* require neither.

    POST /v1/tasks/provision-session is deliberately absent: it is the Cloud
    Tasks callback, delivered straight to the Cloud Run URL with an OIDC token
    for the task invoker service account, and must not be reachable through the
    public front door at all.
  version: '1.0'
schemes:
  - https
produces:
  - application/json
# All requests are forwarded to the private Cloud Run service, invoked with the
# gateway's backend-auth service account. The incoming path is appended to the
# address, so the backend sees the same path.
#
# Template — replace before `gcloud api-gateway api-configs create`:
#   CLOUD_RUN_URL=$(gcloud run services describe indic-api --region REGION \
#                     --format='value(status.url)')
#   # FIREBASE_PROJECT_ID must be the Auth project (e.g. indicvision-dic-app-auth),
#   # which can differ from GOOGLE_CLOUD_PROJECT (e.g. indicvision-dic-app).
#   sed -e "s|__CLOUD_RUN_URL__|${CLOUD_RUN_URL}|g" \
#       -e "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g" \
#       openapi.yaml > openapi.generated.yaml
# Never commit a live Cloud Run hostname or project id here.
# Never substitute GOOGLE_CLOUD_PROJECT into the Firebase audience/issuer.
#
# jwt_audience makes ESPv2 mint an ID token for the Cloud Run service on each
# forwarded request. That is what lets the service drop --allow-unauthenticated
# and grant run.invoker to the gateway SA alone. Without it the Cloud Run URL is
# directly reachable and every quota below is bypassable.
x-google-backend:
  address: __CLOUD_RUN_URL__
  jwt_audience: __CLOUD_RUN_URL__
  path_translation: APPEND_PATH_TO_ADDRESS
  deadline: 60.0
# End-user authentication at the edge. ESPv2 validates the Firebase ID token,
# rejects a malformed/expired one before it ever reaches Cloud Run, and moves
# the original token to X-Forwarded-Authorization — which is exactly what
# app/deps.py::_client_bearer already reads. The backend still verifies the
# token itself; this is defence in depth, not a replacement.
securityDefinitions:
  firebase:
    authorizationUrl: ''
    flow: implicit
    type: oauth2
    x-google-issuer: https://securetoken.google.com/__FIREBASE_PROJECT_ID__
    x-google-jwks_uri: https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com
    x-google-audiences: __FIREBASE_PROJECT_ID__
# Applies to every operation; the health probes opt out with `security: []`.
security:
  - firebase: []
# Per-consumer quotas (ESPv2 / Service Management). Deploy with the gateway
# OpenAPI config so these metrics are registered; in-process token buckets in
# app/rate_limit.py are belt-and-braces per Cloud Run instance.
x-google-management:
  metrics:
    - name: challenge-requests
      displayName: Challenge requests
      valueType: INT64
      metricKind: DELTA
    - name: session-create-requests
      displayName: Session create requests
      valueType: INT64
      metricKind: DELTA
    - name: download-requests
      displayName: File download requests
      valueType: INT64
      metricKind: DELTA
    - name: health-requests
      displayName: Health requests
      valueType: INT64
      metricKind: DELTA
    - name: device-register-requests
      displayName: Device registration requests
      valueType: INT64
      metricKind: DELTA
    - name: session-list-requests
      displayName: Session listing requests
      valueType: INT64
      metricKind: DELTA
    - name: file-complete-requests
      displayName: File completion requests
      valueType: INT64
      metricKind: DELTA
  quota:
    limits:
      - name: challenge-per-minute
        metric: challenge-requests
        unit: 1/min/{project}
        values:
          STANDARD: 60
      - name: session-create-per-minute
        metric: session-create-requests
        unit: 1/min/{project}
        values:
          STANDARD: 30
      - name: download-per-minute
        metric: download-requests
        unit: 1/min/{project}
        values:
          STANDARD: 60
      - name: health-per-minute
        metric: health-requests
        unit: 1/min/{project}
        values:
          STANDARD: 300
      - name: device-register-per-minute
        metric: device-register-requests
        unit: 1/min/{project}
        values:
          STANDARD: 20
      - name: session-list-per-minute
        metric: session-list-requests
        unit: 1/min/{project}
        values:
          STANDARD: 60
      - name: file-complete-per-minute
        metric: file-complete-requests
        unit: 1/min/{project}
        values:
          STANDARD: 120
paths:
  /healthz:
    get:
      operationId: healthz
      # Load balancers and uptime checks have no ID token.
      security: []
      x-google-quota:
        metricCosts:
          health-requests: 1
      responses:
        '200': { description: OK }
  /readyz:
    get:
      operationId: readyz
      description: Readiness — Firestore + Drive probes; stable 503 detail codes.
      security: []
      x-google-quota:
        metricCosts:
          health-requests: 1
      responses:
        '200': { description: Ready }
        '503': { description: Dependency unhealthy }
  /v1/me:
    get:
      operationId: getMe
      responses:
        '200': { description: OK }
    delete:
      operationId: deleteAccount
      description: Device-attested GDPR erasure.
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/config:
    get:
      operationId: getConfig
      description: Resolved product limits for the caller (per-user override or fleet default).
      responses:
        '200': { description: OK }
  /v1/me/export:
    get:
      operationId: exportAccount
      description: Device-attested GDPR data portability export.
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/me/terms:
    post:
      operationId: acceptTerms
      description: Record clickwrap acceptance of the current Terms version (PENDING accounts allowed).
      responses:
        '200': { description: OK }
        '409': { description: Client sent a version other than the current one }
  /v1/me/consents:
    put:
      operationId: setConsents
      description: Grant or withdraw the optional product-improvement consent (PENDING accounts allowed).
      responses:
        '200': { description: OK }
  /v1/devices/register:
    post:
      operationId: registerDevice
      x-google-quota:
        metricCosts:
          device-register-requests: 1
      responses:
        '201': { description: Created }
        '409': { description: Another device already bound }
  /v1/challenge:
    post:
      operationId: challenge
      description: Mint a single-use nonce for device attestation.
      x-google-quota:
        metricCosts:
          challenge-requests: 1
      responses:
        '200': { description: OK }
        '429': { description: Rate limited }
  /v1/sessions:
    get:
      operationId: listSessions
      description: >
        Gateway quota covers every list request because OpenAPI v2 quotas cannot
        vary by the verify query value. The backend additionally rate-limits only
        verify=true, which performs Drive fan-out.
      x-google-quota:
        metricCosts:
          session-list-requests: 1
      parameters:
        # Deep check: also confirm each session's blobs still exist in Drive.
        - name: verify
          in: query
          required: false
          type: boolean
        - name: page_size
          in: query
          required: false
          type: integer
          default: 50
          description: Page size (1..100).
        - name: page_token
          in: query
          required: false
          type: string
          description: Opaque cursor from a previous nextPageToken.
      responses:
        '200': { description: OK }
    post:
      operationId: createSession
      description: >
        Device-attested. Idempotent on localSessionId while the session is
        in flight (PROVISIONING or UPLOADING).
        Requires attestation headers (X-Device-Id, X-Nonce, X-Signature).
        Returns status PROVISIONING with an empty uploads list when the Drive
        upload targets are being opened by a Cloud Task; poll
        GET /v1/sessions/{sid}/uploads until status is UPLOADING.
      x-google-quota:
        metricCosts:
          session-create-requests: 1
      responses:
        '200': { description: OK }
        '409': { description: session_quota_exceeded }
        '413': { description: too_many_files }
        '429': { description: Rate limited }
        '401': { description: Missing or invalid device attestation }
  /v1/sessions/{sid}:
    delete:
      operationId: deleteSession
      parameters:
        - name: sid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/sessions/{sid}/uploads:
    get:
      operationId: sessionUploads
      description: >
        Device-attested. Returns Drive resumable upload URIs, which are bearer
        capabilities to write into the user's Drive folder — so this read is
        gated as strongly as the writes that mint and consume them.
        Requires attestation headers (X-Device-Id, X-Nonce, X-Signature).
      parameters:
        - name: sid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '429': { description: Rate limited }
  /v1/sessions/{sid}/files:
    get:
      operationId: listSessionFiles
      parameters:
        - name: sid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
  /v1/sessions/{sid}/bundle:
    get:
      operationId: downloadSessionBundle
      description: >
        The whole analysis as one zip, at the user step-up tier: a second
        factor and a recent sign-in stand in for device attestation, so this
        is reachable from a browser where /v1/files/{fileId}/content is not.
        Entries are <role>/<name> plus a manifest.json, stored rather than
        deflated. Streamed straight from Drive, so it needs the same longer
        deadline as the single-file proxy rather than the 60s JSON budget.
      produces:
        - application/zip
      # Operation-level backend MUST restate address + APPEND_PATH_TO_ADDRESS —
      # omitting path_translation defaults to CONSTANT_ADDRESS and breaks routing.
      x-google-backend:
        address: __CLOUD_RUN_URL__
        jwt_audience: __CLOUD_RUN_URL__
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 300.0
      x-google-quota:
        metricCosts:
          download-requests: 1
      parameters:
        - name: sid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid ID token }
        '403': { description: "mfa_required, reauth_required, or feature_not_licensed" }
        '404': { description: session_not_found }
        '409': { description: "file_not_uploaded — nothing in this analysis finished uploading" }
        '429': { description: Rate limited }
        '502': { description: Drive download failed }
  /v1/files/{fileId}/complete:
    post:
      operationId: completeFile
      description: Device-attested. driveFileId must be a child of the session Drive folder.
      x-google-quota:
        metricCosts:
          file-complete-requests: 1
      parameters:
        - name: fileId
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '403': { description: file_not_in_session }
        '422': { description: size or checksum mismatch }
  /v1/files/{fileId}/content:
    get:
      operationId: downloadFile
      description: >
        Device-attested download (same verified_device headers as writes).
        Signature covers GET + path + empty body; Range is an unsigned header.
        Session.zip is proxied through Cloud Run, so this route needs a longer
        deadline than the top-level 60s JSON budget.
      produces:
        - application/octet-stream
      # Operation-level backend MUST restate address + APPEND_PATH_TO_ADDRESS —
      # omitting path_translation defaults to CONSTANT_ADDRESS and breaks routing.
      x-google-backend:
        address: __CLOUD_RUN_URL__
        jwt_audience: __CLOUD_RUN_URL__
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 300.0
      x-google-quota:
        metricCosts:
          download-requests: 1
      parameters:
        - name: fileId
          in: path
          required: true
          type: string
        - name: Range
          in: header
          required: false
          type: string
          description: Optional byte range (e.g. bytes=1024-); proxied to Drive as 206.
      responses:
        '200': { description: OK }
        '206': { description: Partial content }
        '401': { description: Missing or invalid device attestation }
        '403': { description: feature_not_licensed (demo mode — recording is open, retrieval is licensed) }
        '416': { description: range_not_satisfiable }
        '429': { description: Rate limited }
        '502': { description: Drive download failed }
  /v1/admin/users:
    get:
      operationId: adminListUsers
      parameters:
        - name: status
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          description: 1..1000 (default 200); clamped server-side.
      responses:
        '200': { description: OK }
  /v1/admin/users/{uid}/approve:
    post:
      operationId: adminApproveUser
      description: >
        Admin state change: device attestation, or a second-factor admin
        session from the console. See the step-up note in the API description.
      parameters:
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '403': { description: "Console path: no second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
  /v1/admin/users/{uid}/revoke:
    post:
      operationId: adminRevokeUser
      description: >
        Admin state change: device attestation, or a second-factor admin
        session from the console. See the step-up note in the API description.
      parameters:
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '403': { description: "Console path: no second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
  /v1/admin/users/{uid}/config:
    patch:
      operationId: adminPatchUserConfig
      description: >
        Admin state change (attestation or console second factor). Set or clear
        per-user product-limit overrides (maxSessions, maxFilesPerSession,
        maxFrames).
      parameters:
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '400': { description: Empty patch }
        '401': { description: Missing or invalid device attestation }
        '403': { description: "Console path: no second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
        '404': { description: User not found }
  /v1/licenses/checkout:
    post:
      operationId: checkoutLease
      description: >
        Take or renew a floating seat on an institution license. Re-calling
        this IS the heartbeat — renewing an existing lease extends it without
        consuming a second slot, so there is no separate heartbeat route. The
        response carries leaseExpiresAt and leaseHeartbeatMinutes so the client
        knows when to call again. 409 no_floating_seat means the pool is
        currently full; the caller stays eligible and in demo mode, and may
        retry. Requires X-Device-Id.
      responses:
        '200': { description: OK }
        '403': { description: "Not on the roster, revoked, or the license expired (not_eligible, license_revoked, license_expired)" }
        '404': { description: "No license attached to this account" }
        '409': { description: "Pool full, or the license is not floating (no_floating_seat, seating_not_floating)" }
        '429': { description: Rate limited }
  /v1/licenses/release:
    post:
      operationId: releaseLease
      description: >
        Give a floating seat back so another roster member can take it.
        Idempotent — releasing a lease that already lapsed frees nothing and
        still succeeds.
      responses:
        '200': { description: OK }
        '403': { description: not_eligible }
        '404': { description: "No license attached to this account" }
        '429': { description: Rate limited }
  /v1/licenses/unbind:
    post:
      operationId: unbindDevice
      description: >
        "Use Semper on a different device" — the holder unbinding their own
        licence or seat. Clearing the lock is the whole device change: the
        next device to sign in binds it, and nothing is typed. Clearing is not
        revoking — entitlement, seat, lease and data are untouched. Requires
        the user step-up (an attested device, or a second factor on a recent
        sign-in), and is subject to SELF_DEVICE_CHANGE_COOLDOWN_DAYS, which
        staff- and IT-initiated changes are not.
      responses:
        '200': { description: OK }
        '403': { description: "No second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
        '404': { description: "No license attached to this account, or no seat on it (no_license, seat_not_found)" }
        '429': { description: "Rate limited, or another change is too soon (device_change_too_soon)" }
  /v1/licenses/activate:
    post:
      operationId: activateLicense
      description: >
        Redeem a license key. For an individual key, locked to this account's
        email and device. For an institution key (kind=institution), the
        caller's verified email domain must match the license's domainLock;
        a seat is created (or re-bound to this device) on first activation,
        subject to maxSeats. Idempotent re-entry of the same key from the
        already-bound uid/device succeeds without consuming a new seat.
      responses:
        '200': { description: OK }
        '403': { description: "Lock mismatch, revoked, disabled seat, or domain mismatch (license_email_mismatch, license_device_mismatch, license_revoked, license_seat_disabled)" }
        '404': { description: Unknown key }
        '409': { description: "Already redeemed by another account, or institution seats exhausted (license_already_redeemed, license_seats_exhausted)" }
        '429': { description: Rate limited }
  /v1/admin/licenses:
    get:
      operationId: adminListLicenses
      responses:
        '200': { description: OK }
    post:
      operationId: adminCreateLicense
      description: >
        Device-attested, Semper-staff only. Mint a license key. `kind`
        selects the shape: "individual" (default) locks to one email and one
        device id, redeemed once. "institution" locks to a verified-email
        domain (domainLock) with self-service seat management delegated to
        adminEmails — see the /v1/institutions/licenses/{licenseId}/seats
        routes below; Semper staff never touch individual seats on an
        institution key. The plaintext key is returned once, either way.
        "campus" is accepted as the pre-rename spelling of "institution".
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '403': { description: "Console path: no second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
        '422': { description: "kind=institution missing domainLock/adminEmails, or kind=individual missing emailLock" }
  /v1/admin/licenses/{licenseId}:
    patch:
      operationId: adminUpdateLicense
      description: >
        Device-attested, Semper-staff only. Change an existing license's terms
        in place — this is the renewal path. Extending expiresAt re-entitles
        every current holder (the individual redeemer, or every non-revoked
        institution seat) without issuing a new key or asking anyone to
        re-activate; the new terms are pushed to their user documents before
        the response returns. Terms only: kind, the email/device/domain locks
        and the key itself are fixed at mint. Send only the fields that change.
        clearDeviceLock=true is the one field that is not a term: it unbinds an
        individual license from the device it is on so the customer can move to
        a new one, and may be sent alone. Use
        PATCH /v1/admin/licenses/{licenseId}/seats/{uid}/device for a member of
        an institution license.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '403': { description: "Console path: no second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
        '404': { description: License not found }
        '422': { description: "No field set, or a value out of range" }
        '429': { description: Rate limited }
  /v1/admin/licenses/{licenseId}/seats/{uid}/device:
    patch:
      operationId: adminClearSeatDeviceLock
      description: >
        Device-attested, Semper-staff only. Unbind one institution seat from
        the device it is on, so the member can move to a new one. The same
        operation institution IT has via clearDeviceLock on
        PATCH /v1/institutions/licenses/{licenseId}/seats/{uid}, at the staff
        tier — staff are not in a customer's adminEmails, so that route 404s
        for them. Clearing is not revoking: the seat, its lease and the
        member's data are untouched, and the next device to sign in binds.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '403': { description: "Console path: no second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
        '404': { description: "License or seat not found (license_not_found, seat_not_found)" }
        '429': { description: Rate limited }
  /v1/admin/licenses/{licenseId}/device-history:
    get:
      operationId: adminLicenseDeviceHistory
      description: >
        Semper-staff read of recent device bind / clear / unbind audit events
        for one licence. Ordinary admin token (same as listing licences) —
        not a mutation, so no device attestation / MFA step-up.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid ID token }
        '403': { description: Not an admin }
        '404': { description: License not found }
        '429': { description: Rate limited }
  /v1/admin/licenses/{licenseId}/reconcile:
    get:
      operationId: adminReconcileLicenseSeats
      description: >
        Semper-staff only, institution licenses only. The second seat count.
        seatsUsed, which is what institution IT sees, moves the instant a seat
        is revoked, so it reports what IT intended. This compares every seat
        against its holder's account and reports three buckets: active (with
        neverClaimed as the subset nobody has taken up), revokedConfirmed, and
        revokedStillRunning — a revoke that has not landed, either because the
        demotion never wrote (still_licensed, repaired by revoking the seat
        again) or because the device has not been back to hear it
        (no_checkin_since_revoke). A read: no second factor, no writes. Costs
        one user read per seat, so it is on demand rather than part of
        GET /v1/admin/licenses.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '400': { description: "Not an institution license, so there is no roster to reconcile (kind_not_institution)" }
        '401': { description: Missing or invalid ID token }
        '403': { description: Not an admin }
        '404': { description: License not found }
        '429': { description: Rate limited }
        '404': { description: License not found }
        '429': { description: Rate limited }
  /v1/admin/licenses/{licenseId}/revoke:
    post:
      operationId: adminRevokeLicense
      description: >
        Device-attested, Semper-staff only. Revoke a key. Individual:
        the redeemer drops to demo. Institution: every seat on the license
        drops to demo and seatsUsed resets to 0 — this is the whole-key
        revoke; for offboarding a single institution member without affecting
        anyone else's seat, institution IT should use
        DELETE /v1/institutions/licenses/{licenseId}/seats/{uid} instead.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '403': { description: "Console path: no second factor on the token, or the sign-in is too old (mfa_required, reauth_required)" }
        '404': { description: License not found }
  # ---------------------------------------------------------------------------
  # Pre-rename aliases of the three routes above. ESPv2 is the front door and
  # rejects any path absent from this spec, so the aliases FastAPI serves are
  # unreachable in production unless they are declared here too — leaving them
  # out would make the deprecation window exist only against a directly-hit
  # Cloud Run URL, which nothing can reach. Same backend, same auth, same
  # handler. Delete this block and the FastAPI aliases together.
  /v1/campus/licenses/{licenseId}/seats:
    post:
      operationId: campusAddSeat
      description: Deprecated alias of POST /v1/institutions/licenses/{licenseId}/seats.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
      responses:
