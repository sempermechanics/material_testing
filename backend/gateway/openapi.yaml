  /v1/institutions/licenses/{licenseId}/seats/{uid}:
    patch:
      operationId: institutionPatchSeat
      description: >
        Institution self-service. clearDeviceLock=true lets a seat holder
        re-bind to a new device without a Semper support ticket. enabled=false
        drops the seat to demo but does NOT free the slot (still counts
        against maxSeats); enabled=true restores the licensed mode in place,
        no data migration either direction. At least one field is required.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '400': { description: empty_patch }
        '403': { description: email_not_verified }
        '404': { description: license_not_found or seat_not_found }
        '429': { description: Rate limited }
    delete:
      operationId: institutionRevokeSeat
      description: >
        Institution self-service single-seat revoke: drops the holder to
        demo in place (no data loss) and frees the slot so another domain
        member can activate. Whole-key revoke stays on the Semper-staff
        POST /v1/admin/licenses/{licenseId}/revoke path above.
      parameters:
        - name: licenseId
          in: path
          required: true
          type: string
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '403': { description: email_not_verified }
        '404': { description: license_not_found or seat_not_found }
        '429': { description: Rate limited }
