swagger: '2.0'
info:
  title: Semper API
  description: >
    API Gateway front door for the private Semper Cloud Run service.
    Device-attested routes require headers X-Device-Id, X-Nonce, X-Signature
    (ECDSA-P256 over nonce+METHOD+path+sha256(body)) in addition to the
    end-user Bearer ID token (Authorization or X-Forwarded-Authorization).

    POST /v1/tasks/provision-session is deliberately absent: it is the Cloud
    Tasks callback, delivered straight to the Cloud Run URL with an OIDC token
    for the task invoker service account, and must not be reachable through the
    public front door at all.
  version: '1.0'
schemes:
  - https
produces:
  - application/json
# All requests are forwarded to the private Cloud Run service, invoked with the
# gateway's backend-auth service account. The incoming path is appended to the
# address, so the backend sees the same path.
#
# Template — replace before `gcloud api-gateway api-configs create`:
#   CLOUD_RUN_URL=$(gcloud run services describe indic-api --region REGION \
#                     --format='value(status.url)')
#   # FIREBASE_PROJECT_ID must be the Auth project (e.g. indicvision-dic-app-auth),
#   # which can differ from GOOGLE_CLOUD_PROJECT (e.g. indicvision-dic-app).
#   sed -e "s|__CLOUD_RUN_URL__|${CLOUD_RUN_URL}|g" \
#       -e "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g" \
#       openapi.yaml > openapi.generated.yaml
# Never commit a live Cloud Run hostname or project id here.
# Never substitute GOOGLE_CLOUD_PROJECT into the Firebase audience/issuer.
#
# jwt_audience makes ESPv2 mint an ID token for the Cloud Run service on each
# forwarded request. That is what lets the service drop --allow-unauthenticated
# and grant run.invoker to the gateway SA alone. Without it the Cloud Run URL is
# directly reachable and every quota below is bypassable.
x-google-backend:
  address: __CLOUD_RUN_URL__
  jwt_audience: __CLOUD_RUN_URL__
  path_translation: APPEND_PATH_TO_ADDRESS
  deadline: 60.0
# End-user authentication at the edge. ESPv2 validates the Firebase ID token,
# rejects a malformed/expired one before it ever reaches Cloud Run, and moves
# the original token to X-Forwarded-Authorization — which is exactly what
# app/deps.py::_client_bearer already reads. The backend still verifies the
# token itself; this is defence in depth, not a replacement.
securityDefinitions:
  firebase:
    authorizationUrl: ''
    flow: implicit
    type: oauth2
    x-google-issuer: https://securetoken.google.com/__FIREBASE_PROJECT_ID__
    x-google-jwks_uri: https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com
    x-google-audiences: __FIREBASE_PROJECT_ID__
# Applies to every operation; the health probes opt out with `security: []`.
security:
  - firebase: []
# Per-consumer quotas (ESPv2 / Service Management). Deploy with the gateway
# OpenAPI config so these metrics are registered; in-process token buckets in
# app/rate_limit.py are belt-and-braces per Cloud Run instance.
x-google-management:
  metrics:
    - name: challenge-requests
      displayName: Challenge requests
      valueType: INT64
      metricKind: DELTA
    - name: session-create-requests
      displayName: Session create requests
      valueType: INT64
      metricKind: DELTA
    - name: download-requests
      displayName: File download requests
      valueType: INT64
      metricKind: DELTA
    - name: health-requests
      displayName: Health requests
      valueType: INT64
      metricKind: DELTA
    - name: device-register-requests
      displayName: Device registration requests
      valueType: INT64
      metricKind: DELTA
    - name: session-list-requests
      displayName: Session listing requests
      valueType: INT64
      metricKind: DELTA
    - name: file-complete-requests
      displayName: File completion requests
      valueType: INT64
      metricKind: DELTA
  quota:
    limits:
      - name: challenge-per-minute
        metric: challenge-requests
        unit: 1/min/{project}
        values:
          STANDARD: 60
      - name: session-create-per-minute
        metric: session-create-requests
        unit: 1/min/{project}
        values:
          STANDARD: 30
      - name: download-per-minute
        metric: download-requests
        unit: 1/min/{project}
        values:
          STANDARD: 60
      - name: health-per-minute
        metric: health-requests
        unit: 1/min/{project}
        values:
          STANDARD: 300
      - name: device-register-per-minute
        metric: device-register-requests
        unit: 1/min/{project}
        values:
          STANDARD: 20
      - name: session-list-per-minute
        metric: session-list-requests
        unit: 1/min/{project}
        values:
          STANDARD: 60
      - name: file-complete-per-minute
        metric: file-complete-requests
        unit: 1/min/{project}
        values:
          STANDARD: 120
paths:
  /healthz:
    get:
      operationId: healthz
      # Load balancers and uptime checks have no ID token.
      security: []
      x-google-quota:
        metricCosts:
          health-requests: 1
      responses:
        '200': { description: OK }
  /readyz:
    get:
      operationId: readyz
      description: Readiness — Firestore + Drive probes; stable 503 detail codes.
      security: []
      x-google-quota:
        metricCosts:
          health-requests: 1
      responses:
        '200': { description: Ready }
        '503': { description: Dependency unhealthy }
  /v1/me:
    get:
      operationId: getMe
      responses:
        '200': { description: OK }
    delete:
      operationId: deleteAccount
      description: Device-attested GDPR erasure.
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/config:
    get:
      operationId: getConfig
      description: Resolved product limits for the caller (per-user override or fleet default).
      responses:
        '200': { description: OK }
  /v1/me/export:
    get:
      operationId: exportAccount
      description: Device-attested GDPR data portability export.
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/devices/register:
    post:
      operationId: registerDevice
      x-google-quota:
        metricCosts:
          device-register-requests: 1
      responses:
        '201': { description: Created }
        '409': { description: Another device already bound }
  /v1/challenge:
    post:
      operationId: challenge
      description: Mint a single-use nonce for device attestation.
      x-google-quota:
        metricCosts:
          challenge-requests: 1
      responses:
        '200': { description: OK }
        '429': { description: Rate limited }
  /v1/sessions:
    get:
      operationId: listSessions
      description: >
        Gateway quota covers every list request because OpenAPI v2 quotas cannot
        vary by the verify query value. The backend additionally rate-limits only
        verify=true, which performs Drive fan-out.
      x-google-quota:
        metricCosts:
          session-list-requests: 1
      parameters:
        # Deep check: also confirm each session's blobs still exist in Drive.
        - name: verify
          in: query
          required: false
          type: boolean
        - name: page_size
          in: query
          required: false
          type: integer
          default: 50
          description: Page size (1..100).
        - name: page_token
          in: query
          required: false
          type: string
          description: Opaque cursor from a previous nextPageToken.
      responses:
        '200': { description: OK }
    post:
      operationId: createSession
      description: >
        Device-attested. Idempotent on localSessionId while the session is
        in flight (PROVISIONING or UPLOADING).
        Requires attestation headers (X-Device-Id, X-Nonce, X-Signature).
        Returns status PROVISIONING with an empty uploads list when the Drive
        upload targets are being opened by a Cloud Task; poll
        GET /v1/sessions/{sid}/uploads until status is UPLOADING.
      x-google-quota:
        metricCosts:
          session-create-requests: 1
      responses:
        '200': { description: OK }
        '409': { description: session_quota_exceeded }
        '413': { description: too_many_files }
        '429': { description: Rate limited }
        '401': { description: Missing or invalid device attestation }
  /v1/sessions/{sid}:
    delete:
      operationId: deleteSession
      parameters:
        - name: sid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/sessions/{sid}/uploads:
    get:
      operationId: sessionUploads
      description: >
        Device-attested. Returns Drive resumable upload URIs, which are bearer
        capabilities to write into the user's Drive folder — so this read is
        gated as strongly as the writes that mint and consume them.
        Requires attestation headers (X-Device-Id, X-Nonce, X-Signature).
      parameters:
        - name: sid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
        '429': { description: Rate limited }
  /v1/sessions/{sid}/files:
    get:
      operationId: listSessionFiles
      parameters:
        - name: sid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
  /v1/files/{fileId}/complete:
    post:
      operationId: completeFile
      description: Device-attested. driveFileId must be a child of the session Drive folder.
      x-google-quota:
        metricCosts:
          file-complete-requests: 1
      parameters:
        - name: fileId
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '403': { description: file_not_in_session }
        '422': { description: size or checksum mismatch }
  /v1/files/{fileId}/content:
    get:
      operationId: downloadFile
      description: >
        Device-attested download (same verified_device headers as writes).
        Signature covers GET + path + empty body; Range is an unsigned header.
        Session.zip is proxied through Cloud Run, so this route needs a longer
        deadline than the top-level 60s JSON budget.
      produces:
        - application/octet-stream
      # Operation-level backend MUST restate address + APPEND_PATH_TO_ADDRESS —
      # omitting path_translation defaults to CONSTANT_ADDRESS and breaks routing.
      x-google-backend:
        address: __CLOUD_RUN_URL__
        jwt_audience: __CLOUD_RUN_URL__
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 300.0
      x-google-quota:
        metricCosts:
          download-requests: 1
      parameters:
        - name: fileId
          in: path
          required: true
          type: string
        - name: Range
          in: header
          required: false
          type: string
          description: Optional byte range (e.g. bytes=1024-); proxied to Drive as 206.
      responses:
        '200': { description: OK }
        '206': { description: Partial content }
        '401': { description: Missing or invalid device attestation }
        '416': { description: range_not_satisfiable }
        '429': { description: Rate limited }
        '502': { description: Drive download failed }
  /v1/admin/users:
    get:
      operationId: adminListUsers
      parameters:
        - name: status
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          description: 1..1000 (default 200); clamped server-side.
      responses:
        '200': { description: OK }
  /v1/admin/users/{uid}/approve:
    post:
      operationId: adminApproveUser
      description: Device-attested admin mutation.
      parameters:
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/admin/users/{uid}/revoke:
    post:
      operationId: adminRevokeUser
      description: Device-attested admin mutation.
      parameters:
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid device attestation }
  /v1/admin/users/{uid}/config:
    patch:
      operationId: adminPatchUserConfig
      description: >
        Device-attested. Set or clear per-user product-limit overrides
        (maxSessions, maxFilesPerSession, maxFrames).
      parameters:
        - name: uid
          in: path
          required: true
          type: string
      responses:
        '200': { description: OK }
        '400': { description: Empty patch }
        '401': { description: Missing or invalid device attestation }
        '404': { description: User not found }
